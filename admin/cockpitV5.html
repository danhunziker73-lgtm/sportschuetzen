<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vereins-Admin 2.0 | Sportschützen Muhen</title>
    <style>
        :root { 
            --primary: #4a90e2; --secondary: #2c3e50; --success: #27ae60; 
            --danger: #e74c3c; --warning: #f39c12; --bg: #f4f7f9; --card-bg: #ffffff;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--secondary); margin: 0; padding: 20px; }
        .container { max-width: 1800px; margin: auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .card { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        h2 { margin-top: 0; font-size: 1.2rem; border-left: 5px solid var(--primary); padding-left: 15px; margin-bottom: 20px; }

        /* Status-Farben */
        .row-warn { background-color: #fff5f5 !important; } /* Fehlende Daten */
        .row-provisorisch { background-color: #fff9db !important; } 
        .row-abgesagt { background-color: #f1f3f5 !important; color: #adb5bd; text-decoration: line-through; }

        /* Tabelle */
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { background: var(--secondary); color: white; text-align: left; padding: 12px; font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 8px; border-bottom: 1px solid #edf2f7; transition: background 0.3s; }
        
        input, select { padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 0.9rem; }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(74,144,226,0.1); }
        
        /* Validierung-Highlights */
        .empty-field { border: 2px solid var(--danger) !important; background-color: #fff8f8; }

        .btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-save { background: var(--success); color: white; font-size: 1.1rem; box-shadow: 0 4px 10px rgba(39,174,96,0.3); }
        .btn-add { background: var(--primary); color: white; margin-bottom: 15px; }
        .btn-del { background: #fee2e2; color: var(--danger); }

        /* Multi-Select Tags */
        .mail-tag-container { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 5px; padding: 5px; border: 1px solid #e2e8f0; border-radius: 6px; background: white; min-height: 40px; }
        .tag { background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; font-weight: 500; }
        .tag span { cursor: pointer; color: var(--danger); font-weight: bold; }

        .loader-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); display:flex; justify-content:center; align-items:center; z-index:9999; }
        .spinner { width: 50px; height: 50px; border: 5px solid #d1d5db; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader" class="loader-overlay"><div class="spinner"></div></div>

<div class="container">
    <header>
        <h1>Admin Zentrale Muhen</h1>
        <button class="btn btn-save" onclick="saveAll()">💾 Cloud-Daten speichern</button>
    </header>

    <div class="card">
        <h2>GV & Haupt-Konfiguration</h2>
        <div id="platzhalter-list"></div>
    </div>

    <div class="card">
        <h2>Jahresprogramm & Schiessplan</h2>
        <button class="btn btn-add" onclick="addTermin()">+ Neuer Termin</button>
        <div style="overflow-x:auto">
            <table>
                <thead>
                    <tr>
                        <th style="width:160px">Datum</th>
                        <th style="width:110px">Zeit</th>
                        <th>Anlass</th>
                        <th>Austragungsort</th>
                        <th>Map-Link</th>
                        <th style="width:150px">Kategorie</th>
                        <th style="width:140px">Status</th>
                        <th style="width:40px"></th>
                    </tr>
                </thead>
                <tbody id="termine-body"></tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <h2>Stammdaten-Editor</h2>
        <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px;">
            <div>
                <h3>Anlass-Typen</h3>
                <div id="edit-anlaesse"></div>
                <button class="btn btn-add" onclick="state.dropdowns.anlaesse.push(''); renderAll();">+ Anlass</button>
            </div>
            <div>
                <h3>Orte & Google Maps Links</h3>
                <div id="edit-orte"></div>
                <button class="btn btn-add" onclick="state.dropdowns.orteMitMaps.push(['','']); renderAll();">+ Ort</button>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Mail-Verteiler (App Info)</h2>
        <div id="app-info-list"></div>
    </div>
</div>

<script>
    const WORKER_URL = "https://termine.dan-hunziker73.workers.dev/"; 
    let state = { platzhalter: [], termine: [], app_info: [], members: [], dropdowns: { anlaesse:[], orteMitMaps:[], kategorien:[], status:[] } };

    const toIsoDate = (v) => (v && typeof v === 'string' && v.includes('T')) ? v.split('T')[0] : v;
    const toIsoTime = (v) => (v && typeof v === 'string' && v.includes('T')) ? v.split('T')[1].substring(0,5) : (v || "");

    async function loadData() {
        try {
            const resp = await fetch(`${WORKER_URL}?action=loadAdminData`);
            state = await resp.json();
            renderAll();
            document.getElementById('loader').style.display = 'none';
        } catch (err) { alert("Fehler beim Laden der Cloud-Daten: " + err); }
    }

    function renderAll() {
        renderPlatzhalter();
        renderTermine();
        renderStammdaten();
        renderAppInfo();
    }

    // Spezielle Mail-Listen Logik für GV-Felder
    function renderPlatzhalter() {
        const container = document.getElementById('platzhalter-list');
        container.innerHTML = state.platzhalter.map((p, i) => {
            const isMailField = p.platzhaltername?.includes('Mail_Anmeldeliste') || p.platzhaltername?.includes('Mail_Präsenzliste');
            const isIdField = p.platzhaltername?.includes('_ID');
            
            if (isMailField) {
                return `<div class="config-grid">
                    <strong>${p.platzhaltername}</strong>
                    <div>${renderMultiMail(p.inhalt, (val) => { state.platzhalter[i].inhalt = val; renderPlatzhalter(); })}</div>
                    <small>${p.erklärung || ''}</small>
                </div>`;
            }

            return `<div class="config-grid">
                <strong>${p.platzhaltername}</strong>
                <input type="text" value="${p.inhalt}" 
                    placeholder="${isIdField ? 'Drive ID oder Link einfügen...' : ''}"
                    onchange="${isIdField ? 'extractId(this, ' + i + ')' : 'state.platzhalter['+i+'].inhalt=this.value'}">
                <small>${p.erklärung || ''}</small>
            </div>`;
        }).join('');
    }

    function extractId(input, idx) {
        const val = input.value;
        const match = val.match(/[-\w]{25,}/); // Sucht nach typischer Google ID Länge
        const id = match ? match[0] : val;
        state.platzhalter[idx].inhalt = id;
        input.value = id;
    }

    function renderTermine() {
        const body = document.getElementById('termine-body');
        const ortsNamen = state.dropdowns.orteMitMaps.map(o => o[0]);
        
        body.innerHTML = state.termine.map((t, i) => {
            const d = toIsoDate(t.datum);
            const wd = d ? new Date(d).toLocaleDateString('de-DE', {weekday:'short'}) : '-';
            const status = t.status?.toLowerCase();
            
            // Logik für Einfärbung
            let rowClass = "";
            if (!t.datum || !t['anlass_/_titel'] || !t.startzeit) rowClass = "row-warn";
            if (status === 'provisorisch') rowClass = "row-provisorisch";
            if (status === 'abgesagt') rowClass = "row-abgesagt";

            return `<tr class="${rowClass}">
                <td><div style="display:flex; gap:5px; align-items:center;"><b style="color:var(--primary); width:35px;">${wd}</b><input type="date" class="${!t.datum?'empty-field':''}" value="${d}" onchange="state.termine[${i}].datum=this.value; renderTermine();"></div></td>
                <td><div style="display:flex; flex-direction:column; gap:2px;"><input type="time" class="${!t.startzeit?'empty-field':''}" value="${toIsoTime(t.startzeit)}" onchange="state.termine[${i}].startzeit=this.value"><input type="time" value="${toIsoTime(t.endzeit)}" onchange="state.termine[${i}].endzeit=this.value"></div></td>
                <td><select class="${!t['anlass_/_titel']?'empty-field':''}" onchange="state.termine[${i}]['anlass_/_titel']=this.value; renderTermine();"><option value="">-- wählen --</option>${state.dropdowns.anlaesse.map(o => `<option value="${o}" ${o===t['anlass_/_titel']?'selected':''}>${o}</option>`).join('')}</select></td>
                <td><select onchange="updateOrt(${i}, this.value)"><option value="">- Ort -</option>${ortsNamen.map(o => `<option value="${o}" ${o===t.ort?'selected':''}>${o}</option>`).join('')}</select></td>
                <td><input type="text" readonly value="${t.austragungsorte_map || ''}" style="font-size: 0.7rem;"></td>
                <td>${createSelect(state.dropdowns.kategorien, t.kategorie, i, 'kategorie')}</td>
                <td>${createSelect(state.dropdowns.status, t.status, i, 'status')}</td>
                <td><button class="btn btn-del" onclick="state.termine.splice(${i},1); renderTermine();">✕</button></td>
            </tr>`;
        }).join('');
    }

    function renderMultiMail(currentVal, updateFn) {
        const selected = currentVal ? currentVal.split(';').map(m => m.trim()).filter(m => m) : [];
        return `
            <div class="mail-tag-container">${selected.map(m => `<div class="tag">${m}<span onclick="const n=selected.filter(x=>x!=='${m}'); updateFn(n.join('; '));">×</span></div>`).join('')}</div>
            <select onchange="if(this.value){ const n=[...selected, this.value]; updateFn(n.join('; ')); } this.value='';">
                <option value="">+ Mitglied hinzufügen...</option>
                ${state.members.map(m => `<option value="${m}">${m}</option>`).join('')}
            </select>`;
    }

    function renderAppInfo() {
        const container = document.getElementById('app-info-list');
        container.innerHTML = state.app_info.map((info, i) => `
            <div class="config-grid">
                <strong>${info.bezeichnung}</strong>
                <div>${renderMultiMail(info.mailempfänger, (val) => { state.app_info[i].mailempfänger = val; renderAppInfo(); })}</div>
                <small>${info.bemerkung || ''}</small>
            </div>`).join('');
    }

    function updateOrt(idx, ort) {
        state.termine[idx].ort = ort;
        const pair = state.dropdowns.orteMitMaps.find(p => p[0] === ort);
        state.termine[idx].austragungsorte_map = pair ? pair[1] : "";
        renderTermine();
    }

    function renderStammdaten() {
        document.getElementById('edit-anlaesse').innerHTML = state.dropdowns.anlaesse.map((a, i) => `
            <div style="display:flex; gap:5px; margin-bottom:5px;"><input type="text" value="${a}" onchange="state.dropdowns.anlaesse[${i}]=this.value"><button class="btn btn-del" onclick="state.dropdowns.anlaesse.splice(${i},1); renderAll();">✕</button></div>`).join('');
        document.getElementById('edit-orte').innerHTML = state.dropdowns.orteMitMaps.map((o, i) => `
            <div style="display:flex; gap:5px; margin-bottom:5px;"><input type="text" placeholder="Ort" value="${o[0]}" onchange="state.dropdowns.orteMitMaps[${i}][0]=this.value"><input type="text" placeholder="Map-Link" value="${o[1]}" onchange="state.dropdowns.orteMitMaps[${i}][1]=this.value"><button class="btn btn-del" onclick="state.dropdowns.orteMitMaps.splice(${i},1); renderAll();">✕</button></div>`).join('');
    }

    function createSelect(opts, sel, idx, field) {
        return `<select onchange="state.termine[${idx}]['${field}']=this.value; renderTermine();">${(opts||[]).map(o => `<option value="${o}" ${o===sel?'selected':''}>${o}</option>`).join('')}</select>`;
    }

    function addTermin() {
        state.termine.unshift({ datum: "", startzeit: "", endzeit: "", anlass: "", ort: "", austragungsorte_map: "", kategorie: "Jahresprogramm", status: "provisorisch" });
        renderTermine();
    }

    async function saveAll() {
        const btn = document.querySelector('.btn-save'); btn.innerText = "⏳ Speichere...";
        try {
            const resp = await fetch(`${WORKER_URL}?action=saveAdminData`, { method: 'POST', body: JSON.stringify(state) });
            alert("✅ Daten erfolgreich in Google Sheets gespeichert!");
        } catch (e) { alert("Fehler: " + e); }
        btn.innerText = "💾 Cloud-Daten speichern";
    }

    window.onload = loadData;
</script>
</body>
</html>
