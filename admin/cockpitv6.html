<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vereins-Admin 2.0 | Sportschützen Muhen</title>

<style>
:root{
 --primary:#4a90e2;--secondary:#2c3e50;--success:#27ae60;
 --danger:#e74c3c;--bg:#f4f7f9;--card:#fff
}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);margin:0;padding:20px}
.container{max-width:1800px;margin:auto}
.card{background:var(--card);padding:25px;border-radius:12px;margin-bottom:25px}
h2{margin:0 0 20px;border-left:5px solid var(--primary);padding-left:15px}
table{width:100%;border-collapse:collapse}
th{background:var(--secondary);color:#fff;padding:12px;font-size:.75rem}
td{padding:8px;border-bottom:1px solid #edf2f7}
input,select{width:100%;padding:8px;border:1px solid #e2e8f0;border-radius:6px}

.mail-tag-container{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid #e2e8f0;border-radius:6px;background:#fff}
.tag{background:#e0f2fe;color:#0369a1;padding:4px 10px;border-radius:6px;font-size:.85rem;display:flex;gap:6px}
.tag span{cursor:pointer;color:var(--danger);font-weight:bold}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h2>GV & Haupt-Konfiguration</h2>
<div id="platzhalter-list"></div>
</div>

<div class="card">
<h2>Mail-Verteiler (App Info)</h2>
<div id="app-info-list"></div>
</div>

</div>

<script>
const WORKER_URL="https://termine.dan-hunziker73.workers.dev/";
let state={platzhalter:[],app_info:[],members:[]};

/* =====================
   LOAD
===================== */
async function loadData(){
 const r=await fetch(WORKER_URL+"?action=loadAdminData");
 state=await r.json();
 renderPlatzhalter();
 renderAppInfo();
}

/* =====================
   MAIL HELPERS
===================== */
function splitMails(v){
 return v?v.split(';').map(m=>m.trim()).filter(Boolean):[];
}
function joinMails(arr){
 return arr.join('; ');
}

/* =====================
   GV STAMMDATEN
===================== */
function renderPlatzhalter(){
 const c=document.getElementById('platzhalter-list');
 c.innerHTML=state.platzhalter.map((p,i)=>{
   const isMail=p.platzhaltername?.startsWith("Mail_");
   if(isMail){
     const mails=splitMails(p.inhalt);
     return `
     <div style="margin-bottom:15px">
       <strong>${p.platzhaltername}</strong>
       <div class="mail-tag-container">
         ${mails.map(m=>`<div class="tag">${m}<span onclick="removeGVmail(${i},'${m}')">×</span></div>`).join('')}
       </div>
       <select onchange="addGVmail(${i},this.value);this.value=''">
         <option value="">+ Empfänger hinzufügen</option>
         ${state.members.map(m=>`<option value="${m.e_mail||m}">${m.e_mail||m}</option>`).join('')}
       </select>
       <small>${p.erklärung||''}</small>
     </div>`;
   }
   return `
   <div style="margin-bottom:15px">
     <strong>${p.platzhaltername}</strong>
     <input value="${p.inhalt||''}" onchange="state.platzhalter[${i}].inhalt=this.value">
     <small>${p.erklärung||''}</small>
   </div>`;
 }).join('');
}

function addGVmail(i,mail){
 if(!mail)return;
 const arr=splitMails(state.platzhalter[i].inhalt);
 if(!arr.includes(mail)){
   arr.push(mail);
   state.platzhalter[i].inhalt=joinMails(arr);
   renderPlatzhalter();
 }
}
function removeGVmail(i,mail){
 const arr=splitMails(state.platzhalter[i].inhalt).filter(m=>m!==mail);
 state.platzhalter[i].inhalt=joinMails(arr);
 renderPlatzhalter();
}

/* =====================
   APP INFO
===================== */
function renderAppInfo(){
 const c=document.getElementById('app-info-list');
 c.innerHTML=state.app_info.map((a,i)=>{
   const mails=splitMails(a.mailempfänger);
   return `
   <div style="margin-bottom:15px">
     <strong>${a.bezeichnung}</strong>
     <div class="mail-tag-container">
       ${mails.map(m=>`<div class="tag">${m}<span onclick="removeAppMail(${i},'${m}')">×</span></div>`).join('')}
     </div>
     <select onchange="addAppMail(${i},this.value);this.value=''">
       <option value="">+ Empfänger hinzufügen</option>
       ${state.members.map(m=>`<option value="${m.e_mail||m}">${m.e_mail||m}</option>`).join('')}
     </select>
     <small>${a.bemerkung||''}</small>
   </div>`;
 }).join('');
}

function addAppMail(i,mail){
 if(!mail)return;
 const arr=splitMails(state.app_info[i].mailempfänger);
 if(!arr.includes(mail)){
   arr.push(mail);
   state.app_info[i].mailempfänger=joinMails(arr);
   renderAppInfo();
 }
}
function removeAppMail(i,mail){
 const arr=splitMails(state.app_info[i].mailempfänger).filter(m=>m!==mail);
 state.app_info[i].mailempfänger=joinMails(arr);
 renderAppInfo();
}

window.onload=loadData;
</script>
</body>
</html>
