<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin-Panel 4.0 | Sportschützen Muhen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"> 
    
    <style>
        :root { 
            --primary: #0f3a5d; /* Dunkelblau wie in deiner App */
            --secondary: #1e293b; --success: #10b981; 
            --danger: #ef4444; --warning: #f59e0b; --bg: #f3f4f6; --card-bg: #ffffff;
            --border: #d1d5db; --text: #1f2937; --text-light: #6b7280;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); 
            margin: 0; padding-bottom: 90px; /* Platz für Bottom-Nav */
        }

        /* HEADER */
        header {
            background: var(--primary); color: white; padding: 20px;
            text-align: center; position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        header h1 { margin: 0; font-size: 1.2rem; }

        /* MAIN AREA */
        main { padding: 15px; max-width: 1400px; margin: 0 auto; }
        
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* CARDS */
        .card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 20px; }
        h3 { margin-top: 0; font-size: 1rem; color: var(--primary); display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #eee; padding-bottom: 10px; }

        /* BOTTOM NAVIGATION */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; height: 75px;
            background: #ffffff; display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid #e5e7eb; z-index: 2000; padding: 0 5px;
        }
        .nav-item { 
            background: none; border: none; color: var(--text-light); 
            font-size: 0.7rem; font-weight: 600; display: flex; flex-direction: column;
            align-items: center; cursor: pointer; flex: 1; transition: 0.2s;
        }
        .nav-item span { font-size: 1.5rem; margin-bottom: 2px; }
        .nav-item.active { color: var(--primary); }
        .nav-save { 
            background: var(--primary) !important; color: white !important; 
            width: 60px; height: 60px; border-radius: 50%; position: relative; top: -15px;
            box-shadow: 0 4px 12px rgba(15, 58, 93, 0.4); border: 4px solid var(--bg) !important;
        }

        /* TABELLEN STYLES & BREITEN */
        .table-wrapper { border-radius: 12px; overflow-x: auto; border: 1px solid var(--border); background: white; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: #f8fafc; padding: 12px; text-align: left; font-size: 0.7rem; text-transform: uppercase; color: #64748b; }
        td { padding: 8px 12px; border-bottom: 1px solid #f1f5f9; }

        /* Hier kannst du die Breiten anpassen */
        .col-date { width: 160px; }
        .col-time { width: 95px; }
        .col-anlass { width: auto; }
        .col-ort { width: 180px; }
        .col-status { width: 130px; }

        input, select { padding: 8px; border: 1px solid var(--border); border-radius: 8px; width: 100%; font-size: 0.9rem; }

        /* MAIL TAGS */
        .tag-box { display: flex; flex-wrap: wrap; gap: 5px; background: #f9fafb; border: 1px solid var(--border); padding: 8px; border-radius: 8px; min-height: 45px; margin-bottom: 8px; }
        .tag { background: #e0e7ff; color: #0f3a5d; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .tag span { color: var(--danger); cursor: pointer; font-size: 1.2rem; }

        .gv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
        .gv-item { background: #fff; padding: 15px; border-radius: 12px; border: 1px solid #edf2f7; }
        .gv-item label { display: block; font-weight: 700; font-size: 0.8rem; color: var(--text-light); margin-bottom: 8px; }

        .btn-add { background: #f1f5f9; color: var(--primary); border: 1px dashed var(--primary); padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: 600; margin-bottom: 15px; }
        .btn-del { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 1.2rem; }

        .loader { position: fixed; inset: 0; background: white; display: flex; justify-content: center; align-items: center; z-index: 9999; flex-direction: column; }
    </style>
</head>
<body>

<div id="loader" class="loader">
    <div style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
    <p>Daten werden synchronisiert...</p>
</div>

<header><h1 id="tab-title">GV & App-Konfiguration</h1></header>

<main>
    <section id="tab-gv" class="tab-content active">
        <div class="card">
            <h3>⚙️ GV Stammdaten</h3>
            <div id="gv-list" class="gv-grid"></div>
        </div>
        <div class="card">
            <h3>📩 Mail-Benachrichtigungen System</h3>
            <div id="app-info-list" class="gv-grid"></div>
        </div>
    </section>

    <section id="tab-termine" class="tab-content">
        <button class="btn-add" onclick="addTermin()">+ Neuen Termin am Anfang einfügen</button>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="col-date">Datum</th>
                        <th class="col-time">Start</th>
                        <th class="col-time">Ende</th>
                        <th class="col-anlass">Anlass / Titel</th>
                        <th class="col-ort">Ort</th>
                        <th class="col-status">Status</th>
                        <th style="width:50px"></th>
                    </tr>
                </thead>
                <tbody id="termine-body"></tbody>
            </table>
        </div>
    </section>

    <section id="tab-anmeldungen" class="tab-content">
        <div class="card">
            <h3>📝 Aktuelle GV Anmeldungen</h3>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>Name</th><th>Teilnahme</th><th>Zeitpunkt</th></tr></thead>
                    <tbody id="anmelde-body"></tbody>
                </table>
            </div>
        </div>
    </section>

    <section id="tab-editor" class="tab-content">
        <div class="gv-grid">
            <div class="card">
                <h3>📋 Anlass-Typen</h3>
                <div id="edit-anlaesse"></div>
                <button class="btn-add" onclick="state.dropdowns.anlaesse.push(''); renderAll();">+ Typ hinzufügen</button>
            </div>
            <div class="card">
                <h3>📍 Orte & Maps</h3>
                <div id="edit-orte"></div>
                <button class="btn-add" onclick="state.dropdowns.orteMitMaps.push(['','']); renderAll();">+ Ort hinzufügen</button>
            </div>
        </div>
    </section>
</main>

<nav class="bottom-nav">
    <button class="nav-item active" onclick="showTab('tab-gv', 'GV & App-Info', this)"><span>⚙️</span>Konfig</button>
    <button class="nav-item" onclick="showTab('tab-termine', 'Jahresprogramm', this)"><span>📅</span>Termine</button>
    <button class="nav-item nav-save" onclick="saveAll()"><span>💾</span></button>
    <button class="nav-item" onclick="showTab('tab-anmeldungen', 'GV Anmeldungen', this)"><span>📝</span>Präsenz</button>
    <button class="nav-item" onclick="showTab('tab-editor', 'Stammdaten-Editor', this)"><span>🛠️</span>Editor</button>
</nav>

<script>
    const WORKER_URL = "https://termine.dan-hunziker73.workers.dev/";
    let state = { 
        platzhalter: [], termine: [], app_info: [], members: [], anmeldungen: [],
        dropdowns: { anlaesse:[], orteMitMaps:[], kategorien:[], status:[] } 
    };

    async function loadData() {
        try {
            const resp = await fetch(`${WORKER_URL}?action=loadAdminData`);
            state = await resp.json();
            renderAll();
            document.getElementById('loader').style.display = 'none';
        } catch (err) { alert("Fehler beim Laden: " + err); }
    }

    function showTab(tabId, title, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
        document.getElementById('tab-title').innerText = title;
        window.scrollTo(0,0);
    }

    function renderAll() {
        renderGV();
        renderTermine();
        renderAnmeldungen();
        renderEditor();
        renderAppInfo();
    }

    // --- MAIL LOGIK FIX ---
    function addMail(source, index, email) {
        if(!email) return;
        let targetField = (source === 'gv') ? state.platzhalter[index] : state.app_info[index];
        let property = (source === 'gv') ? 'inhalt' : 'mailempfänger';
        
        let currentMails = targetField[property] ? targetField[property].split(';').map(m => m.trim()) : [];
        if(!currentMails.includes(email)) {
            currentMails.push(email);
            targetField[property] = currentMails.filter(m => m).join('; ');
            renderAll();
        }
    }

    function removeMail(source, index, email) {
        let targetField = (source === 'gv') ? state.platzhalter[index] : state.app_info[index];
        let property = (source === 'gv') ? 'inhalt' : 'mailempfänger';
        
        let currentMails = targetField[property].split(';').map(m => m.trim());
        targetField[property] = currentMails.filter(m => m !== email).join('; ');
        renderAll();
    }

    function renderGV() {
        const container = document.getElementById('gv-list');
        container.innerHTML = state.platzhalter.map((p, i) => {
            const isMail = p.bezeichnung_app?.includes('Mail_');
            return `
            <div class="gv-item">
                <label>${p.bezeichnung_app || 'Feld'}</label>
                ${isMail ? `
                    <div class="tag-box">
                        ${(p.inhalt || "").split(';').filter(m => m.trim()).map(m => `
                            <div class="tag">${m.trim()} <span onclick="removeMail('gv', ${i}, '${m.trim()}')">×</span></div>
                        `).join('')}
                    </div>
                    <select onchange="addMail('gv', ${i}, this.value)">
                        <option value="">+ Empfänger hinzufügen</option>
                        ${state.members.map(m => `<option value="${m.e_mail}">${m.vorname} ${m.nachname}</option>`).join('')}
                    </select>
                ` : `
                    <input type="text" value="${p.inhalt || ''}" onchange="state.platzhalter[${i}].inhalt=this.value">
                `}
            </div>`;
        }).join('');
    }

    function renderAppInfo() {
        const container = document.getElementById('app-info-list');
        container.innerHTML = state.app_info.map((info, i) => `
            <div class="gv-item">
                <label>${info.bezeichnung}</label>
                <div class="tag-box">
                    ${(info.mailempfänger || "").split(';').filter(m => m.trim()).map(m => `
                        <div class="tag">${m.trim()} <span onclick="removeMail('app', ${i}, '${m.trim()}')">×</span></div>
                    `).join('')}
                </div>
                <select onchange="addMail('app', ${i}, this.value)">
                    <option value="">+ Empfänger hinzufügen</option>
                    ${state.members.map(m => `<option value="${m.e_mail}">${m.vorname} ${m.nachname}</option>`).join('')}
                </select>
            </div>
        `).join('');
    }

    function renderTermine() {
        const body = document.getElementById('termine-body');
        body.innerHTML = state.termine.map((t, i) => {
            const dateVal = t.datum ? new Date(t.datum).toISOString().split('T')[0] : "";
            return `<tr>
                <td><input type="date" value="${dateVal}" onchange="state.termine[${i}].datum=this.value"></td>
                <td><input type="time" value="${t.startzeit || ''}" onchange="state.termine[${i}].startzeit=this.value"></td>
                <td><input type="time" value="${t.endzeit || ''}" onchange="state.termine[${i}].endzeit=this.value"></td>
                <td><select onchange="state.termine[${i}]['anlass_/_titel']=this.value">
                    ${state.dropdowns.anlaesse.map(a => `<option value="${a}" ${a===t['anlass_/_titel']?'selected':''}>${a}</option>`).join('')}
                </select></td>
                <td><select onchange="updateOrt(${i}, this.value)">
                    ${state.dropdowns.orteMitMaps.map(o => `<option value="${o[0]}" ${o[0]===t.ort?'selected':''}>${o[0]}</option>`).join('')}
                </select></td>
                <td><select onchange="state.termine[${i}].status=this.value">
                    <option value="fix" ${t.status==='fix'?'selected':''}>fix</option>
                    <option value="provisorisch" ${t.status==='provisorisch'?'selected':''}>provisorisch</option>
                </select></td>
                <td><button class="btn-del" onclick="state.termine.splice(${i},1); renderAll()">🗑️</button></td>
            </tr>`;
        }).join('');
    }

    function updateOrt(i, ort) {
        state.termine[i].ort = ort;
        const pair = state.dropdowns.orteMitMaps.find(o => o[0] === ort);
        state.termine[i].austragungsorte_map = pair ? pair[1] : "";
    }

    function renderAnmeldungen() {
        document.getElementById('anmelde-body').innerHTML = state.anmeldungen.map(a => `
            <tr>
                <td><strong>${a.vorname} ${a.nachname}</strong></td>
                <td style="color:${a.teilnahme==='Ja'?'var(--success)':'var(--danger)'}; font-weight:bold">${a.teilnahme}</td>
                <td>${a.zeitstempel ? new Date(a.zeitstempel).toLocaleString('de-DE') : '-'}</td>
            </tr>
        `).join('');
    }

    function renderEditor() {
        document.getElementById('edit-anlaesse').innerHTML = state.dropdowns.anlaesse.map((a, i) => `
            <div style="display:flex; gap:5px; margin-bottom:5px">
                <input type="text" value="${a}" onchange="state.dropdowns.anlaesse[${i}]=this.value">
                <button class="btn-del" onclick="state.dropdowns.anlaesse.splice(${i},1); renderAll()">🗑️</button>
            </div>`).join('');
        document.getElementById('edit-orte').innerHTML = state.dropdowns.orteMitMaps.map((o, i) => `
            <div style="display:flex; gap:5px; margin-bottom:5px">
                <input type="text" placeholder="Ort" value="${o[0]}" onchange="state.dropdowns.orteMitMaps[${i}][0]=this.value">
                <input type="text" placeholder="Maps Link" value="${o[1]}" onchange="state.dropdowns.orteMitMaps[${i}][1]=this.value">
                <button class="btn-del" onclick="state.dropdowns.orteMitMaps.splice(${i},1); renderAll()">🗑️</button>
            </div>`).join('');
    }

    function addTermin() {
        state.termine.unshift({ datum: "", startzeit: "", endzeit: "", "anlass_/_titel": "", ort: "", kategorie: "Jahresprogramm", status: "provisorisch" });
        renderAll();
    }

    async function saveAll() {
        const btn = document.querySelector('.nav-save');
        btn.style.opacity = "0.5";
        try {
            await fetch(`${WORKER_URL}?action=saveAdminData`, { method: 'POST', body: JSON.stringify(state) });
            alert("✅ Daten erfolgreich in der Cloud gespeichert!");
        } catch (e) { alert("Fehler: " + e); }
        btn.style.opacity = "1";
    }

    window.onload = loadData;
</script>
</body>
</html>
