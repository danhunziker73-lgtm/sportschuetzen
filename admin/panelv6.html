<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin-Panel 4.0 | Sportschützen Muhen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"> 
    
    <style>
        :root { 
            --primary: #0f3a5d; --success: #10b981; --danger: #ef4444; 
            --bg: #f3f4f6; --card: #ffffff; --border: #d1d5db; --text: #1f2937;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding-bottom: 90px; color: var(--text); }

        header {
            background: var(--primary); color: white; padding: 20px;
            text-align: center; position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        header h1 { margin: 0; font-size: 1.2rem; }

        main { padding: 15px; max-width: 1400px; margin: 0 auto; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 20px; }
        h3 { margin-top: 0; font-size: 1rem; color: var(--primary); border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }

        /* NAVIGATION UNTEN */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; height: 75px;
            background: #ffffff; display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid #e5e7eb; z-index: 2000;
        }
        .nav-item { 
            background: none; border: none; color: #6b7280; 
            font-size: 0.7rem; font-weight: 600; display: flex; flex-direction: column;
            align-items: center; cursor: pointer; flex: 1;
        }
        .nav-item span { font-size: 1.5rem; margin-bottom: 2px; }
        .nav-item.active { color: var(--primary); }
        .nav-save { 
            background: var(--primary) !important; color: white !important; 
            width: 60px; height: 60px; border-radius: 50%; position: relative; top: -15px;
            box-shadow: 0 4px 12px rgba(15, 58, 93, 0.4); border: 4px solid var(--bg) !important;
        }

        /* TABELLEN & INPUTS */
        .table-wrapper { overflow-x: auto; border-radius: 8px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th, td { padding: 10px; border-bottom: 1px solid #f1f5f9; text-align: left; }
        th { background: #f8fafc; font-size: 0.75rem; color: #64748b; }

        input, select { padding: 8px; border: 1px solid var(--border); border-radius: 8px; width: 100%; font-size: 0.9rem; }
        .btn-add { background: #f1f5f9; border: 1px dashed var(--primary); color: var(--primary); padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        .btn-del { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 1.2rem; }

        .tag-box { display: flex; flex-wrap: wrap; gap: 6px; border: 1px solid var(--border); padding: 8px; border-radius: 8px; background: #f9fafb; min-height: 45px; margin-bottom: 8px; }
        .tag { background: #e0e7ff; color: #0f3a5d; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; font-weight: 600; }
        .tag span { cursor: pointer; color: var(--danger); font-size: 1.1rem; }
        .gv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
    </style>
</head>
<body>

<header><h1 id="tab-title">GV & App-Konfiguration</h1></header>

<main>
    <section id="tab-gv" class="tab-content active">
        <div class="card">
            <h3>⚙️ GV Stammdaten</h3>
            <div id="gv-list" class="gv-grid"></div>
        </div>
        <div class="card">
            <h3>📩 App-Info Mailverteiler</h3>
            <div id="app-info-list" class="gv-grid"></div>
        </div>
    </section>

    <section id="tab-termine" class="tab-content">
        <div class="card">
            <button class="btn-add" onclick="addTermin()">+ Neuen Termin hinzufügen</button>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Datum</th><th>Start</th><th>Ende</th><th>Anlass</th><th>Ort</th><th>Status</th><th></th></tr>
                    </thead>
                    <tbody id="termine-body"></tbody>
                </table>
            </div>
        </div>
    </section>

    <section id="tab-anmeldungen" class="tab-content">
        <div class="card">
            <h3>📝 GV-Anmeldungen</h3>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>Name</th><th>Teilnahme</th><th>Zeitstempel</th></tr></thead>
                    <tbody id="anmelde-body"></tbody>
                </table>
            </div>
        </div>
    </section>

    <section id="tab-editor" class="tab-content">
        <div class="gv-grid">
            <div class="card">
                <h3>📋 Anlass-Typen</h3>
                <div id="edit-anlaesse"></div>
                <button class="btn-add" onclick="state.dropdowns.anlaesse.push(''); renderAll();">+</button>
            </div>
            <div class="card">
                <h3>📍 Orte & Maps</h3>
                <div id="edit-orte"></div>
                <button class="btn-add" onclick="state.dropdowns.orteMitMaps.push(['','']); renderAll();">+</button>
            </div>
        </div>
    </section>
</main>

<nav class="bottom-nav">
    <button class="nav-item active" onclick="showTab('tab-gv','GV & App-Info',this)"><span>⚙️</span>Konfig</button>
    <button class="nav-item" onclick="showTab('tab-termine','Termine',this)"><span>📅</span>Termine</button>
    <button class="nav-item nav-save" onclick="saveAll()"><span>💾</span></button>
    <button class="nav-item" onclick="showTab('tab-anmeldungen','Anmeldungen',this)"><span>📝</span>GV</button>
    <button class="nav-item" onclick="showTab('tab-editor','Editor',this)"><span>🛠️</span>Editor</button>
</nav>

<script>
const WORKER_URL = "https://termine.dan-hunziker73.workers.dev/";
let state = { platzhalter:[], termine:[], app_info:[], members:[], anmeldungen:[], dropdowns:{anlaesse:[], orteMitMaps:[], status:[]} };

async function loadData() {
    const r = await fetch(WORKER_URL + "?action=loadAdminData");
    state = await r.json();
    renderAll();
}

function showTab(id, title, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
    document.getElementById('tab-title').innerText = title;
}

function renderAll() {
    renderGV();
    renderAppInfo();
    renderTermine();
    renderAnmeldungen();
    renderEditor();
}

// --- GV STAMMDATEN ---
function renderGV() {
    const c = document.getElementById('gv-list');
    c.innerHTML = state.platzhalter.map((p, i) => {
        const isMail = p.name?.startsWith('Mail_');
        if(isMail) {
            const mails = (p.Inhalt || "").split(';').map(m => m.trim()).filter(Boolean);
            return `<div class="gv-item" style="margin-bottom:15px">
                <label style="font-weight:bold; font-size:0.8rem">${p.Bezeichnung_App || p.name}</label>
                <div class="tag-box">
                    ${mails.map(m => `<div class="tag">${m}<span onclick="removeGVmail(${i},'${m}')">×</span></div>`).join('')}
                </div>
                <select onchange="addGVmail(${i},this.value);this.value=''">
                    <option value="">+ Empfänger hinzufügen</option>
                    ${state.members.map(m => `<option value="${m.e_mail}">${m.vorname} ${m.nachname}</option>`).join('')}
                </select>
            </div>`;
        }
        return `<div class="gv-item" style="margin-bottom:15px">
            <label style="font-weight:bold; font-size:0.8rem">${p.Bezeichnung_App || p.name}</label>
            <input value="${p.Inhalt || ''}" onchange="state.platzhalter[${i}].Inhalt=this.value">
        </div>`;
    }).join('');
}

function addGVmail(i, mail) {
    if(!mail) return;
    let p = state.platzhalter[i];
    let arr = p.Inhalt ? p.Inhalt.split(';').map(m => m.trim()) : [];
    if(!arr.includes(mail)) { arr.push(mail); p.Inhalt = arr.join('; '); renderGV(); }
}
function removeGVmail(i, mail) {
    let p = state.platzhalter[i];
    p.Inhalt = p.Inhalt.split(';').map(m => m.trim()).filter(m => m !== mail).join('; ');
    renderGV();
}

// --- APP INFO ---
function renderAppInfo() {
    const container = document.getElementById('app-info-list');
    container.innerHTML = state.app_info.map((info, i) => {
        const mails = (info.mailempfänger || "").split(';').map(m => m.trim()).filter(Boolean);
        return `<div class="gv-item" style="margin-bottom:15px">
            <label style="font-weight:bold; font-size:0.8rem">${info.bezeichnung}</label>
            <div class="tag-box">
                ${mails.map(m => `<div class="tag">${m}<span onclick="removeAppMail(${i},'${m}')">×</span></div>`).join('')}
            </div>
            <select onchange="addAppMail(${i},this.value);this.value=''">
                <option value="">+ Empfänger hinzufügen</option>
                ${state.members.map(m => `<option value="${m.e_mail}">${m.vorname} ${m.nachname}</option>`).join('')}
            </select>
        </div>`;
    }).join('');
}

function addAppMail(i, mail) {
    if(!mail) return;
    let info = state.app_info[i];
    let arr = info.mailempfänger ? info.mailempfänger.split(';').map(m => m.trim()) : [];
    if(!arr.includes(mail)) { arr.push(mail); info.mailempfänger = arr.join('; '); renderAppInfo(); }
}
function removeAppMail(i, mail) {
    let info = state.app_info[i];
    info.mailempfänger = info.mailempfänger.split(';').map(m => m.trim()).filter(m => m !== mail).join('; ');
    renderAppInfo();
}

// --- TERMINE ---
function renderTermine() {
    const body = document.getElementById('termine-body');
    body.innerHTML = state.termine.map((t, i) => {
        const dateVal = t.datum ? new Date(t.datum).toISOString().split('T')[0] : "";
        return `<tr>
            <td><input type="date" value="${dateVal}" onchange="state.termine[${i}].datum=this.value"></td>
            <td><input type="time" value="${t.startzeit || ''}" onchange="state.termine[${i}].startzeit=this.value"></td>
            <td><input type="time" value="${t.endzeit || ''}" onchange="state.termine[${i}].endzeit=this.value"></td>
            <td><select onchange="state.termine[${i}]['anlass_/_titel']=this.value">
                ${state.dropdowns.anlaesse.map(a => `<option value="${a}" ${a===t['anlass_/_titel']?'selected':''}>${a}</option>`).join('')}
            </select></td>
            <td><select onchange="updateOrt(${i}, this.value)">
                ${state.dropdowns.orteMitMaps.map(o => `<option value="${o[0]}" ${o[0]===t.ort?'selected':''}>${o[0]}</option>`).join('')}
            </select></td>
            <td><select onchange="state.termine[${i}].status=this.value">
                <option value="fix" ${t.status==='fix'?'selected':''}>fix</option>
                <option value="provisorisch" ${t.status==='provisorisch'?'selected':''}>provisorisch</option>
            </select></td>
            <td><button class="btn-del" onclick="state.termine.splice(${i},1); renderAll()">🗑️</button></td>
        </tr>`;
    }).join('');
}

function updateOrt(i, ort) {
    state.termine[i].ort = ort;
    const pair = state.dropdowns.orteMitMaps.find(o => o[0] === ort);
    state.termine[i].austragungsorte_map = pair ? pair[1] : "";
}

function addTermin() {
    state.termine.unshift({ datum: "", startzeit: "", endzeit: "", "anlass_/_titel": "", ort: "", kategorie: "Jahresprogramm", status: "provisorisch" });
    renderAll();
}

// --- ANMELDUNGEN ---
function renderAnmeldungen() {
    document.getElementById('anmelde-body').innerHTML = state.anmeldungen.map(a => `
        <tr>
            <td><strong>${a.vorname} ${a.nachname}</strong></td>
            <td style="color:${a.teilnahme==='Ja'?'var(--success)':'var(--danger)'}; font-weight:bold">${a.teilnahme}</td>
            <td>${a.zeitstempel ? new Date(a.zeitstempel).toLocaleString('de-DE') : '-'}</td>
        </tr>
    `).join('');
}

// --- EDITOR ---
function renderEditor() {
    document.getElementById('edit-anlaesse').innerHTML = state.dropdowns.anlaesse.map((a, i) => `
        <div style="display:flex; gap:5px; margin-bottom:5px">
            <input value="${a}" onchange="state.dropdowns.anlaesse[${i}]=this.value">
            <button class="btn-del" onclick="state.dropdowns.anlaesse.splice(${i},1); renderAll()">🗑️</button>
        </div>`).join('');
    document.getElementById('edit-orte').innerHTML = state.dropdowns.orteMitMaps.map((o, i) => `
        <div style="display:flex; gap:5px; margin-bottom:5px">
            <input placeholder="Ort" value="${o[0]}" onchange="state.dropdowns.orteMitMaps[${i}][0]=this.value">
            <input placeholder="Maps Link" value="${o[1]}" onchange="state.dropdowns.orteMitMaps[${i}][1]=this.value">
            <button class="btn-del" onclick="state.dropdowns.orteMitMaps.splice(${i},1); renderAll()">🗑️</button>
        </div>`).join('');
}

async function saveAll() {
    const btn = document.querySelector('.nav-save');
    btn.style.opacity = "0.5";
    try {
        await fetch(WORKER_URL + "?action=saveAdminData", { method: 'POST', body: JSON.stringify(state) });
        alert("✅ Gespeichert");
    } catch(e) { alert("Fehler beim Speichern"); }
    btn.style.opacity = "1";
}

window.onload = loadData;
</script>
</body>
</html>
