<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin-Panel 4.0 | Sportschützen Muhen</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary:#0f3a5d; --success:#10b981; --danger:#ef4444;
  --bg:#f3f4f6; --card:#fff; --border:#d1d5db;
}
*{box-sizing:border-box}
body{font-family:Inter,sans-serif;background:var(--bg);margin:0;padding-bottom:90px}
header{background:var(--primary);color:#fff;padding:20px;text-align:center;position:sticky;top:0;z-index:1000}
main{padding:15px;max-width:1400px;margin:auto}
.card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:20px;border:1px solid var(--border)}
h3{margin:0 0 10px;color:var(--primary)}
input,select{width:100%;padding:8px;border:1px solid var(--border);border-radius:8px}
.table-wrapper{overflow-x:auto}
table{width:100%;min-width:900px;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
.bottom-nav{position:fixed;bottom:0;width:100%;height:75px;background:#fff;border-top:1px solid #ddd;display:flex;z-index:2000}
.nav-item{flex:1;border:none;background:none;font-size:.7rem}
.nav-item span{font-size:1.5rem}
.nav-item.active{color:var(--primary)}
.nav-save{background:var(--primary)!important;color:#fff!important;border-radius:50%;width:60px;height:60px;margin-top:-15px}

.tag-box{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--border);padding:6px;border-radius:8px;background:#f9fafb}
.tag{background:#e0e7ff;color:#0f3a5d;padding:4px 10px;border-radius:6px;font-size:.8rem;display:flex;gap:6px;align-items:center}
.tag span{cursor:pointer;color:var(--danger)}
.gv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:15px}
</style>
</head>

<body>

<header><h1 id="tab-title">GV & App-Konfiguration</h1></header>

<main>

<section id="tab-gv" class="tab-content active">
  <div class="card">
    <h3>⚙️ GV Stammdaten</h3>
    <div id="gv-list" class="gv-grid"></div>
  </div>

  <div class="card">
    <h3>📩 App-Info Mailverteiler</h3>
    <div id="app-info-list" class="gv-grid"></div>
  </div>
</section>

<section id="tab-termine" class="tab-content">
  <div class="card">
    <button onclick="addTermin()">+ Neuer Termin</button>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Datum</th><th>Start</th><th>Ende</th>
            <th>Anlass</th><th>Ort</th><th>Status</th><th></th>
          </tr>
        </thead>
        <tbody id="termine-body"></tbody>
      </table>
    </div>
  </div>
</section>

<section id="tab-anmeldungen" class="tab-content">
  <div class="card">
    <h3>📝 GV-Anmeldungen</h3>
    <div class="table-wrapper">
      <table>
        <thead><tr><th>Name</th><th>Teilnahme</th><th>Zeit</th></tr></thead>
        <tbody id="anmelde-body"></tbody>
      </table>
    </div>
  </div>
</section>

<section id="tab-editor" class="tab-content">
  <div class="gv-grid">
    <div class="card">
      <h3>Anlass-Typen</h3>
      <div id="edit-anlaesse"></div>
      <button onclick="state.dropdowns.anlaesse.push('');renderAll()">+</button>
    </div>
    <div class="card">
      <h3>Orte & Maps</h3>
      <div id="edit-orte"></div>
      <button onclick="state.dropdowns.orteMitMaps.push(['','']);renderAll()">+</button>
    </div>
  </div>
</section>

</main>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="showTab('tab-gv','GV & App-Info',this)"><span>⚙️</span>Konfig</button>
  <button class="nav-item" onclick="showTab('tab-termine','Termine',this)"><span>📅</span>Termine</button>
  <button class="nav-item nav-save" onclick="saveAll()"><span>💾</span></button>
  <button class="nav-item" onclick="showTab('tab-anmeldungen','Anmeldungen',this)"><span>📝</span>GV</button>
  <button class="nav-item" onclick="showTab('tab-editor','Editor',this)"><span>🛠️</span>Editor</button>
</nav>

<script>
const WORKER_URL="https://termine.dan-hunziker73.workers.dev/";
let state={platzhalter:[],termine:[],app_info:[],members:[],anmeldungen:[],dropdowns:{anlaesse:[],orteMitMaps:[],status:[]}}

async function loadData(){
  const r=await fetch(WORKER_URL+"?action=loadAdminData");
  state=await r.json(); renderAll();
}

function showTab(id,title,btn){
 document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
 document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 btn.classList.add('active');
 document.getElementById('tab-title').innerText=title;
}

function renderAll(){
 renderGV(); renderAppInfo(); renderTermine(); renderAnmeldungen(); renderEditor();
}

/* =======================
   GV STAMMDATEN – MAIL FIX
   ======================= */
function renderGV(){
 const c=document.getElementById('gv-list');
 c.innerHTML=state.platzhalter.map((p,i)=>{
   const isMail=p.name?.startsWith('Mail_');
   if(isMail){
     const mails=(p.Inhalt||"").split(';').map(m=>m.trim()).filter(Boolean);
     return `<div class="card">
       <strong>${p.Bezeichnung_App||p.name}</strong>
       <div class="tag-box">
         ${mails.map(m=>`<div class="tag">${m}<span onclick="removeGVmail(${i},'${m}')">×</span></div>`).join('')}
       </div>
       <select onchange="addGVmail(${i},this.value);this.value=''">
         <option value="">+ Empfänger hinzufügen</option>
         ${state.members.map(m=>`<option value="${m.e_mail}">${m.vorname} ${m.nachname}</option>`).join('')}
       </select>
     </div>`;
   }
   return `<div class="card">
     <strong>${p.Bezeichnung_App||p.name}</strong>
     <input value="${p.Inhalt||''}" onchange="state.platzhalter[${i}].Inhalt=this.value">
   </div>`;
 }).join('');
}

function addGVmail(i,mail){
 if(!mail)return;
 let p=state.platzhalter[i];
 let arr=p.Inhalt?p.Inhalt.split(';').map(m=>m.trim()):[];
 if(!arr.includes(mail)){arr.push(mail);p.Inhalt=arr.join('; ');renderGV();}
}
function removeGVmail(i,mail){
 let p=state.platzhalter[i];
 p.Inhalt=p.Inhalt.split(';').map(m=>m.trim()).filter(m=>m!==mail).join('; ');
 renderGV();
}

/* ======================= */
function renderAppInfo(){/* unverändert */}
function renderTermine(){/* unverändert */}
function renderAnmeldungen(){/* unverändert */}
function renderEditor(){/* unverändert */}

async function saveAll(){
 await fetch(WORKER_URL+"?action=saveAdminData",{method:'POST',body:JSON.stringify(state)});
 alert("Gespeichert");
}

window.onload=loadData;
</script>

</body>
</html>
