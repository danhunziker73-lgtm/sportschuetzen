<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Panel | Sportschützen Muhen</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; --bg: #f8f9fa; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        /* Sektionen */
        .section { margin-bottom: 40px; padding: 15px; border: 1px solid #eee; border-radius: 8px; }
        .grid-row { display: grid; grid-template-columns: 250px 1fr 200px; gap: 15px; margin-bottom: 10px; align-items: center; }
        
        /* Tabelle */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9em; }
        th, td { border: 1px solid #dee2e6; padding: 8px; text-align: left; }
        th { background: #e9ecef; position: sticky; top: 0; }
        
        /* Inputs */
        input, select { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input:focus { border-color: var(--primary); outline: none; }
        
        /* Buttons */
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
        .btn-save { background: var(--success); width: 100%; font-size: 1.1em; margin-top: 20px; }
        .btn-add { background: var(--primary); margin-bottom: 10px; }
        .btn-del { background: var(--danger); padding: 5px 8px; }
        
        .loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); 
                           display:flex; justify-content:center; align-items:center; z-index:1000; font-weight:bold; }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay">Lade Daten aus Google Sheets...</div>

<div class="container">
    <h1>Vereins-Administration</h1>

    <div class="section">
        <h2>GV Konfiguration (Platzhalter)</h2>
        <div id="platzhalter-list"></div>
    </div>

    <div class="section">
        <h2>Jahresprogramm & Termine</h2>
        <button class="btn btn-add" onclick="addTermin()">+ Neuer Termin</button>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 130px;">Datum</th>
                        <th style="width: 80px;">Zeit</th>
                        <th>Anlass / Titel</th>
                        <th>Ort</th>
                        <th>Kategorie</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="termine-body"></tbody>
            </table>
        </div>
    </div>

    <div class="section">
        <h2>App Info & Mail-Verteiler</h2>
        <div id="app-info-list"></div>
    </div>

    <button class="btn btn-save" onclick="saveAll()">Speichern & in Google Sheet übertragen</button>
</div>

<script>
    const WORKER_URL = "https://dein-worker.workers.dev/"; // DEINE URL HIER
    let state = { platzhalter: [], termine: [], app_info: [], dropdowns: {} };

    // 1. DATEN LADEN
    async function loadData() {
        try {
            const resp = await fetch(`${WORKER_URL}?action=loadAdminData`);
            state = await resp.json();
            renderAll();
            document.getElementById('loading').style.display = 'none';
        } catch (err) {
            alert("Fehler beim Laden der Daten: " + err);
        }
    }

    // 2. RENDERING FUNKTIONEN
    function renderAll() {
        renderPlatzhalter();
        renderTermine();
        renderAppInfo();
    }

    function renderPlatzhalter() {
        const container = document.getElementById('platzhalter-list');
        container.innerHTML = state.platzhalter.map((p, i) => `
            <div class="grid-row">
                <strong>${p.platzhaltername}</strong>
                <input type="text" value="${p.inhalt}" onchange="state.platzhalter[${i}].inhalt = this.value">
                <small>${p.erklärung}</small>
            </div>
        `).join('');
    }

    function renderTermine() {
        const body = document.getElementById('termine-body');
        body.innerHTML = state.termine.map((t, i) => {
            // Datums-Hacks für Google-Formate
            const d = t.datum && t.datum.includes('T') ? t.datum.split('T')[0] : "";
            const s = t.startzeit && t.startzeit.includes('T') ? t.startzeit.split('T')[1].substring(0,5) : t.startzeit;
            
            return `
            <tr>
                <td><input type="date" value="${d}" onchange="state.termine[${i}].datum = this.value"></td>
                <td><input type="time" value="${s}" onchange="state.termine[${i}].startzeit = this.value"></td>
                <td><input type="text" value="${t['anlass_/_titel'] || ''}" onchange="state.termine[${i}]['anlass_/_titel'] = this.value"></td>
                <td>${createSelect(state.dropdowns.orte, t.ort, i, 'ort')}</td>
                <td>${createSelect(state.dropdowns.kategorien, t.kategorie, i, 'kategorie')}</td>
                <td>${createSelect(state.dropdowns.status, t.status, i, 'status')}</td>
                <td><button class="btn btn-del" onclick="deleteTermin(${i})">X</button></td>
            </tr>`;
        }).join('');
    }

    function renderAppInfo() {
        const container = document.getElementById('app-info-list');
        container.innerHTML = state.app_info.map((info, i) => `
            <div class="grid-row">
                <strong>${info.bezeichnung}</strong>
                <input type="text" value="${info.mailempfänger}" onchange="state.app_info[${i}].mailempfänger = this.value">
                <small>${info.bemerkung || ''}</small>
            </div>
        `).join('');
    }

    // 3. HILFSFUNKTIONEN
    function createSelect(options, selected, index, field) {
        return `<select onchange="state.termine[${index}].${field} = this.value">
            ${options.map(o => `<option value="${o}" ${o === selected ? 'selected' : ''}>${o}</option>`).join('')}
        </select>`;
    }

    function addTermin() {
        state.termine.unshift({ datum: "", startzeit: "", "anlass_/_titel": "Neuer Anlass", ort: "Muhen", kategorie: "Jahresprogramm", status: "provisorisch" });
        renderTermine();
    }

    function deleteTermin(i) {
        if(confirm("Termin wirklich löschen?")) { state.termine.splice(i, 1); renderTermine(); }
    }

    // 4. SPEICHERN
    async function saveAll() {
        const btn = document.querySelector('.btn-save');
        btn.disabled = true;
        btn.innerText = "Speichere...";

        try {
            const resp = await fetch(`${WORKER_URL}?action=saveAdminData`, {
                method: 'POST',
                body: JSON.stringify(state)
            });
            const res = await resp.json();
            alert("Erfolgreich gespeichert!");
        } catch (err) {
            alert("Fehler beim Speichern: " + err);
        } finally {
            btn.disabled = false;
            btn.innerText = "Speichern & in Google Sheet übertragen";
        }
    }

    window.onload = loadData;
</script>

</body>
</html>
