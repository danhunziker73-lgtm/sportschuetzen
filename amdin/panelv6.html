<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin-Panel 4.0 | Sportschützen Muhen</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --primary:#0f3a5d; --success:#10b981; --danger:#ef4444;
    --bg:#f3f4f6; --card:#fff; --border:#d1d5db;
    --text:#1f2937; --text-light:#6b7280;
}
*{box-sizing:border-box}
body{
    margin:0;font-family:Inter,sans-serif;background:var(--bg);
    color:var(--text);padding-bottom:90px
}
header{
    position:sticky;top:0;z-index:1000;
    background:var(--primary);color:#fff;padding:18px;
    text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.15)
}
main{max-width:1400px;margin:auto;padding:15px}
.card{
    background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:20px;margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.05)
}
h3{margin:0 0 10px;color:var(--primary)}
.gv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:15px}
.gv-item{border:1px solid #edf2f7;border-radius:12px;padding:15px}
.gv-item label{display:block;font-size:.8rem;font-weight:700;color:var(--text-light);margin-bottom:6px}
input,select{
    width:100%;padding:8px;border:1px solid var(--border);
    border-radius:8px;font-size:.9rem
}
.tag-box{
    display:flex;flex-wrap:wrap;gap:5px;
    background:#f9fafb;border:1px solid var(--border);
    padding:8px;border-radius:8px;margin-bottom:6px
}
.tag{
    background:#e0e7ff;color:#0f3a5d;
    padding:4px 10px;border-radius:6px;
    font-size:.8rem;font-weight:600;
    display:flex;gap:6px;align-items:center
}
.tag span{cursor:pointer;color:var(--danger)}
.bottom-nav{
    position:fixed;bottom:0;width:100%;height:75px;
    background:#fff;border-top:1px solid #e5e7eb;
    display:flex;z-index:2000
}
.nav-item{
    flex:1;border:none;background:none;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    font-size:.7rem;font-weight:600;
    color:var(--text-light)
}
.nav-item.active{color:var(--primary)}
.nav-save{
    background:var(--primary)!important;color:#fff!important;
    width:60px;height:60px;border-radius:50%;
    position:relative;top:-15px;border:4px solid var(--bg)
}
.loader{
    position:fixed;inset:0;background:#fff;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:9999
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>

<div id="loader" class="loader">
    <div style="width:40px;height:40px;border:4px solid #eee;border-top:4px solid var(--primary);border-radius:50%;animation:spin 1s linear infinite"></div>
    <p>Daten werden geladen…</p>
</div>

<header>
    <h1 id="tab-title">GV & App-Konfiguration</h1>
</header>

<main>
<section id="tab-gv" class="tab-content active">
    <div class="card">
        <h3>⚙️ GV Stammdaten</h3>
        <div id="gv-list" class="gv-grid"></div>
    </div>
</section>
</main>

<nav class="bottom-nav">
    <button class="nav-item active"><span>⚙️</span>GV</button>
    <button class="nav-item nav-save" onclick="saveAll()"><span>💾</span></button>
</nav>

<script>
const WORKER_URL="https://termine.dan-hunziker73.workers.dev/";

let state={
    platzhalter:[],
    members:[]
};

async function loadData(){
    const r=await fetch(`${WORKER_URL}?action=loadAdminData`);
    state=await r.json();
    renderGV();
    document.getElementById("loader").style.display="none";
}

/* =========================
   GV RENDER (FINAL & FIXED)
   ========================= */
function renderGV(){
    const c=document.getElementById("gv-list");
    c.innerHTML=state.platzhalter.map((p,i)=>{
        const label=p.Bezeichnung_App||p.bezeichnung_app||p.name||"Feld";
        const isMail=p.name && p.name.startsWith("Mail_");

        const mails=(p.Inhalt||"")
            .split(";")
            .map(m=>m.trim())
            .filter(Boolean);

        return `
        <div class="gv-item">
            <label>${label}</label>

            ${isMail?`
                <div class="tag-box">
                    ${mails.map(m=>`
                        <div class="tag">
                            ${m}
                            <span onclick="removeMail(${i},'${m}')">×</span>
                        </div>
                    `).join("")}
                </div>

                <select onchange="addMail(${i},this.value);this.value=''">
                    <option value="">+ Empfänger hinzufügen</option>
                    ${state.members.map(m=>`
                        <option value="${m.e_mail}">
                            ${m.vorname} ${m.nachname}
                        </option>
                    `).join("")}
                </select>
            `:`
                <input type="text"
                       value="${p.Inhalt||""}"
                       onchange="state.platzhalter[${i}].Inhalt=this.value">
            `}
        </div>`;
    }).join("");
}

/* =========================
   MAIL LOGIK (GV)
   ========================= */
function addMail(idx,email){
    if(!email) return;
    let cur=state.platzhalter[idx].Inhalt
        ?state.platzhalter[idx].Inhalt.split(";").map(m=>m.trim())
        :[];
    if(!cur.includes(email)){
        cur.push(email);
        state.platzhalter[idx].Inhalt=cur.join("; ");
        renderGV();
    }
}
function removeMail(idx,email){
    let cur=state.platzhalter[idx].Inhalt.split(";").map(m=>m.trim());
    state.platzhalter[idx].Inhalt=cur.filter(m=>m!==email).join("; ");
    renderGV();
}

/* =========================
   SAVE
   ========================= */
async function saveAll(){
    await fetch(`${WORKER_URL}?action=saveAdminData`,{
        method:"POST",
        body:JSON.stringify(state)
    });
    alert("✅ Gespeichert");
}

window.onload=loadData;
</script>
</body>
</html>
