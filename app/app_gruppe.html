<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="gruppe.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <div class="subtitle" id="sub-title">Daten werden geladen...</div>
    <div id="overview"></div>

<div class="gruppe-table-row">
    <div class="name-col">**Name des Schützen**</div>
    <div class="val-col"><span class="pos-label">L:</span> 98</div>
    <div class="val-col"><span class="pos-label">K:</span> 92</div>
    <div class="total-col">**190**</div>
    <div class="status-col">✅</div>
</div>
    
<script>
    const WORKER_URL = "https://gruppe.dan-hunziker73.workers.dev";
    const urlParams = new URLSearchParams(window.location.search);
    const selectedYear = urlParams.get('jahr') || 'aktuell';

    let raw = [];
    let teams = [];

    window.onload = loadData;

    async function loadData() {
        document.getElementById('sub-title').textContent =
            'Übersicht – auf Punkte klicken für Details';

        const url = `${WORKER_URL}?type=gruppe&jahr=${selectedYear}`;

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(response.status);

            const json = await response.json();
            const rows = json.table?.rows || [];

            raw = rows.map(r => {
                let row = {
                    name: r.c[0]?.v || "",
                    stellung: r.c[1]?.v || ""
                };
                for (let i = 1; i <= 3; i++) {
                    row[`r${i}Team`] = r.c[(i - 1) * 3 + 2]?.v || "";
                    row[`r${i}Pkt1`] = Number(r.c[(i - 1) * 3 + 3]?.v) || 0;
                    row[`r${i}Pkt2`] = Number(r.c[(i - 1) * 3 + 4]?.v) || 0;
                    row[`r${i}Sum`]  = row[`r${i}Pkt1`] + row[`r${i}Pkt2`];
                }
                return row;
            });

            teams = [...new Set(
                raw.flatMap(r =>
                    Object.keys(r)
                        .filter(k => k.includes("Team"))
                        .map(k => r[k])
                        .filter(Boolean)
                )
            )].sort();

            buildTable();
        } catch {
            document.getElementById("overview").innerHTML =
                "<p style='color:red'>Fehler beim Laden</p>";
        }
    }

    function buildTable() {
        let html = `
        <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th></th>
                    <th>R1</th>
                    <th>R2</th>
                    <th>R3</th>
                </tr>
            </thead>
            <tbody>`;

        teams.forEach((team, index) => {
            html += `<tr>
                <td class="team">${team}</td>`;

            for (let r = 1; r <= 3; r++) {
                const sum = raw
                    .filter(p => p[`r${r}Team`] === team)
                    .reduce((a, b) => a + b[`r${r}Sum`], 0);

                html += `<td class="cell"
                    onclick="toggleDetail('${team.replace(/'/g,"\\'")}',${r},${index})">
                    ${sum || "–"}
                </td>`;
            }

            html += `</tr>
                <tr>
                    <td colspan="4">
                        <div id="detail-div-${index}" class="detail"></div>
                    </td>
                </tr>`;
        });

        html += `
            </tbody>
        </table>
        </div>`;

        document.getElementById("overview").innerHTML = html;
    }

    function toggleDetail(team, round, index) {
        document.querySelectorAll('.detail').forEach(d => d.style.display = 'none');
        const div = document.getElementById(`detail-div-${index}`);

        const list = raw.filter(p => p[`r${round}Team`] === team);
        let total = 0;
        let html = `<h3>${team} – Runde ${round}</h3>`;

        list.forEach(p => {
            const sum = p[`r${round}Sum`];
            total += sum;
            const cls = p.stellung.toLowerCase() === "liegend" ? "liegend" : "kniend";

            html += `
                <div class="player">
                    <div class="name">
                        ${p.name}
                        <span class="stellung ${cls}">${p.stellung}</span>
                    </div>
                    <div>${p[`r${round}Pkt1`]}</div>
                    <div>${p[`r${round}Pkt2`]}</div>
                    <div><strong>${sum}</strong></div>
                </div>`;
        });

        div.innerHTML = html + `<div class="total">Gesamt: ${total}</div>`;
        div.style.display = "block";
    }
</script>

</body>
</html>
