<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gruppe</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background: #f4f6f8; color: #333; }
        h2 { color: #0f3c5c; }
        #overview-gm,#overview-gc { margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th,td { padding: 8px; border: 1px solid #ccc; text-align: center; }
        th { background: #0f3c5c; color: #fff; }
        .team { text-align: left; color: #0f3c5c; font-weight: bold; }
    </style>
</head>
<body>

<h2>Gruppen-Statistik</h2>

<div id="overview-gm">Lade Gruppe Daten...</div>
<div id="overview-gc">Lade Grenzland Daten...</div>

<script>
(function () {

const WORKER_URL="https://gruppe.dan-hunziker73.workers.dev";
const selectedYear="aktuell";
let rawGM=[], rawGC=[], loading=false;

/******** CACHE ********/
const Cache={
    get:k=>JSON.parse(localStorage.getItem(k)||"null"),
    set:(k,d)=>localStorage.setItem(k,JSON.stringify({ts:Date.now(),data:d}))
};

/******** FETCH ********/
async function fetchWithRetry(url,retries=3){
    for(let i=1;i<=retries;i++){
        try{
            const c=new AbortController();
            setTimeout(()=>c.abort(),8000);
            const r=await fetch(url,{signal:c.signal,cache:"no-store"});
            if(!r.ok) throw r.status;
            return await r.json();
        }catch{
            if(i===retries) throw i;
            await new Promise(r=>setTimeout(r,400*i));
        }
    }
}

async function fetchCached(url,key){
    try{
        const d=await fetchWithRetry(url);
        Cache.set(key,d);
        return d;
    }catch{
        const c=Cache.get(key);
        if(c) return c.data;
        throw "offline";
    }
}

/******** MINIMAL FIX: buildTable ********/
function buildTable(type, data, containerId){
    const container=document.getElementById(containerId);
    if(!data||data.length===0){
        container.innerHTML="Keine Daten verfügbar";
        return;
    }
    let html=`<table><thead><tr><th>Team</th><th>Punkte</th></tr></thead><tbody>`;
    data.forEach(r=>{
        html+=`<tr><td class="team">${r.team||r.name||"?"}</td><td>${r.punkte||"-"}</td></tr>`;
    });
    html+=`</tbody></table>`;
    container.innerHTML=html;
}

/******** LOAD ********/
async function loadAllData(){
    if(loading) return;
    loading=true;
    try{
        [rawGM,rawGC]=await Promise.all([
            fetchCached(`${WORKER_URL}?type=gruppe&jahr=${selectedYear}`,"gruppe-gm"),
            fetchCached(`${WORKER_URL}?type=grenzland&jahr=${selectedYear}`,"gruppe-gc")
        ]);
        buildTable("gm",rawGM,"overview-gm");
        buildTable("gc",rawGC,"overview-gc");
    }finally{
        loading=false;
    }
}

/******** RESUME ********/
window.addEventListener("message",e=>{
    if(e.data?.type==="app:resume"){
        console.log("🔄 Gruppe Resume");
        loadAllData();
    }
});

window.addEventListener("load",loadAllData);

})();
</script>

</body>
</html>
