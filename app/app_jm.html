<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jahresmeisterschaft</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; background: #f4f6f8; color: #333; }
        h2 { color: #0f3c5c; }
        table { width: 100%; border-collapse: collapse; background: #fff; margin-bottom: 20px; }
        th, td { padding: 8px; border: 1px solid #ccc; text-align: center; }
        th { background: #0f3c5c; color: #fff; }
        .team { text-align: left; color: #0f3c5c; font-weight: bold; }
    </style>
</head>
<body>

<h2>Jahresmeisterschaft</h2>
<div id="content">Lade Daten…</div>

<script>
(function(){

const API_URL="https://jahresmeisterschaft-muhen.dan-hunziker73.workers.dev?jahr=current";
let loading=false;

/******** CACHE ********/
const Cache={
    get:k=>JSON.parse(localStorage.getItem(k)||"null"),
    set:(k,d)=>localStorage.setItem(k,JSON.stringify({ts:Date.now(),data:d}))
};

async function fetchWithRetry(url,retries=3){
    for(let i=1;i<=retries;i++){
        try{
            const c=new AbortController();
            setTimeout(()=>c.abort(),8000);
            const r=await fetch(url,{signal:c.signal,cache:"no-store"});
            if(!r.ok) throw r.status;
            return await r.json();
        }catch{
            if(i===retries) throw i;
            await new Promise(r=>setTimeout(r,400*i));
        }
    }
}

/******** MINIMAL FIX: renderLiga ********/
function renderLiga(ligaNr, data){
    if(!data||data.length===0) return `<p>Liga ${ligaNr}: Keine Daten</p>`;
    let html=`<h3>Liga ${ligaNr}</h3><table><thead><tr><th>Rang</th><th>Name</th><th>Punkte</th></tr></thead><tbody>`;
    data.forEach(r=>{
        html+=`<tr><td>${r.rang||"-"}</td><td class="team">${r.name||"?"}</td><td>${r.punkte||"-"}</td></tr>`;
    });
    html+=`</tbody></table>`;
    return html;
}

/******** LOAD ********/
async function loadJMData(){
    if(loading) return;
    loading=true;
    try{
        let data;
        try{
            data=await fetchWithRetry(API_URL);
            Cache.set("jm-current",data);
        }catch{
            const c=Cache.get("jm-current");
            if(!c) throw "offline";
            data=c.data;
        }
        document.getElementById("content").innerHTML =
            renderLiga(1,data.liga1)+renderLiga(2,data.liga2);
    }finally{
        loading=false;
    }
}

/******** RESUME ********/
window.addEventListener("message", e => {
    if(e.data?.type==="app:resume"){
        console.log("🔄 JM Resume");
        loadJMData();
    }
});

window.addEventListener("load",loadJMData);

})();
</script>

</body>
</html>
