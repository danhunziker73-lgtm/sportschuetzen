<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mannschaftsmeisterschaft</title>
    <style>
        /* --- BASE CSS INTEGRATION --- */
        :root {
            --primary: #0f3c5c;
            --bg: #f4f6f8;
            --text: #333;
            --line: #e0e0e0;
            --hover: #e6eef5;
        }

        body {
            font-family: Arial, system-ui, -apple-system, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 15px;
            color: var(--text);
        }

        .subtitle { color: #666; margin-bottom: 15px; font-size: 14px; }

        .table-wrapper { overflow-x: auto; margin-bottom: 20px; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,.08);
            border-radius: 6px;
            overflow: hidden;
            table-layout: fixed; /* Wichtig für exakte Spaltenbreiten */
        }

        thead th {
            background: var(--primary);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 4px;
            text-align: center;
        }

        /* --- SPALTENDEFINITION --- */
        .col-team { width: auto; text-align: left; padding-left: 10px; font-weight: bold; color: var(--primary); }
        .col-round { width: 35px; text-align: center; font-variant-numeric: tabular-nums; }

        td {
            padding: 10px 4px;
            border-bottom: 1px solid var(--line);
            font-size: 14px;
            white-space: nowrap;
        }

        .cell { cursor: pointer; }
        .cell:hover { background: var(--hover); }

        /* --- DETAIL BEREICH (Alpha/Beta Look) --- */
        .detail { display: none; background: #f9f9f9; }
        
        .detail-content {
            padding: 15px 20px;
            text-align: center;
        }

        .detail-header {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 16px;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            max-width: 400px; /* Hält die Detailansicht zentriert und kompakt */
            margin: 0 auto;
        }

        .player-name { text-align: left; flex: 1; }
        .player-score { text-align: right; font-weight: bold; width: 60px; }

        /* --- GESAMT ZEILE (Bündig mit Player Scores) --- */
        .total-wrapper {
            max-width: 400px;
            margin: 10px auto 0;
            border-top: 2px solid var(--primary);
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-label { font-weight: bold; font-size: 16px; color: var(--primary); }
        .total-val { font-weight: 900; font-size: 18px; color: #000; }

        /* Spinner */
        #pull-spinner {
            position: fixed; top: -50px; left: 50%; transform: translateX(-50%);
            width: 42px; height: 42px; background: var(--primary); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; z-index: 9999; transition: top 0.15s;
        }
        .spinner-icon { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="pull-spinner"><div class="spinner-icon"></div></div>
<div class="subtitle" id="sub-title">Lade Daten...</div>
<div id="overview"></div>

<script>
    const WORKER_URL = "https://gruppe.dan-hunziker73.workers.dev";
    const urlParams = new URLSearchParams(window.location.search);
    const selectedYear = urlParams.get('jahr') || 'aktuell';

    // Pull-to-Refresh
    let touchStart = 0;
    document.addEventListener('touchstart', e => { touchStart = e.touches[0].pageY; }, {passive: true});
    document.addEventListener('touchend', e => {
        if (window.scrollY <= 0 && (e.changedTouches[0].pageY - touchStart) > 130) location.reload();
        else document.getElementById('pull-spinner').style.top = '-50px';
    }, {passive: true});
    document.addEventListener('touchmove', e => {
        let dist = e.touches[0].pageY - touchStart;
        if (window.scrollY <= 0 && dist > 0) document.getElementById('pull-spinner').style.top = Math.min(dist/2.5, 60) + 'px';
    }, {passive: true});

    let raw = [];
    let teams = [];

    async function loadData() {
        try {
            const response = await fetch(`${WORKER_URL}?type=mannschaft&jahr=${selectedYear}`);
            const json = await response.json();
            const rows = json.table?.rows || [];

            raw = rows.map(r => {
                let o = { name: r.c[0]?.v || "" };
                for (let i = 1; i <= 7; i++) {
                    o[`r${i}Team`] = r.c[(i - 1) * 2 + 1]?.v || "";
                    o[`r${i}Pkt`]  = Number(r.c[(i - 1) * 2 + 2]?.v) || 0;
                }
                return o;
            });

            teams = [...new Set(raw.flatMap(r => Object.keys(r).filter(k => k.includes("Team")).map(k => r[k]).filter(Boolean)))].sort();
            document.getElementById('sub-title').textContent = 'Übersicht – auf Punkte klicken für Details';
            buildTable();
        } catch {
            document.getElementById("overview").innerHTML = "<p style='color:red'>Fehler beim Laden</p>";
        }
    }

    function buildTable() {
        let html = `<div class="table-wrapper"><table><thead><tr><th class="col-team"></th>`;
        for (let r = 1; r <= 7; r++) html += `<th class="col-round">R${r}</th>`;
        html += `</tr></thead><tbody>`;

        teams.forEach((team, index) => {
            html += `<tr><td class="col-team">${team}</td>`;
            for (let r = 1; r <= 7; r++) {
                const sum = raw.filter(p => p[`r${r}Team`] === team).reduce((a, b) => a + b[`r${r}Pkt`], 0);
                html += `<td class="col-round cell" onclick="toggleDetail('${team.replace(/'/g,"\\'")}', ${r}, ${index})">${sum || "–"}</td>`;
            }
            html += `</tr><tr><td colspan="8" style="padding:0; border:0;"><div id="detail-div-${index}" class="detail"></div></td></tr>`;
        });
        document.getElementById("overview").innerHTML = html + `</tbody></table></div>`;
    }

    function toggleDetail(team, round, index) {
        const div = document.getElementById(`detail-div-${index}`);
        if(div.style.display === "table-row" || div.style.display === "block") { div.style.display = 'none'; return; }
        document.querySelectorAll('.detail').forEach(d => d.style.display = 'none');

        const list = raw.filter(p => p[`r${round}Team`] === team);
        let total = 0;
        let html = `<div class="detail-content"><div class="detail-header">${team} – Runde ${round}</div>`;

        list.forEach(p => {
            const pkt = p[`r${round}Pkt`];
            total += pkt;
            html += `<div class="player-row"><div class="player-name">${p.name}</div><div class="player-score">${pkt}</div></div>`;
        });

        html += `
            <div class="total-wrapper">
                <div class="total-label">Gesamt:</div>
                <div class="total-val">${total}</div>
            </div></div>`;

        div.innerHTML = html;
        div.style.display = 'block';
    }

    window.onload = loadData;
</script>
</body>
</html>
