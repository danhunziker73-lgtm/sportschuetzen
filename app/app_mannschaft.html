<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sportschützen Muhen</title>
<style>
    body { font-family: Arial, sans-serif; padding: 10px; background: #f4f6f8; color: #333; }
    .subtitle { color: #666; margin-bottom: 12px; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
    th,td { padding: 10px; border: 1px solid #ccc; text-align: center; }
    th { background: #0f3c5c; color: #fff; }
    .team { text-align: left; color: #0f3c5c; font-weight: bold; }
</style>
</head>
<body>

<div class="subtitle" id="sub-title">Lade Mannschaftsdaten...</div>
<div id="overview"></div>

<script>
(function(){

const WORKER_URL="https://gruppe.dan-hunziker73.workers.dev";
const selectedYear="aktuell";
let raw=[],teams=[],loading=false;

/******** CACHE ********/
const Cache={
    get:k=>JSON.parse(localStorage.getItem(k)||"null"),
    set:(k,d)=>localStorage.setItem(k,JSON.stringify({ts:Date.now(),data:d}))
};

async function fetchWithRetry(url,retries=3){
    for(let i=1;i<=retries;i++){
        try{
            const c=new AbortController();
            setTimeout(()=>c.abort(),8000);
            const r=await fetch(url,{signal:c.signal,cache:"no-store"});
            if(!r.ok) throw r.status;
            return await r.json();
        }catch{
            if(i===retries) throw i;
            await new Promise(r=>setTimeout(r,400*i));
        }
    }
}

/******** MINIMAL FIX: buildTable ********/
function buildTable(){
    const container=document.getElementById("overview");
    if(!raw||raw.length===0){
        container.innerHTML="Keine Daten verfügbar";
        return;
    }
    let html=`<table><thead><tr><th>Team</th><th>Punkte</th></tr></thead><tbody>`;
    raw.forEach(r=>{
        html+=`<tr><td class="team">${r.team||r.name||"?"}</td><td>${r.punkte||"-"}</td></tr>`;
    });
    html+=`</tbody></table>`;
    container.innerHTML=html;
}

/******** LOAD ********/
async function loadData(){
    if(loading) return;
    loading=true;
    try{
        try{
            raw=await fetchWithRetry(`${WORKER_URL}?type=mannschaft&jahr=${selectedYear}`);
            Cache.set("mannschaft",raw);
        }catch{
            const c=Cache.get("mannschaft");
            if(!c) throw "offline";
            raw=c.data;
        }

        teams=[...new Set(raw.flatMap(r=>{
            let t=[];
            for(let i=1;i<=7;i++) if(r[`r${i}Team`]) t.push(r[`r${i}Team`]);
            return t;
        }))].sort();

        buildTable();
    }finally{
        loading=false;
    }
}

/******** RESUME ********/
window.addEventListener("message", e => {
    if(e.data?.type==="app:resume"){
        console.log("🔄 Mannschaft Resume");
        loadData();
    }
});

window.addEventListener("load", loadData);

})();
</script>

</body>
</html>
