<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* ===============================
           BASE – 1:1 übernommen
           =============================== */
        :root {
          --primary: #0f3c5c;
          --bg: #f4f6f8;
          --text: #333;
          --line: #e0e0e0;
          --hover: #e6eef5;
        }

        body {
          font-family: Arial, system-ui, -apple-system, sans-serif;
          background: var(--bg);
          margin: 0;
          padding: 15px;
          color: var(--text);
        }

        .subtitle { color: #666; margin-bottom: 15px; font-size: 14px; }
        .table-wrapper { overflow-x: auto; margin-bottom: 20px; }

        table {
          width: 100%;
          border-collapse: collapse;
          background: #fff;
          box-shadow: 0 2px 6px rgba(0,0,0,.08);
          border-radius: 6px;
          overflow: hidden;
        }

        thead th {
          background: var(--primary);
          color: #fff;
          font-size: 13px;
          font-weight: 600;
          padding: 12px 10px; // 10 6
          text-align: center;
        }

        td {
          padding: 8px 6px;
          text-align: center;
          border-bottom: 1px solid var(--line);
          font-size: 14px;
        }

        td.team {
          font-weight: bold;
          text-align: left;
          color: var(--primary);
        }

        .cell { cursor: pointer; }
        .cell:hover { background: var(--hover); }

        /* --- DETAIL BEREICH --- */
        .detail { display: none; background: #f9f9f9; }
        .detail-box { padding: 12px 15px; }
        
        h3 { font-size: 16px; margin-top: 0; color: var(--primary); text-align: center; }

        .player {
          display: flex;
          justify-content: space-between;
          padding: 6px 0;
          border-bottom: 1px solid #eee;
          font-size: 14px;
        }

        /* Die Gesamtzeile mit Strich wie bei Gruppe */
        .total-row {
          display: flex;
          justify-content: space-between;
          margin-top: 5px;
          padding-top: 10px;
          border-top: 2px solid var(--primary); /* Fester Strich oben */
          font-weight: bold;
          font-size: 16px;
        }

        /* ===============================
           MANNSCHAFT OVERRIDES
           =============================== */
        table { width: auto; table-layout: fixed; }
        td.team { width: 140px; }
        th:not(:first-child), td.cell {
          width: 32px;
          min-width: 32px;
          max-width: 32px;
          padding: 2px 2px;
          font-variant-numeric: tabular-nums;
        }

        /* ===============================
           SPINNER
           =============================== */
        #pull-spinner {
          position: fixed; top: -50px; left: 50%; transform: translateX(-50%);
          width: 42px; height: 42px; background: var(--primary); border-radius: 50%;
          display: flex; align-items: center; justify-content: center; z-index: 9999; transition: top 0.15s;
        }
        .spinner-icon { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="pull-spinner"><div class="spinner-icon"></div></div>
<div class="subtitle" id="sub-title">Lade Daten...</div>
<div id="overview"></div>

<script>
    const WORKER_URL = "https://gruppe.dan-hunziker73.workers.dev";
    const urlParams = new URLSearchParams(window.location.search);
    const selectedYear = urlParams.get('jahr') || 'aktuell';

    let raw = [];
    let teams = [];

    // Pull-to-Refresh
    let touchStart = 0;
    document.addEventListener('touchstart', e => { touchStart = e.touches[0].pageY; }, {passive: true});
    document.addEventListener('touchmove', e => {
        let dist = e.touches[0].pageY - touchStart;
        if (window.scrollY <= 0 && dist > 0) document.getElementById('pull-spinner').style.top = Math.min(dist/2.5, 60) + 'px';
    }, {passive: true});
    document.addEventListener('touchend', e => {
        if (window.scrollY <= 0 && (e.changedTouches[0].pageY - touchStart) > 130) location.reload();
        else document.getElementById('pull-spinner').style.top = '-50px';
    }, {passive: true});

    async function loadData() {
        try {
            const response = await fetch(`${WORKER_URL}?type=mannschaft&jahr=${selectedYear}`);
            const json = await response.json();
            const rows = json.table?.rows || [];
            raw = rows.map(r => {
                let o = { name: r.c[0]?.v || "" };
                for (let i = 1; i <= 7; i++) {
                    o[`r${i}Team`] = r.c[(i - 1) * 2 + 1]?.v || "";
                    o[`r${i}Pkt`]  = Number(r.c[(i - 1) * 2 + 2]?.v) || 0;
                }
                return o;
            });
            teams = [...new Set(raw.flatMap(r => Object.keys(r).filter(k => k.includes("Team")).map(k => r[k]).filter(Boolean)))].sort();
            document.getElementById('sub-title').textContent = 'Übersicht – auf Punkte klicken für Details';
            buildTable();
        } catch {
            document.getElementById("overview").innerHTML = "Fehler beim Laden";
        }
    }

    function buildTable() {
        let html = `<div class="table-wrapper"><table><thead><tr><th></th>`;
        for (let r = 1; r <= 7; r++) html += `<th>R${r}</th>`;
        html += `</tr></thead><tbody>`;
        teams.forEach((team, index) => {
            html += `<tr><td class="team">${team}</td>`;
            for (let r = 1; r <= 7; r++) {
                const sum = raw.filter(p => p[`r${r}Team`] === team).reduce((a, b) => a + b[`r${r}Pkt`], 0);
                html += `<td class="cell" onclick="toggleDetail('${team.replace(/'/g,"\\'")}',${r},${index})">${sum || "–"}</td>`;
            }
            html += `</tr><tr><td colspan="8" style="padding:0; border:0;"><div id="detail-div-${index}" class="detail"></div></td></tr>`;
        });
        document.getElementById("overview").innerHTML = html + `</tbody></table></div>`;
    }

    function toggleDetail(team, round, index) {
        document.querySelectorAll('.detail').forEach(d => d.style.display = 'none');
        const div = document.getElementById(`detail-div-${index}`);
        const list = raw.filter(p => p[`r${round}Team`] === team);
        let total = 0;
        let html = `<div class="detail-box"><h3>${team} – Runde ${round}</h3>`;
        list.forEach(p => {
            total += p[`r${round}Pkt`];
            html += `<div class="player"><div>${p.name}</div><div><strong>${p[`r${round}Pkt`]}</strong></div></div>`;
        });
        // Gesamtzeile: Label links, Wert rechts bündig mit den Player-Strong-Werten
        html += `<div class="total-row"><div>Gesamt:</div><div>${total}</div></div></div>`;
        div.innerHTML = html;
        div.style.display = 'block';
    }

    window.onload = loadData;
</script>
</body>
</html>
