<script>
(function () {

const WORKER_URL="https://gruppe.dan-hunziker73.workers.dev";
const selectedYear="aktuell";
let raw=[], teams=[], loading=false;

/******** CACHE ********/
const Cache={
    get:k=>JSON.parse(localStorage.getItem(k)||"null"),
    set:(k,d)=>localStorage.setItem(k,JSON.stringify({ts:Date.now(),data:d}))
};

async function fetchWithRetry(url,retries=3){
    for(let i=1;i<=retries;i++){
        try{
            const c=new AbortController();
            setTimeout(()=>c.abort(),8000);
            const r=await fetch(url,{signal:c.signal,cache:"no-store"});
            if(!r.ok) throw r.status;
            return await r.json();
        }catch{
            if(i===retries) throw i;
            await new Promise(r=>setTimeout(r,400*i));
        }
    }
}

/******** BUILD TABLE ********/
function buildTable(){
    if(!raw.length) {
        document.getElementById("overview").innerHTML = "<p>Keine Daten vorhanden.</p>";
        return;
    }

    let html = '<div class="table-wrapper"><table>';
    html += '<thead><tr><th class="team-header">Team</th>';
    for(let i=1;i<=7;i++) html += `<th class="round">Runde ${i}</th>`;
    html += '</tr></thead><tbody>';

    teams.forEach(team=>{
        const teamRows = raw.filter(r => Object.values(r).includes(team));
        teamRows.forEach(r=>{
            html += `<tr>`;
            html += `<td class="team">${team}</td>`;
            for(let i=1;i<=7;i++){
                const val = r[`r${i}`] ?? '';
                html += `<td class="cell">${val}</td>`;
            }
            html += `</tr>`;
        });
    });

    html += '</tbody></table></div>';
    document.getElementById("overview").innerHTML = html;
}

/******** LOAD DATA ********/
async function loadData(){
    if(loading) return;
    loading=true;
    try{
        try{
            raw=await fetchWithRetry(`${WORKER_URL}?type=mannschaft&jahr=${selectedYear}`);
            Cache.set("mannschaft",raw);
        }catch{
            const c=Cache.get("mannschaft");
            if(!c) throw "offline";
            raw=c.data;
        }

        teams=[...new Set(raw.flatMap(r=>{
            let t=[];
            for(let i=1;i<=7;i++) if(r[`r${i}Team`]) t.push(r[`r${i}Team`]);
            return t;
        }))].sort();

        buildTable();
    } finally {
        loading=false;
    }
}

/******** RESUME ********/
window.addEventListener("message", e => {
    if (e.data?.type === "app:resume") {
        console.log("🔄 Mannschaft Resume");
        loadData();
    }
});

window.addEventListener("load", loadData);

})();
</script>
