<!DOCTYPE html>
<html lang="de">
<head>
 <link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="mannschaft.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


</head>

<body>
    <div class="subtitle" id="sub-title">Lade Daten...</div>
    <div id="overview"></div>

<script>
    const WORKER_URL = "https://gruppe.dan-hunziker73.workers.dev";
    const urlParams = new URLSearchParams(window.location.search);
    const selectedYear = urlParams.get('jahr') || 'aktuell';

    let raw = [];
    let teams = [];

    window.onload = loadData;

    async function loadData() {
        document.getElementById('sub-title').textContent =
            'Übersicht – auf Punkte klicken für Details';

        const url = `${WORKER_URL}?type=mannschaft&jahr=${selectedYear}`;

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(response.status);

            const json = await response.json();
            const rows = json.table?.rows || [];

            raw = rows.map(r => {
                let o = { name: r.c[0]?.v || "" };
                for (let i = 1; i <= 7; i++) {
                    o[`r${i}Team`] = r.c[(i - 1) * 2 + 1]?.v || "";
                    o[`r${i}Pkt`]  = Number(r.c[(i - 1) * 2 + 2]?.v) || 0;
                }
                return o;
            });

            teams = [...new Set(
                raw.flatMap(r =>
                    Object.keys(r)
                        .filter(k => k.includes("Team"))
                        .map(k => r[k])
                        .filter(Boolean)
                )
            )].sort();

            buildTable();
        } catch {
            document.getElementById("overview").innerHTML =
                "<p style='color:red'>Fehler beim Laden</p>";
        }
    }

    function buildTable() {
        let html = `<div class="table-wrapper"><table><tr><th></th>`;
        for (let r = 1; r <= 7; r++) html += `<th>R${r}</th>`;
        html += `</tr>`;

        teams.forEach((team, index) => {
            html += `<tr><td class="team">${team}</td>`;
            for (let r = 1; r <= 7; r++) {
                const sum = raw
                    .filter(p => p[`r${r}Team`] === team)
                    .reduce((a, b) => a + b[`r${r}Pkt`], 0);

                html += `<td class="cell"
                    onclick="toggleDetail('${team.replace(/'/g,"\\'")}',${r},${index})">
                    ${sum || "–"}
                </td>`;
            }
            html += `</tr>
                <tr>
                    <td colspan="8">
                        <div id="detail-div-${index}" class="detail"></div>
                    </td>
                </tr>`;
        });

        document.getElementById("overview").innerHTML = html + `</table></div>`;
    }

    function toggleDetail(team, round, index) {
        document.querySelectorAll('.detail').forEach(d => d.style.display = 'none');
        const div = document.getElementById(`detail-div-${index}`);

        const list = raw.filter(p => p[`r${round}Team`] === team);
        let total = 0;
        let html = `<h3>${team} – Runde ${round}</h3>`;

        list.forEach(p => {
            total += p[`r${round}Pkt`];
            html += `<div class="player">
                        <div>${p.name}</div>
                        <div><strong>${p[`r${round}Pkt`]}</strong></div>
                     </div>`;
        });

        div.innerHTML = html + `<div class="total">Total: ${total}</div>`;
        div.style.display = 'block';
    }
</script>
</body>
</html>
