<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --primary: #0f3c5c; --bg: #f4f6f8; --text: #333; --line: #e0e0e0; --hover: #e6eef5; }
        body { font-family: Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--text); }
        .subtitle { color: #666; margin-bottom: 15px; font-size: 14px; }
        .table-wrapper { overflow-x: auto; margin-bottom: 20px; }
     /*   table { width: 100%; table-layout: fixed; border-collapse: collapse; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.08); border-radius: 6px; overflow: hidden; }
    /* Ersetze deinen Tabellen-Style durch diesen hier */
table {
  width: 100%;
  table-layout: fixed; /* Zwingt den Browser, die Spaltenbreiten strikt einzuhalten */
  border-collapse: collapse;
  background: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
  border-radius: 6px;
}  
        
        thead th { background: var(--primary); color: #fff; font-size: 14px; font-weight: 600; padding: 12px 10px; text-align: center; height: 40px; box-sizing: border-box; }
        td { padding: 12px 10px; text-align: center; border-bottom: 1px solid var(--line); font-size: 14px; }
     /*  td.team, th.team-header { width: 120px; text-align: left; padding-left: 15px; } */
        /* Team-Spalte: 25% Platz */
td.team, th.team-header {
  width: 25%; 
  text-align: left;
  padding: 12px 5px 12px 10px;
  overflow: hidden;
  text-overflow: ellipsis; /* Schneidet zu lange Teamnamen sauber ab */
  white-space: nowrap;
}
        
 /*       th.round, td.cell { width: 45px; } */
        /* Runden-Spalten: Jede Runde bekommt exakt den gleichen Restplatz */
th.round, td.cell {
  width: calc(75% / 7); 
  padding: 12px 0;
  text-align: center;
  font-weight: bold;
}
        .cell { cursor: pointer; transition: background 0.2s; font-weight: bold; color: var(--primary); }
        
        /* HEATMAP FARBEN (Punkt 4) */
        .hm-low { background-color: #f8f9fa; }
        .hm-mid { background-color: #e6f6ec; color: #1f7a3a !important; } /* Leichtes Grün */
        .hm-high { background-color: #c3e6cb; color: #155724 !important; } /* Sattes Grün */
        .hm-top { background-color: #ffeeba; color: #856404 !important; } /* Gold/Spitze */

        .detail { display: none; background: #fdfdfd; padding: 20px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.06); border-bottom: 1px solid var(--line); }
        h3 { font-size: 16px; margin-top: 0; margin-bottom: 12px; color: var(--primary); text-align: left; }
     /*   .player-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; } */
        /* Detail-Ansicht Optimierung */
.player-row {
  display: grid;
  grid-template-columns: 1fr 60px; /* Name links, Score rechts fixiert */
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}
        .name-label { text-align: left; flex: 1; }
        .score-val { text-align: right; min-width: 60px; font-weight: bold; }
        .total-row { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 12px; border-top: 2px solid var(--primary); font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <div class="subtitle" id="sub-title">Lade Mannschaftsdaten...</div>
    <div id="overview"></div>

<script>
    const WORKER_URL = "https://gruppe.dan-hunziker73.workers.dev";
    const selectedYear = 'aktuell'; 
    let raw = []; let teams = [];

    // Hilfsfunktion für die Heatmap-Klasse
    function getHeatmapClass(val) {
        if (!val || val === 0) return "";
        if (val >= 197) return "hm-top";
        if (val >= 191) return "hm-high";
        if (val >= 185) return "hm-mid";
        return "hm-low";
    }

    async function loadData() {
        try {
            const response = await fetch(`${WORKER_URL}?type=mannschaft&jahr=${selectedYear}`);
            raw = await response.json(); 
            
            teams = [...new Set(raw.flatMap(r => {
                let t = [];
                for(let i=1; i<=7; i++) if(r[`r${i}Team`]) t.push(r[`r${i}Team`]);
                return t;
            }))].sort();

            document.getElementById('sub-title').textContent = 'Mannschaft – auf Punkte klicken für Details';
            buildTable();
        } catch {
            document.getElementById("overview").innerHTML = "Fehler beim Laden";
        }
    }

    function buildTable() {
        let html = `<div class="table-wrapper"><table><thead><tr><th class="team-header">Team</th>`;
        for (let r = 1; r <= 7; r++) html += `<th class="round">R${r}</th>`;
        html += `</tr></thead><tbody>`;
        
        teams.forEach((team, tIdx) => {
            html += `<tr><td class="team">${team}</td>`;
            for (let r = 1; r <= 7; r++) {
                const teamData = raw.filter(p => p[`r${r}Team`] === team && p[`r${r}Pkt`] > 0);
                const sum = teamData.reduce((a, b) => a + b[`r${r}Pkt`], 0);
                
                // Durchschnitt berechnen für Heatmap (Summe / Anzahl Schützen)
                const avg = teamData.length > 0 ? sum / teamData.length : 0;
                const hmClass = getHeatmapClass(avg);

                html += `<td class="cell ${hmClass}" onclick="toggleDetail('${team.replace(/'/g,"\\'")}',${r},${tIdx})">${sum || "–"}</td>`;
            }
            html += `</tr><tr><td colspan="8" style="padding:0; border:0;">`;
            for (let r = 1; r <= 7; r++) {
                html += `<div id="det-${tIdx}-${r}" class="detail"></div>`;
            }
            html += `</td></tr>`;
        });
        document.getElementById("overview").innerHTML = html + `</tbody></table></div>`;
    }

    function toggleDetail(team, round, tIdx) {
        const div = document.getElementById(`det-${tIdx}-${round}`);
        if(div.style.display === "block"){ div.style.display = "none"; return; }
        
        const list = raw.filter(p => p[`r${round}Team`] === team && p[`r${round}Pkt`] > 0);
        let total = 0;
        let html = `<h3>${team} – Runde ${round}</h3>`;
        
        list.forEach(p => {
            const val = p[`r${round}Pkt`];
            total += val;
            const pClass = getHeatmapClass(val);
            html += `<div class="player-row"><div class="name-label">${p.name}</div><div class="score-val ${pClass}" style="padding: 2px 5px; border-radius: 4px;">${val}</div></div>`;
        });
        
        html += `<div class="total-row"><div class="name-label">Gesamt:</div><div class="score-val">${total}</div></div>`;
        div.innerHTML = html;
        div.style.display = 'block';
    }

    window.onload = loadData;
</script>
</body>
</html>
