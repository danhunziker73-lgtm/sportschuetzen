<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
          --primary: #0f3c5c;
          --bg: #f4f6f8;
          --text: #333;
          --line: #e0e0e0;
          --hover: #e6eef5;
        }

        body {
          font-family: Arial, sans-serif;
          background: var(--bg);
          margin: 0;
          padding: 15px;
          color: var(--text);
        }

        .subtitle { color: #666; margin-bottom: 15px; font-size: 14px; }
        .table-wrapper { overflow-x: auto; margin-bottom: 20px; }

        table {
          width: 100%;
          table-layout: fixed;
          border-collapse: collapse;
          background: #fff;
          box-shadow: 0 2px 6px rgba(0,0,0,.08);
          border-radius: 6px;
          overflow: hidden;
        }

        /* OBERSTER BALKEN - Explizit hoch eingestellt */
        thead th {
          background: var(--primary);
          color: #fff;
          font-size: 14px;
          font-weight: 600;
          padding: 12px 10px; /* Deutlich mehr vertikaler Platz */
          text-align: center;
          line-height: 1.5;
          height: 40px; /* Fixe Mindesthöhe für den Balken */
          box-sizing: border-box;
        }

        /* NORMALE ZEILEN - Kompakt gehalten */
        td {
          padding: 12px 10px;
          text-align: center;
          border-bottom: 1px solid var(--line);
          font-size: 14px;
        }

        td.team, th.team-header {
          width: calc(2.5/9 * 100%); 
          text-align: left;
          padding-left: 15px;
        }

        th.round, td.cell {
          width: calc(0.9/9 * 100%);
        }

        .cell { cursor: pointer; transition: background 0.2s; font-weight: bold; color: var(--primary); }
        .cell:hover { background: var(--hover); }

        /* DETAIL CARD - ALIGNMENT KORREKTUR */
        .detail { 
          display: none; 
          background: #fdfdfd; 
          padding: 20px; 
          box-shadow: inset 0 2px 8px rgba(0,0,0,0.06); 
        }
        
        h3 { font-size: 16px; margin-top: 0; margin-bottom: 12px; color: var(--primary); text-align: left; }

        .player-row {
          display: flex;
          justify-content: space-between;
          padding: 10px 0;
          border-bottom: 1px solid #eee;
        }

        /* Name fluchtet mit "Gesamt:" */
        .name-label {
          text-align: left;
          flex: 1;
        }

        .score-val {
          text-align: right;
          min-width: 60px;
          font-weight: bold;
        }

        .total-row {
          display: flex;
          justify-content: space-between;
          margin-top: 10px;
          padding-top: 12px;
          border-top: 2px solid var(--primary);
          font-weight: bold;
          font-size: 16px;
        }

        /* Pull-to-Refresh */
        #pull-spinner {
          position: fixed; top: -50px; left: 50%; transform: translateX(-50%);
          width: 40px; height: 40px; background: var(--primary); border-radius: 50%;
          display: flex; align-items: center; justify-content: center; z-index: 9999; transition: top 0.15s;
        }
        .spinner-icon { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="pull-spinner"><div class="spinner-icon"></div></div>
    <div class="subtitle" id="sub-title">Lade Daten...</div>
    <div id="overview"></div>

<script>
    const WORKER_URL = "https://gruppe.dan-hunziker73.workers.dev";
    const urlParams = new URLSearchParams(window.location.search);
    const selectedYear = urlParams.get('jahr') || 'aktuell';
    let raw = []; let teams = [];

    async function loadData() {
        try {
            const response = await fetch(`${WORKER_URL}?type=mannschaft&jahr=${selectedYear}`);
            const json = await response.json();
            const rows = json.table?.rows || [];
            raw = rows.map(r => {
                let o = { name: r.c[0]?.v || "" };
                for (let i = 1; i <= 7; i++) {
                    o[`r${i}Team`] = r.c[(i - 1) * 2 + 1]?.v || "";
                    o[`r${i}Pkt`]  = Number(r.c[(i - 1) * 2 + 2]?.v) || 0;
                }
                return o;
            });
            teams = [...new Set(raw.flatMap(r => Object.keys(r).filter(k => k.includes("Team")).map(k => r[k]).filter(Boolean)))].sort();
            document.getElementById('sub-title').textContent = 'Übersicht – auf Punkte klicken für Details';
            buildTable();
        } catch {
            document.getElementById("overview").innerHTML = "Fehler beim Laden";
        }
    }

    function buildTable() {
        let html = `<div class="table-wrapper"><table><thead><tr><th class="team-header"></th>`;
        for (let r = 1; r <= 7; r++) html += `<th class="round">R${r}</th>`;
        html += `</tr></thead><tbody>`;
        teams.forEach((team, index) => {
            html += `<tr><td class="team">${team}</td>`;
            for (let r = 1; r <= 7; r++) {
                const sum = raw.filter(p => p[`r${r}Team`] === team).reduce((a, b) => a + b[`r${r}Pkt`], 0);
                html += `<td class="cell" onclick="toggleDetail('${team.replace(/'/g,"\\'")}',${r},${index})">${sum || "–"}</td>`;
            }
            html += `</tr><tr><td colspan="8" style="padding:0; border:0;"><div id="detail-div-${index}" class="detail"></div></td></tr>`;
        });
        document.getElementById("overview").innerHTML = html + `</tbody></table></div>`;
    }

    function toggleDetail(team, round, index) {
        const div = document.getElementById(`detail-div-${index}`);
        if(div.style.display === "block"){ div.style.display = "none"; return; }
        document.querySelectorAll('.detail').forEach(d => d.style.display = 'none');
        
        const list = raw.filter(p => p[`r${round}Team`] === team);
        let total = 0;
        let html = `<h3>${team} – Runde ${round}</h3>`;
        
        list.forEach(p => {
            const val = p[`r${round}Pkt`];
            total += val;
            html += `
                <div class="player-row">
                    <div class="name-label">${p.name}</div>
                    <div class="score-val">${val}</div>
                </div>`;
        });
        
        html += `
            <div class="total-row">
                <div class="name-label">Gesamt:</div>
                <div class="score-val">${total}</div>
            </div>`;
            
        div.innerHTML = html;
        div.style.display = 'block';
    }

    window.onload = loadData;
</script>
</body>
</html>
