<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Sportschützen Muhen App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f3a5d">

    <link rel="manifest" href="/sportschuetzen/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/sportschuetzen/icons/apple-touch-icon.png">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Sportschützen Muhen">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="icon" type="image/png" sizes="192x192" href="/sportschuetzen/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/sportschuetzen/icons/icon-512.png">

    <!-- OneSignal SDK (NUR EINMAL!) -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

    <script>
    /************************************************
     * OneSignal + PID Handling (STABILE VERSION)
     ************************************************/
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function (OneSignal) {

        const log = (...args) => console.log("[OneSignal]", ...args);

        try {
            await OneSignal.init({
                appId: "975091f5-948b-48d4-9e61-b7f4d43a1021",
                serviceWorkerPath: "OneSignalSDKWorker.js",
                serviceWorkerParam: { scope: "/sportschuetzen/" },
                autoRegister: false,
                notifyButton: { enable: false }
            });

            log("Init fertig");

            // --- PID Handling ---
            const urlParams = new URLSearchParams(window.location.search);
            let pid = urlParams.get("pid");

            if (!pid) {
                pid = localStorage.getItem("sportschuetzen_pid");
                if (!pid) {
                    log("Keine PID vorhanden");
                    return;
                }
                log("PID aus localStorage:", pid);
            } else {
                localStorage.setItem("sportschuetzen_pid", pid);
                log("PID aus URL gespeichert:", pid);
            }

            const targetPid = String(pid);

            if (OneSignal.User.externalId !== targetPid) {
                await OneSignal.login(targetPid);
                log("Login mit External ID:", targetPid);
            }

            const permission = OneSignal.Notifications.permission;
            log("Permission:", permission);

            if (permission === "default") {
                const granted = await OneSignal.Notifications.requestPermission();
                log("Permission Ergebnis:", granted);
            }

        } catch (err) {
            console.error("OneSignal Fehler:", err);
        }
    });

    /************************************************
     * ZENTRALE APP RESUME LOGIK
     ************************************************/
    (function () {

        let lastResume = 0;
        const MIN_INTERVAL = 1500;

        function fireResume(source) {
            const now = Date.now();
            if (now - lastResume < MIN_INTERVAL) return;
            lastResume = now;

            console.log("App Resume:", source);

            document.querySelectorAll("iframe").forEach(iframe => {
                iframe.contentWindow?.postMessage(
                    { type: "app:resume", source, ts: now },
                    "*"
                );
            });
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                fireResume("visibility");
            }
        });

        window.addEventListener("pageshow", e => {
            if (e.persisted) fireResume("pageshow");
        });

        window.addEventListener("focus", () => {
            fireResume("focus");
        });

    })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
