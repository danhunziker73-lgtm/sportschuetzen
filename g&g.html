<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --primary: #0f3c5c; --bg: #f4f6f8; --text: #333; --line: #e0e0e0; }
        body { font-family: Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--text); }
        .subtitle { color: #666; margin-bottom: 10px; font-size: 14px; font-weight: bold; }
        .table-wrapper { overflow-x: auto; margin-bottom: 30px; }
        table { width: 100%; table-layout: fixed; border-collapse: collapse; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.08); border-radius: 6px; }
        th { background: var(--primary); color: #fff; font-size: 14px; height: 60px; padding: 0 10px; }
        .col-team { width: 40%; text-align: left; padding-left: 15px; }
        .col-round { width: 45px; text-align: center; font-size: 12px; }
        td { padding: 12px 10px; border-bottom: 1px solid var(--line); font-size: 14px; text-align: center; }
        td.team { font-weight: bold; text-align: left; color: var(--primary); padding-left: 15px; }
        .cell { cursor: pointer; font-weight: bold; }
        .cell:hover { background: #e6eef5; }
        .detail { display: none; background: #f9f9f9; padding: 15px; border-bottom: 2px solid var(--line); text-align: left; }
        h3 { font-size: 15px; margin: 5px 0; color: var(--primary); text-align: center; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .player-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 13px; }
        .total-row { display: flex; justify-content: space-between; margin-top: 8px; font-weight: bold; color: var(--primary); border-top: 2px solid var(--primary); padding-top: 5px; }
        .stellung { font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 8px; text-transform: uppercase; margin-left: 5px; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <div class="subtitle">Gruppenmeisterschaft</div>
    <div id="overview-gm"></div>

    <div style="margin: 30px 0; border-top: 2px solid #ccc;"></div>
    <div class="subtitle">Mannschaft (7 Runden)</div>
    <div id="overview-ms"></div>

    <div style="margin: 30px 0; border-top: 2px solid #ccc;"></div>
    <div class="subtitle">Grenzlandcup</div>
    <div id="overview-gc"></div>

<script>
    const WORKER_URL = "https://gruppe.dan-hunziker73.workers.dev";
    const urlParams = new URLSearchParams(window.location.search);
    const selectedYear = urlParams.get('jahr') || 'aktuell'; 
    
    // Globale Speicher für die vom Worker gelieferten flachen Daten
    let dataGM = [], dataMS = [], dataGC = [];

    async function loadAll() {
        try {
            const [resGM, resMS, resGC] = await Promise.all([
                fetch(`${WORKER_URL}?type=gruppe&jahr=${selectedYear}`).then(r => r.json()),
                fetch(`${WORKER_URL}?type=mannschaft&jahr=${selectedYear}`).then(r => r.json()),
                fetch(`${WORKER_URL}?type=grenzland&jahr=${selectedYear}`).then(r => r.json())
            ]);
            dataGM = resGM; dataMS = resMS; dataGC = resGC;

            render("gm", dataGM, "overview-gm", 3);
            render("ms", dataMS, "overview-ms", 7);
            render("gc", dataGC, "overview-gc", 3);
        } catch (e) { console.error("Fehler beim Laden:", e); }
    }

    function render(typeKey, data, targetId, runden) {
        // Teams extrahieren
        const teams = [...new Set(data.flatMap(d => {
            let t = [];
            for(let i=1; i<=runden; i++) if(d[`r${i}Team`]) t.push(d[`r${i}Team`]);
            return t;
        }))].sort();

        let html = `<div class="table-wrapper"><table><tr><th class="col-team">Team</th>`;
        for(let r=1; r<=runden; r++) html += `<th class="col-round">R${r}</th>`;
        html += `</tr>`;

        teams.forEach((team, tIdx) => {
            html += `<tr><td class="team">${team}</td>`;
            for(let r=1; r<=runden; r++) {
                const sum = data.filter(p => p[`r${r}Team`] === team)
                                .reduce((a, b) => a + (typeKey === "gm" ? (b[`r${r}P1`] + b[`r${r}P2`]) : b[`r${r}Pkt`]), 0);
                html += `<td class="cell" onclick="toggle('${typeKey}', '${team.replace(/'/g,"\\'")}', ${r}, ${tIdx})">${sum || "–"}</td>`;
            }
            html += `</tr><tr><td colspan="${runden+1}" style="padding:0;border:0;">`;
            for(let r=1; r<=runden; r++) html += `<div id="det-${typeKey}-${tIdx}-${r}" class="detail"></div>`;
            html += `</td></tr>`;
        });
        document.getElementById(targetId).innerHTML = html + `</table></div>`;
    }

    function toggle(type, team, round, tIdx) {
        const el = document.getElementById(`det-${type}-${tIdx}-${round}`);
        if(el.style.display === "block") { el.style.display = "none"; return; }
        
        const source = (type === "gm" ? dataGM : (type === "ms" ? dataMS : dataGC));
        const list = source.filter(p => p[`r${round}Team`] === team && (type === "gm" ? (p[`r${round}P1`]+p[`r${round}P2`]>0) : p[`r${round}Pkt`]>0));

        let total = 0;
        let html = `<h3>${team} - Runde ${round}</h3>`;
        list.forEach(p => {
            if(type === "gm") {
                const s = p[`r${round}P1`] + p[`r${round}P2`]; total += s;
                html += `<div class="player-row"><span>${p.name}<span class="stellung">${p.stellung}</span></span><span>${p[`r${round}P1`]} / ${p[`r${round}P2`]} = <strong>${s}</strong></span></div>`;
            } else {
                total += p[`r${round}Pkt`];
                html += `<div class="player-row"><span>${p.name}</span><strong>${p[`r${round}Pkt`]}</strong></div>`;
            }
        });
        html += `<div class="total-row"><span>Gesamt</span><span>${total}</span></div>`;
        el.innerHTML = html; el.style.display = "block";
    }

    window.onload = loadAll;
</script>
</body>
</html>
