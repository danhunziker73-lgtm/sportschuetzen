<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Sportschützen Muhen App</title>

<!-- Icons + Manifest -->
<link rel="apple-touch-icon" href="icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0f3a5d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- OneSignal SDK -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
  OneSignal.setLogLevel('debug');
  await OneSignal.init({
    appId: "d255c422-92e1-422e-b62b-6cead884627a",
    serviceWorkerPath: "/sportschuetzen/OneSignalSDKWorker.js",
    serviceWorkerParam: { scope: "/sportschuetzen/" }
  });
});
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#0f3a5d;
  --bg:#f3f4f6;
  --card:#ffffff;
  --text:#1f2937;
  --text-light:#6b7280;
  --border:#d1d5db;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  margin:0;
  padding-bottom:80px;
  color:var(--text);
  overflow-x:hidden;
}
header{
  background:var(--primary);
  color:#fff;
  padding:15px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:1000;
}

/* Navigation */
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  height:75px;
  background:#fff;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #e5e7eb;
  z-index:2000;
}
.nav-item{
  background:none;
  border:none;
  color:var(--text-light);
  font-size:.7rem;
  font-weight:600;
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
  flex:1;
}
.nav-item span{font-size:1.4rem}
.nav-item.active{color:var(--primary)}
.nav-home{
  position:relative;
  top:-18px;
  background:var(--primary)!important;
  color:white!important;
  width:65px;
  height:65px;
  border-radius:50%;
  box-shadow:0 4px 12px rgba(15,58,93,.4);
  border:4px solid var(--bg)!important;
}

/* Layout */
.page{display:none;padding:15px;max-width:600px;margin:0 auto}
.active-page{display:block}
.card{
  background:var(--card);
  padding:1.5rem;
  border-radius:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
  margin-bottom:15px;
}
iframe{
  width:100%;
  height:calc(100vh - 170px);
  border:none;
  border-radius:12px;
}

/* Buttons */
.btn-main{
  width:100%;
  padding:1.1rem;
  background:var(--primary);
  color:#fff;
  border:none;
  border-radius:14px;
  font-size:1.1rem;
  font-weight:700;
  cursor:pointer;
}

/* Push Button */
#enablePush{
  position:relative;
  z-index:3001;
}

/* Pull to refresh spinner */
#pull-spinner{
  position:fixed;
  top:-50px;
  left:50%;
  transform:translateX(-50%);
  width:40px;
  height:40px;
  background:var(--primary);
  border-radius:50%;
  z-index:3000;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="pull-spinner"></div>

<header>
  <h1 id="main-title">Vereins-App</h1>
</header>

<main>

<section id="page-home" class="page active-page">

  <div class="card" style="text-align:center">
    <img src="https://raw.githubusercontent.com/danhunziker73-lgtm/sportschuetzen/main/icons/Logo_MUHEN.png" style="height:100px">
    <h2>Sportschützen Muhen</h2>
    <p>Willkommen in deiner digitalen Vereins-App.</p>
  </div>

  <div class="card" style="text-align:center">
    <p>🔔 Möchtest du Benachrichtigungen zu Terminen erhalten?</p>
    <button id="enablePush" class="btn-main">Push aktivieren</button>
  </div>

  <div class="card">
    <h3>Termine</h3>
    <div id="termine">Lade Termine...</div>
  </div>

</section>

<section id="page-jm" class="page">
  <iframe src="app/app_jm.html"></iframe>
</section>

<section id="page-gruppe" class="page">
  <iframe src="app/app_gruppe.html"></iframe>
</section>

<section id="page-mannschaft" class="page">
  <iframe src="app/app_mannschaft.html"></iframe>
</section>

<section id="page-upload" class="page">
  <div class="card">
    <h2>Standblatt Upload</h2>
    <form id="uploadForm">
      <label>Schütze</label>
      <select id="name"></select>

      <label>Foto</label>
      <input type="file" id="foto" accept="image/*">

      <label>Erzielt</label>
      <input type="number" id="erzielt">

      <label>Maximum</label>
      <input type="number" id="maximal">

      <button id="submitBtn" class="btn-main">Jetzt senden</button>
    </form>
  </div>
</section>

</main>

<nav class="bottom-nav">
  <button class="nav-item" onclick="nav('page-jm','JM',this)"><span>🏆</span>JM</button>
  <button class="nav-item" onclick="nav('page-gruppe','Gruppe',this)"><span>👥</span>Gruppe</button>
  <button class="nav-item nav-home active" onclick="nav('page-home','Vereins-App',this)"><span>🏠</span></button>
  <button class="nav-item" onclick="nav('page-mannschaft','Mannschaft',this)"><span>🎯</span>Mannschaft</button>
  <button class="nav-item" onclick="nav('page-upload','Upload',this)"><span>📤</span>Upload</button>
</nav>

<script>
/* ---------- Pull to Refresh (Button-safe) ---------- */
let touchStart = 0;

document.addEventListener("touchstart", e => {
  if (e.target.closest("button")) return;
  touchStart = e.touches[0].pageY;
}, {passive:true});

document.addEventListener("touchend", e => {
  if (e.target.closest("button")) return;
  if (window.scrollY === 0 && e.changedTouches[0].pageY - touchStart > 90) {
    location.reload();
  }
}, {passive:true});

/* ---------- Navigation ---------- */
function nav(id,title,btn){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active-page"));
  document.getElementById(id).classList.add("active-page");
  document.getElementById("main-title").textContent = title;
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  window.scrollTo(0,0);
}

/* ---------- OneSignal Push ---------- */
window.onload = () => {
  const pushBtn = document.getElementById("enablePush");

  // Touch nicht an Pull-to-Refresh weitergeben
  pushBtn.addEventListener("touchstart", e => e.stopPropagation(), {passive:true});
  pushBtn.addEventListener("touchend", e => e.stopPropagation());

  OneSignalDeferred.push(async function(OneSignal){
    const enabled = await OneSignal.isPushNotificationsEnabled();
    if (enabled) pushBtn.style.display = "none";

    pushBtn.addEventListener("click", async () => {
      await OneSignal.showNativePrompt();
    });
  });
};
</script>

</body>
</html>
