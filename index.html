<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="apple-touch-icon" href="icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-512.png">
<meta name="apple-mobile-web-app-title" content="Sportschützen Muhen">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Sportschützen Muhen App</title>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="/sportschuetzen/push-init.js" defer></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --primary:#0f3a5d;
    --bg:#f3f4f6;
    --card:#ffffff;
    --text:#1f2937;
    --text-light:#6b7280;
    --border:#d1d5db;
}

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
    font-family:'Inter',sans-serif;
    background:var(--bg);
    margin:0;
    padding-bottom:80px;
    color:var(--text);
    overflow-x:hidden;
}
header {
    background:var(--primary);
    color:#fff;
    padding:15px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

/* NAV */
.bottom-nav {
    position:fixed;
    bottom:0;
    width:100%;
    height:75px;
    background:#fff;
    display:flex;
    justify-content:space-around;
    align-items:center;
    border-top:1px solid #e5e7eb;
    z-index:2000;
}
.nav-item {
    background:none;
    border:none;
    color:var(--text-light);
    font-size:.7rem;
    font-weight:600;
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:1;
}
.nav-item span { font-size:1.4rem; }
.nav-item.active { color:var(--primary); }
.nav-home {
    position:relative;
    top:-18px;
    background:var(--primary);
    color:#fff;
    width:65px;
    height:65px;
    border-radius:50%;
    border:4px solid var(--bg);
}

/* LAYOUT */
.page { display:none; padding:15px; max-width:600px; margin:0 auto; }
.active-page { display:block; }
.card {
    background:var(--card);
    padding:1.5rem;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.05);
    margin-bottom:15px;
}

/* ✅ FIX: 100vh → 100dvh */
iframe {
    width:100%;
    height:calc(100dvh - 170px);
    border:none;
    border-radius:12px;
    background:#fff;
}

/* Pull-to-refresh Spinner */
#pull-spinner {
    position:fixed;
    top:-50px;
    left:50%;
    transform:translateX(-50%);
    width:40px;
    height:40px;
    background:var(--primary);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:3000;
}
.spinner-icon {
    width:20px;
    height:20px;
    border:3px solid rgba(255,255,255,.3);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>

<body>

<div id="pull-spinner"><div class="spinner-icon"></div></div>

<header><h1 id="main-title">Termine</h1></header>

<main>
<section id="page-home" class="page active-page">
<div class="card" style="text-align:center;">
<img src="https://raw.githubusercontent.com/danhunziker73-lgtm/sportschuetzen/main/icons/Logo_MUHEN.png" style="height:100px">
<h2>Sportschützen Muhen</h2>
<p>Willkommen</p>
</div>
</section>

<section id="page-jm" class="page"><iframe src="app/app_jm.html"></iframe></section>
<section id="page-gruppe" class="page"><iframe src="app/app_gruppe.html"></iframe></section>
<section id="page-mannschaft" class="page"><iframe src="app/app_mannschaft.html"></iframe></section>
</main>

<nav class="bottom-nav">
<button class="nav-item" onclick="nav('page-jm','JM',this)">🏆 JM</button>
<button class="nav-item" onclick="nav('page-gruppe','Gruppe',this)">👥 Gruppe</button>
<button class="nav-item nav-home active" onclick="nav('page-home','Vereins-App',this)">🏠</button>
<button class="nav-item" onclick="nav('page-mannschaft','Mannschaft',this)">🎯 Mannschaft</button>
</nav>

<script>
const spinner = document.getElementById('pull-spinner');
let touchStart = 0;
let isNavigating = false; // ✅ FIX 3

document.addEventListener('touchstart', e => {
    touchStart = e.touches[0].pageY;
},{passive:true});

document.addEventListener('touchmove', e => {
    if (isNavigating) return; // ✅ FIX 4

    const distance = e.touches[0].pageY - touchStart;
    if (window.scrollY <= 0 && distance > 0) {
        spinner.style.top = Math.min(distance/2,100)-40+'px';
    }
},{passive:true});

document.addEventListener('touchend', e => {
    if (isNavigating) return;
    spinner.style.top='-50px';
},{passive:true});

/* ✅ FIX 3 */
function nav(id,title,btn){
    isNavigating = true;

    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active-page'));
    document.getElementById(id).classList.add('active-page');

    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');

    spinner.style.top='-50px';

    document.body.scrollTop=0;
    document.documentElement.scrollTop=0;

    setTimeout(()=>isNavigating=false,300);
}
</script>

</body>
</html>
