<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {

  console.log("[OS] init start");

  await OneSignal.init({
    appId: "4fd0fec9-a8dd-40d9-94e9-7ba330c07176",
    serviceWorkerPath: "/sportschuetzen/OneSignalSDKWorker.js",
    serviceWorkerUpdaterPath: "/sportschuetzen/OneSignalSDKUpdaterWorker.js",

  const perm = await OneSignal.Notifications.permission;
  console.log("[OS] permission:", perm);

  console.log("[OS] subscription id:", id);
});
