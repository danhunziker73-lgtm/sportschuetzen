<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="apple-touch-icon" href="icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-512.png">
<meta name="apple-mobile-web-app-title" content="Sportschützen Muhen">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Sportschützen Muhen App</title>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="/sportschuetzen/push-init.js" defer></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
--primary:#0f3a5d;
--bg:#f3f4f6;
--card:#ffffff;
--text:#1f2937;
--text-light:#6b7280;
--border:#d1d5db;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Inter',sans-serif;background:var(--bg);margin:0;padding-bottom:80px;color:var(--text);overflow-x:hidden;}
header{background:var(--primary);color:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:1000;}

.bottom-nav{
position:fixed;bottom:0;width:100%;height:75px;
background:#fff;display:flex;justify-content:space-around;align-items:center;
border-top:1px solid #e5e7eb;z-index:2000;
}
.nav-item{
background:none;border:none;color:var(--text-light);
font-size:.7rem;font-weight:600;display:flex;flex-direction:column;
align-items:center;cursor:pointer;flex:1;
}
.nav-item span{font-size:1.4rem;}
.nav-item.active{color:var(--primary);}
.nav-home{
position:relative;top:-18px;background:var(--primary)!important;
color:#fff!important;width:65px;height:65px;border-radius:50%;
flex:none!important;border:4px solid var(--bg)!important;
}

.page{display:none;padding:15px;max-width:600px;margin:0 auto;}
.active-page{display:block;}
.card{background:var(--card);padding:1.5rem;border-radius:20px;margin-bottom:15px;}
iframe{width:100%;height:calc(100vh - 170px);border:none;border-radius:12px;}

.termine-list{display:flex;flex-direction:column;gap:14px;}
.termin-row{display:grid;grid-template-columns:85px 1fr;gap:15px;padding:12px 0;}
.termin-date{
border:1.5px solid #e2e8f0;border-radius:12px;
display:flex;flex-direction:column;align-items:center;justify-content:center;
height:72px;
}
.date-main{font-weight:800;color:var(--primary);}
.date-sub{font-size:.65rem;color:#718096;}

.form-group{margin-bottom:1.2rem;}
.upload-area{border:2px dashed var(--border);padding:2rem;text-align:center;cursor:pointer;}
#preview{width:100%;max-height:200px;display:none;}
.btn-main{width:100%;padding:1.1rem;background:var(--primary);color:#fff;border:none;border-radius:14px;}

#pull-spinner{
position:fixed;top:-50px;left:50%;transform:translateX(-50%);
width:40px;height:40px;background:var(--primary);
border-radius:50%;display:flex;align-items:center;justify-content:center;
z-index:3000;
}
.spinner-icon{
width:20px;height:20px;border:3px solid rgba(255,255,255,.3);
border-top-color:#fff;border-radius:50%;
animation:spin .8s infinite linear;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>

<div id="pull-spinner"><div class="spinner-icon"></div></div>

<header><h1 id="main-title">Termine</h1></header>

<main>

<section id="page-home" class="page active-page">
<div class="card" style="text-align:center;">
<img src="https://raw.githubusercontent.com/danhunziker73-lgtm/sportschuetzen/main/icons/Logo_MUHEN.png" style="height:100px;">
<h2>Sportschützen Muhen</h2>
</div>

<div class="card">
<h3>Termine</h3>
<div id="termine" class="termine-list">Lade Termine...</div>
</div>
</section>

<section id="page-jm" class="page"><iframe src="app/app_jm.html"></iframe></section>
<section id="page-gruppe" class="page"><iframe src="app/app_gruppe.html"></iframe></section>
<section id="page-mannschaft" class="page"><iframe src="app/app_mannschaft.html"></iframe></section>

<!-- UPLOAD – KOMPLETT -->
<section id="page-upload" class="page">
<div class="card">
<h2>Standblatt Upload</h2>

<form id="uploadForm">

<div class="form-group">
<select id="name" required>
<option value="" disabled selected>Namen wählen...</option>
</select>
</div>

<div class="form-group">
<div class="upload-area" onclick="document.getElementById('foto').click()">
<span id="upload-hint">📸 Foto aufnehmen</span>
<input type="file" id="foto" accept="image/*" required style="display:none">
<img id="preview">
</div>
</div>

<div style="display:flex;gap:10px;">
<input type="number" id="erzielt" placeholder="Erzielt" required>
<input type="number" id="maximal" placeholder="Maximum" required>
</div>

<button type="submit" id="submitBtn" class="btn-main">Jetzt senden</button>

</form>
</div>
</section>

</main>

<nav class="bottom-nav">
<button class="nav-item" onclick="nav('page-jm','JM',this)">🏆</button>
<button class="nav-item" onclick="nav('page-gruppe','Gruppe',this)">👥</button>
<button class="nav-item nav-home active" onclick="nav('page-home','Home',this)">🏠</button>
<button class="nav-item" onclick="nav('page-mannschaft','Mannschaft',this)">🎯</button>
<button class="nav-item" onclick="nav('page-upload','Upload',this)">📤</button>
</nav>

<script>
const WORKER_TERMINE_URL="https://termine.dan-hunziker73.workers.dev";
const WORKER_UPLOAD_URL="https://github-dropdown-refresh.dan-hunziker73.workers.dev/";
let teilnehmer=[];

/* PULL TO REFRESH */
let touchStart=0;
const spinner=document.getElementById('pull-spinner');
const refreshThreshold=90;

document.addEventListener('touchstart',e=>{
touchStart=e.touches[0].pageY;
},{passive:true});

document.addEventListener('touchmove',e=>{
const distance=e.touches[0].pageY-touchStart;
if(window.scrollY<=0 && distance>0){
const moveY=Math.min(distance/2,100);
spinner.style.top=`${moveY-40}px`;   /* FIX 1 */
}
},{passive:true});

document.addEventListener('touchend',e=>{
const distance=e.changedTouches[0].pageY-touchStart;
if(window.scrollY<=0 && distance>refreshThreshold) location.reload();
else spinner.style.top='-50px';
},{passive:true});

/* NAV */
function nav(id,title,btn){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active-page'));
document.getElementById(id).classList.add('active-page');
document.getElementById('main-title').textContent=title;
document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
window.scrollTo(0,0);
}

/* TERMINE */
async function loadTermine(){
const wrap=document.getElementById("termine");
const res=await fetch(WORKER_TERMINE_URL);
const data=await res.json();
const currentYear=new Date().getFullYear();
wrap.innerHTML="";

data.forEach(t=>{
const parts=t.datum.split(", ");
const weekday=parts[0].substring(0,2);
const dateFull=parts[1];
const yearInString=(dateFull.match(/\d{4}/)||[currentYear])[0];
const dateDisplay=dateFull.replace(` ${yearInString}`,"");   /* FIX 2 */
const subLine=(yearInString!==currentYear.toString())
?`${weekday} '${yearInString.substring(2)}`                /* FIX 3 */
:weekday;

wrap.innerHTML+=`
<div class="termin-row">
<div class="termin-date">
<span class="date-main">${dateDisplay}</span>
<span class="date-sub">${subLine}</span>
</div>
<div>${t.titel}</div>
</div>`;                                                     /* FIX 4 */
});
}

window.onload=loadTermine;
</script>

</body>
</html>
