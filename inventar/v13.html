<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventar-Verwaltung Sportschützen Muhen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; border:none; }
        .sig-container { border: 1px solid #ccc; background: white; height: 160px; border-radius: 8px; }
        canvas { width: 100% !important; height: 100% !important; touch-action: none; }
        .spinner-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        .nav-btn { font-weight: bold; border-radius: 10px; padding: 10px 20px; }
        .table-sm { font-size: 0.85rem; }
    </style>
</head>
<body>

<div id="loading-overlay" class="spinner-overlay">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
    <div class="mt-2 fw-bold">Daten werden synchronisiert...</div>
</div>

<div class="container py-4">
    <div class="text-center mb-4">
        <h2>🎯 Materialverwaltung</h2>
        <p class="text-muted">Sportschützen Muhen</p>
    </div>

    <div class="d-flex justify-content-center flex-wrap gap-2 mb-4">
        <button class="btn btn-primary nav-btn" id="btn-ausgabe" onclick="showSection('ausgabe')">📤 Buchung</button>
        <button class="btn btn-outline-secondary nav-btn" id="btn-liste" onclick="showSection('liste')">📋 Bestand</button>
        <button class="btn btn-outline-secondary nav-btn" id="btn-journal" onclick="showSection('journal')">📖 Journal</button>
        <button class="btn btn-outline-dark nav-btn" id="btn-admin" onclick="showSection('admin')">⚙️ Admin</button>
    </div>

    <div id="section-ausgabe" class="section-content">
        <div class="card p-4">
            <form id="form-ausgabe" onsubmit="handleFormSubmit(event)">
                <div class="row">
                    <div class="col-md-6 border-end">
                        <label class="form-label fw-bold">Aktion</label>
                        <select id="select-action" class="form-select mb-3" onchange="toggleBookingFields()">
                            <option value="checkout">📤 Ausgabe</option>
                            <option value="checkin">📥 Rückgabe</option>
                        </select>
                        <label class="form-label fw-bold">Mitglied</label>
                        <select id="select-mitglied" class="form-select mb-3" required></select>
                        <label class="form-label fw-bold">Kategorie</label>
                        <select id="select-kategorie" class="form-select mb-3" onchange="updateSubOptions()">
                            <option value="gewehr">Gewehr</option>
                            <option value="schluessel">Schlüssel</option>
                            <option value="kleidung">Kleidung</option>
                            <option value="schiessbekleidung">Schiessbekleidung</option>
                        </select>
                        <label class="form-label fw-bold">Gegenstand</label>
                        <select id="select-gegenstand" class="form-select mb-3" required></select>
                        <div id="container-zustand-abgabe"><label class="form-label fw-bold text-primary">Zustand bei Abgabe</label><select id="select-zustand-abgabe" class="form-select mb-3"></select></div>
                        <div id="container-zustand-rueckgabe" class="d-none"><label class="form-label fw-bold text-danger">Zustand bei Rückgabe</label><select id="select-zustand-rueckgabe" class="form-select mb-3"></select></div>
                        <label class="form-label fw-bold">Bemerkungen</label>
                        <textarea id="trans-bemerkungen" class="form-control mb-3" rows="2"></textarea>
                        <div class="row g-2">
                            <div class="col-4"><label class="form-label fw-bold small">Pfandbetrag</label><input type="number" id="pfand-betrag" class="form-control" placeholder="0.00"></div>
                            <div class="col-4" id="container-pfand-einnahme"><label class="form-label fw-bold small">Einnahme</label><select id="pfand-einnahme" class="form-select"><option value="Nein">Nein</option><option value="Ja">Ja</option></select></div>
                            <div class="col-4 d-none" id="container-pfand-retour"><label class="form-label fw-bold small">Retour bezahlt</label><select id="pfand-retour" class="form-select"><option value="Nein">Nein</option><option value="Ja">Ja</option></select></div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Unterschrift Mitglied</label>
                        <div class="sig-container mb-2"><canvas id="sig-mitglied"></canvas></div>
                        <button type="button" class="btn btn-sm btn-link text-danger p-0 mb-3" onclick="sigPadMitglied.clear()">Löschen</button>
                        <label class="form-label fw-bold">Verantwortlicher Vorstand</label>
                        <select id="select-verantwortlicher" class="form-select mb-2" required></select>
                        <div class="sig-container mb-2"><canvas id="sig-vorstand"></canvas></div>
                        <button type="button" class="btn btn-sm btn-link text-danger p-0" onclick="sigPadVorstand.clear()">Löschen</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 mt-4 py-3 fw-bold main-submit">Transaktion speichern</button>
            </form>
        </div>
    </div>

    <div id="section-liste" class="section-content d-none">
        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4>Bestandsliste</h4>
                <select id="filter-liste" class="form-select w-auto" onchange="renderInventoryTable()">
                    <option value="Inventar_Gewehre">Gewehre</option>
                    <option value="Inventar_Schluessel">Schlüssel</option>
                    <option value="Inventar_Kleidung">Kleidung</option>
                    <option value="Inventar_Schiessbekleidung">Schiessbekleidung</option>
                    <option value="Personendaten">Mitglieder</option>
                </select>
            </div>
            <div class="table-responsive"><table class="table table-hover table-sm align-middle" id="inventory-table"></table></div>
        </div>
    </div>

    <div id="section-journal" class="section-content d-none">
        <div class="card p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4>Material-Bewegungen</h4>
                <button class="btn btn-sm btn-outline-primary" onclick="loadData()">Aktualisieren</button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover table-sm" id="table-transaktionen"></table>
            </div>
        </div>
        <div class="card p-4">
            <h4>Admin-Protokoll</h4>
            <div class="table-responsive">
                <table class="table table-hover table-sm text-muted" id="table-protokoll"></table>
            </div>
        </div>
    </div>

    <div id="section-admin" class="section-content d-none">
        <div class="card p-4">
            <h4>Neuen Eintrag erfassen</h4>
            <select id="admin-target" class="form-select mb-4" onchange="renderAdminFields(this.value)">
                <option value="">-- Typ wählen --</option>
                <option value="Personendaten">👤 Mitglied</option>
                <option value="Inventar_Gewehre">🔫 Gewehr</option>
                <option value="Inventar_Schluessel">🔑 Schlüssel</option>
                <option value="Inventar_Kleidung">👕 Kleidung</option>
                <option value="Inventar_Schiessbekleidung">🎯 Schiessbekleidung</option>
            </select>
            <form id="adminForm" onsubmit="saveNewItem(event)">
                <div id="dynamic-fields" class="row"></div>
                <button type="submit" class="btn btn-success mt-4 d-none main-submit" id="btn-admin-save">Speichern</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
<script>
    const WORKER_URL = 'DEINE_WEB_APP_URL'; 
    let inventarData = null;
    let sigPadMitglied, sigPadVorstand;

    window.onload = async () => {
        sigPadMitglied = new SignaturePad(document.getElementById('sig-mitglied'));
        sigPadVorstand = new SignaturePad(document.getElementById('sig-vorstand'));
        await loadData();
        showSection(localStorage.getItem('activeTab') || 'ausgabe');
    };

    // ... (Andere Hilfsfunktionen wie setBusy, getNameFromId etc. bleiben gleich)

    async function loadData() {
        setBusy(true);
        try {
            const res = await fetch(`${WORKER_URL}?action=getInventarData`);
            inventarData = await res.json();
            fillDropdowns();
            renderInventoryTable();
            renderJournalTables(); // NEU
        } catch (e) { console.error("Fehler beim Laden:", e); }
        setBusy(false);
    }

    // NEU: Journal-Tabellen rendern
    function renderJournalTables() {
        if(!inventarData) return;
        
        // Material Transaktionen
        const transTable = document.getElementById('table-transaktionen');
        if(inventarData.transaktionen && inventarData.transaktionen.length > 0) {
            let html = `<thead class="table-light"><tr><th>Zeit</th><th>Mitglied</th><th>Aktion</th><th>Gegenstand</th><th>Bemerkung</th></tr></thead><tbody>`;
            // Zeige die letzten 20 Transaktionen
            inventarData.transaktionen.slice(-20).reverse().map(t => {
                html += `<tr>
                    <td>${new Date(t.Zeitstempel).toLocaleDateString()}</td>
                    <td>${getNameFromId(t.Aktueller_Besitzer_ID)}</td>
                    <td>${t.Aktion === 'checkout' ? '📤' : '📥'}</td>
                    <td>${t.Inventar_ID}</td>
                    <td><small>${t.Bemerkungen || '-'}</small></td>
                </tr>`;
            });
            transTable.innerHTML = html + "</tbody>";
        } else { transTable.innerHTML = "Keine Daten vorhanden."; }

        // Admin Protokoll
        const logTable = document.getElementById('table-protokoll');
        if(inventarData.protokoll && inventarData.protokoll.length > 0) {
            let html = `<thead class="table-light"><tr><th>Zeit</th><th>Aktion</th><th>Tabelle</th><th>Details</th></tr></thead><tbody>`;
            inventarData.protokoll.slice(-15).reverse().map(p => {
                html += `<tr>
                    <td>${new Date(p.Zeitstempel).toLocaleString([], {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}</td>
                    <td>${p.Aktion}</td>
                    <td>${p.Tabelle}</td>
                    <td><small>${p.Details}</small></td>
                </tr>`;
            });
            logTable.innerHTML = html + "</tbody>";
        } else { logTable.innerHTML = "Keine Protokolleinträge."; }
    }

    // (Die restlichen Funktionen handleFormSubmit, deleteItem, showSection etc. bleiben wie zuvor)
</script>
</body>
</html>
