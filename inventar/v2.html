<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventar-Verwaltung Sportschützen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn-custom { border-radius: 10px; padding: 10px 20px; font-weight: bold; }
        #signature-pad { border: 1px solid #ccc; border-radius: 5px; width: 100%; height: 200px; background-color: white; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="text-center mb-4">
        <h2>🎯 Inventar & Materialausgabe</h2>
        <p class="text-muted">Sportschützen Muhen</p>
    </div>

    <div class="d-flex justify-content-center gap-2 mb-4">
        <button class="btn btn-outline-primary btn-custom" onclick="showSection('ausgabe')">📤 Ausgabe</button>
        <button class="btn btn-outline-secondary btn-custom" onclick="showSection('liste')">📋 Bestandsliste</button>
    </div>

    <div id="section-ausgabe" class="section-content">
        <div class="card p-4">
            <h4>Material ausgeben</h4>
            <hr>
            <form id="ausgabeForm" onsubmit="save(event)">
                <div class="mb-3">
                    <label class="form-label">Mitglied wählen</label>
                    <select id="select-mitglied" class="form-select" required>
                        <option value="">Laden...</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Kategorie</label>
                    <select id="select-kategorie" class="form-select" onchange="updateSubOptions()">
                        <option value="gewehr">Gewehr</option>
                        <option value="schluessel">Schlüssel</option>
                        <option value="kleidung">Kleidung</option>
                    </select>
                </div>

                <div class="mb-3" id="sub-options-container">
                    <label class="form-label">Gegenstand wählen</label>
                    <select id="select-gegenstand" class="form-select" required>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Unterschrift (Quittung)</label>
                    <canvas id="signature-pad"></canvas>
                    <button type="button" class="btn btn-sm btn-link" onclick="clearSignature()">Löschen</button>
                </div>

                <button type="submit" class="btn btn-success w-100 btn-custom">Ausgabe bestätigen & Quittung erstellen</button>
            </form>
        </div>
    </div>

    <div id="section-liste" class="section-content d-none">
        <div class="card p-4">
            <h4>Bestandsliste</h4>
            <p>Hier werden bald die aktuellen Bestände angezeigt...</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
<script>
let inventarData = null;
    let signaturePad;

    window.onload = async () => {
        const canvas = document.getElementById('signature-pad');
        signaturePad = new SignaturePad(canvas);
        await loadData();
        initScanner(); // QR Scanner starten
    };

    async function loadData() {
        try {
            // WICHTIG: Action Parameter für GAS
            const response = await fetch('https://inventar.dan-hunziker73.workers.dev/?action=getInventarData');
            inventarData = await response.json();
            fillDropdowns();
        } catch (e) {
            console.error(e);
            alert("Fehler beim Laden: " + e.message);
        }
    }

    function fillDropdowns() {
        const mSelect = document.getElementById('select-mitglied');
        mSelect.innerHTML = '<option value="">-- Mitglied wählen --</option>' + 
            inventarData.mitglieder.map(m => `<option value="${m.id}">${m.vorname} ${m.nachname}</option>`).join('');
        updateSubOptions();
    }

    function updateSubOptions() {
        const kat = document.getElementById('select-kategorie').value;
        const gSelect = document.getElementById('select-gegenstand');
        
        // KORREKTUR: Mapping auf die Sheet-Namen im inventarData Objekt
        // Wir nutzen die Namen, die wir im GAS definiert haben
        let key = kat;
        if (kat === 'gewehr') key = 'gewehre';
        if (kat === 'schluessel') key = 'schluessel';
        if (kat === 'kleidung') key = 'kleidung';

        let items = inventarData[key] || [];

        // Mehr Details anzeigen: Modell/Bezeichnung + ID + Status
        gSelect.innerHTML = items.map(i => {
            const detail = i.modell || i.bezeichnung || i.typ || "Unbekannt";
            const extra = i.hersteller ? ` | ${i.hersteller}` : "";
            const num = i.nummer || i.schlüsselnummer || "";
            return `<option value="${i.id}">${detail}${extra} ${num} (ID: ${i.id}) - [${i.status}]</option>`;
        }).join('');
    }

    // QR-CODE LOGIK
    function initScanner() {
        // Hier könnte man eine Library wie html5-qrcode einbinden
        // Einfache Demo: Wenn URL-Parameter "id" vorhanden ist
        const urlParams = new URLSearchParams(window.location.search);
        const scanId = urlParams.get('scan');
        if (scanId) {
            autoSelectByScan(scanId);
        }
    }

    function autoSelectByScan(id) {
        // Suche in allen Kategorien nach der ID
        const kategorien = ['gewehre', 'schluessel', 'kleidung'];
        for (let kat of kategorien) {
            const item = inventarData[kat].find(i => i.id.toString() === id.toString());
            if (item) {
                document.getElementById('select-kategorie').value = kat.replace('gewehre', 'gewehr');
                updateSubOptions();
                document.getElementById('select-gegenstand').value = id;
                return;
            }
        }
    }
</script>
</body>
</html>
