<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventar-Verwaltung Sportschützen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn-custom { border-radius: 10px; padding: 10px 20px; font-weight: bold; }
        #signature-pad { border: 1px solid #ccc; border-radius: 5px; width: 100%; height: 200px; background-color: white; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="text-center mb-4">
        <h2>🎯 Inventar & Materialausgabe</h2>
        <p class="text-muted">Sportschützen Muhen</p>
    </div>

    <div class="d-flex justify-content-center gap-2 mb-4">
        <button class="btn btn-outline-primary btn-custom" onclick="showSection('ausgabe')">📤 Ausgabe</button>
        <button class="btn btn-outline-secondary btn-custom" onclick="showSection('liste')">📋 Bestandsliste</button>
    </div>

    <div id="section-ausgabe" class="section-content">
        <div class="card p-4">
            <h4>Material ausgeben</h4>
            <hr>
            <form id="ausgabeForm" onsubmit="save(event)">
                <div class="mb-3">
                    <label class="form-label">Mitglied wählen</label>
                    <select id="select-mitglied" class="form-select" required>
                        <option value="">Laden...</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Kategorie</label>
                    <select id="select-kategorie" class="form-select" onchange="updateSubOptions()">
                        <option value="gewehr">Gewehr</option>
                        <option value="schluessel">Schlüssel</option>
                        <option value="kleidung">Kleidung</option>
                    </select>
                </div>

                <div class="mb-3" id="sub-options-container">
                    <label class="form-label">Gegenstand wählen</label>
                    <select id="select-gegenstand" class="form-select" required>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Unterschrift (Quittung)</label>
                    <canvas id="signature-pad"></canvas>
                    <button type="button" class="btn btn-sm btn-link" onclick="clearSignature()">Löschen</button>
                </div>

                <button type="submit" class="btn btn-success w-100 btn-custom">Ausgabe bestätigen & Quittung erstellen</button>
            </form>
        </div>
    </div>

    <div id="section-liste" class="section-content d-none">
        <div class="card p-4">
            <h4>Bestandsliste</h4>
            <p>Hier werden bald die aktuellen Bestände angezeigt...</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
<script>
    let inventarData = null;
    let signaturePad;

    window.onload = async () => {
        const canvas = document.getElementById('signature-pad');
        signaturePad = new SignaturePad(canvas);
        
        // Canvas Größe anpassen
        function resizeCanvas() {
            const ratio = Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext("2d").scale(ratio, ratio);
            signaturePad.clear();
        }
        window.onresize = resizeCanvas;
        resizeCanvas();

        await loadData();
    };

    async function loadData() {
        try {
            const response = await fetch('https://inventar.dan-hunziker73.workers.dev/?action=getInventarData');
            inventarData = await response.json();
            fillDropdowns();
        } catch (e) {
            alert("Fehler beim Laden der Daten. Prüfe den Worker!");
        }
    }

    function fillDropdowns() {
        const mSelect = document.getElementById('select-mitglied');
        mSelect.innerHTML = inventarData.mitglieder.map(m => 
            `<option value="${m.id}">${m.vorname} ${m.nachname}</option>`
        ).join('');
        updateSubOptions();
    }

    function updateSubOptions() {
        const kat = document.getElementById('select-kategorie').value;
        const gSelect = document.getElementById('select-gegenstand');
        let items = [];

        // Mapping der Kategorien auf die Datenstruktur
        if (kat === 'gewehr') items = inventarData.gewehre;
        else if (kat === 'schluessel') items = inventarData.schluessel;
        else if (kat === 'kleidung') items = inventarData.kleidung;

        gSelect.innerHTML = items.map(i => 
            `<option value="${i.id}">${i.modell || i.bezeichnung || i.typ} (ID: ${i.id})</option>`
        ).join('');
    }

    function clearSignature() { signaturePad.clear(); }

    function showSection(id) {
        document.querySelectorAll('.section-content').forEach(s => s.classList.add('d-none'));
        document.getElementById('section-' + id).classList.remove('d-none');
    }

    async function save(event) {
        event.preventDefault(); // Verhindert Neuladen der Seite

        if (signaturePad.isEmpty()) {
            return alert("Bitte unterschreiben!");
        }

        const signatureData = signaturePad.toDataURL("image/png");

        const payload = {
            action: "checkout",
            mitgliedId: document.getElementById('select-mitglied').value,
            kategorie: document.getElementById('select-kategorie').value, 
            itemId: document.getElementById('select-gegenstand').value,
            unterschrift: signatureData 
        };

        try {
            const response = await fetch("https://inventar.dan-hunziker73.workers.dev/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const result = await response.text();
            alert("Antwort: " + result);
            signaturePad.clear();
        } catch (error) {
            alert("Fehler beim Senden: " + error);
        }
    }
</script>
</body>
</html>
