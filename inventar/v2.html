<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventar-Verwaltung Sportschützen Muhen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; border: none; }
        .btn-custom { border-radius: 10px; padding: 10px 20px; font-weight: bold; transition: all 0.3s; }
        .btn-custom:hover { transform: translateY(-2px); }
        .sig-container { background-color: #fff; border: 1px solid #ccc; border-radius: 8px; width: 100%; height: 180px; }
        canvas { width: 100% !important; height: 100% !important; touch-action: none; }
        .section-content { transition: opacity 0.3s ease-in-out; }
        .badge-status { font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="text-center mb-4">
        <h2>🎯 Inventar & Materialverwaltung</h2>
        <p class="text-muted">Sportschützen Muhen - Digitales Logbuch</p>
    </div>

    <div class="d-flex justify-content-center gap-2 mb-4">
        <button class="btn btn-primary btn-custom" onclick="showSection('ausgabe')">📤 Ausgabe / Rückgabe</button>
        <button class="btn btn-secondary btn-custom" onclick="showSection('liste')">📋 Bestandsliste</button>
        <button class="btn btn-outline-dark btn-custom" onclick="showSection('admin')">⚙️ Verwaltung</button>
    </div>

    <hr>

    <div id="section-ausgabe" class="section-content">
        <div class="card p-4">
            <h4 id="form-title">Materialbewegung erfassen</h4>
            <hr>
            <form id="transactionForm" onsubmit="handleFormSubmit(event)">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Aktion</label>
                            <select id="select-action" class="form-select border-primary" required>
                                <option value="checkout">📤 Ausgabe (an Mitglied)</option>
                                <option value="checkin">📥 Rückgabe (an Verein)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mitglied wählen</label>
                            <select id="select-mitglied" class="form-select" required>
                                <option value="">Lade Mitglieder...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Kategorie</label>
                            <select id="select-kategorie" class="form-select" onchange="updateSubOptions()">
                                <option value="gewehr">Gewehr</option>
                                <option value="schluessel">Schlüssel</option>
                                <option value="kleidung">Kleidung</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Gegenstand wählen</label>
                            <select id="select-gegenstand" class="form-select" required>
                                <option value="">Zuerst Kategorie wählen...</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Unterschrift Mitglied</label>
                            <div class="sig-container">
                                <canvas id="sig-mitglied"></canvas>
                            </div>
                            <button type="button" class="btn btn-sm btn-link text-danger" onclick="sigPadMitglied.clear()">Löschen</button>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Visum Vorstand</label>
                            <div class="sig-container">
                                <canvas id="sig-vorstand"></canvas>
                            </div>
                            <button type="button" class="btn btn-sm btn-link text-danger" onclick="sigPadVorstand.clear()">Löschen</button>
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" id="btn-submit" class="btn btn-success w-100 btn-custom py-3">
                        Transaktion bestätigen & PDF-Quittung erstellen
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="section-liste" class="section-content d-none">
        <div class="card p-4">
            <h4>Aktueller Bestand</h4>
            <div class="table-responsive" id="inventory-table-container">
                <p class="text-muted">Daten werden geladen...</p>
            </div>
        </div>
    </div>

    <div id="section-admin" class="section-content d-none">
        <div class="card p-4 text-center">
            <h4>Verwaltungsmodus</h4>
            <p>Hier können bald Mitglieder und Inventar bearbeitet werden.</p>
            <button class="btn btn-warning" onclick="alert('In Arbeit...')">Daten editieren</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>

<script>
    // Konfiguration
    const WORKER_URL = 'https://inventar.dan-hunziker73.workers.dev/';
    
    let inventarData = null;
    let sigPadMitglied, sigPadVorstand;

    window.onload = async () => {
        // Unterschriften-Felder initialisieren
        sigPadMitglied = new SignaturePad(document.getElementById('sig-mitglied'));
        sigPadVorstand = new SignaturePad(document.getElementById('sig-vorstand'));
        
        await loadData();
        
        // Optionaler Scanner-Start (ausgelagert)
        // checkUrlForScan();
    };

    async function loadData() {
        try {
            const response = await fetch(`${WORKER_URL}?action=getInventarData`);
            inventarData = await response.json();
            fillDropdowns();
            renderInventoryTable();
        } catch (e) {
            console.error(e);
            alert("Fehler beim Laden der Daten. Bitte Seite neu laden.");
        }
    }

    function fillDropdowns() {
        const mSelect = document.getElementById('select-mitglied');
        if (inventarData && inventarData.mitglieder) {
            mSelect.innerHTML = '<option value="">-- Mitglied wählen --</option>' + 
                inventarData.mitglieder.map(m => `<option value="${m.id}">${m.vorname} ${m.nachname} (ID: ${m.id})</option>`).join('');
        }
        updateSubOptions();
    }

    function updateSubOptions() {
        const kat = document.getElementById('select-kategorie').value;
        const gSelect = document.getElementById('select-gegenstand');
        
        // Mapping auf Sheet-Namen im JSON
        let key = kat === 'gewehr' ? 'gewehre' : (kat === 'schluessel' ? 'schluessel' : 'kleidung');
        let items = inventarData[key] || [];

        gSelect.innerHTML = items.map(i => {
            let label = "";
            if (kat === 'gewehr') label = `${i.hersteller} ${i.modell} | SN: ${i.seriennummer}`;
            else if (kat === 'schluessel') label = `${i.bezeichnung} | Nr: ${i.nummer}`;
            else if (kat === 'kleidung') label = `${i.typ} | Größe: ${i.groesse} (${i.zustand})`;

            const status = i.aktueller_besitzer_id ? `🔴 Besetzt (ID: ${i.aktueller_besitzer_id})` : "🟢 Frei";
            return `<option value="${i.id}">${label} [${status}]</option>`;
        }).join('');
    }

    async function handleFormSubmit(event) {
        event.preventDefault();

        if (sigPadMitglied.isEmpty() || sigPadVorstand.isEmpty()) {
            alert("Bitte beide Unterschriften leisten!");
            return;
        }

        const btn = document.getElementById('btn-submit');
        btn.disabled = true;
        btn.innerText = "Verarbeite... Bitte warten...";

        const payload = {
            action: "checkout", // Bleibt "checkout" als Trigger für doPost in GAS
            subAction: document.getElementById('select-action').value,
            mitgliedId: document.getElementById('select-mitglied').value,
            kategorie: document.getElementById('select-kategorie').value,
            itemId: document.getElementById('select-gegenstand').value,
            sigMitglied: sigPadMitglied.toDataURL(),
            sigVorstand: sigPadVorstand.toDataURL()
        };

        try {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.text();
            alert(result);
            location.reload(); 
        } catch (e) {
            alert("Fehler beim Senden: " + e.message);
            btn.disabled = false;
            btn.innerText = "Erneut versuchen";
        }
    }

    function showSection(sectionId) {
        document.querySelectorAll('.section-content').forEach(s => s.classList.add('d-none'));
        document.getElementById('section-' + sectionId).classList.remove('d-none');
    }

    function renderInventoryTable() {
        // Platzhalter für die Bestandsliste (Wird in Schritt 3/4 verfeinert)
        const container = document.getElementById('inventory-table-container');
        container.innerHTML = "<p>Tipp: In der Sektion 'Verwaltung' können Sie Einträge bald bearbeiten.</p>";
    }

    /* SCANNER MODUL (Ausgelagert)
       Funktion kann bei Bedarf reaktiviert werden
    */
    function checkUrlForScan() {
        const urlParams = new URLSearchParams(window.location.search);
        const scanId = urlParams.get('scan');
        if (scanId && inventarData) {
            // Logik zum automatischen Auswählen hier...
        }
    }
</script>
</body>
</html>
