<script>
/************************************************
 * OneSignal Init & Automation
 ************************************************/
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function (OneSignal) {
    
    // Hilfsfunktion für Log-Ausgaben auf der Webseite (optional, aber hilfreich)
    const logToUI = (msg) => {
        console.log(msg);
        // Falls du ein Element mit id="status" hast, schreibt er es dort rein
        const statusEl = document.getElementById("status-box");
        if (statusEl) statusEl.innerHTML += `<div>${msg}</div>`;
    };

    try {
        // 1. Initialisierung
        await OneSignal.init({
            appId: "975091f5-948b-48d4-9e61-b7f4d43a1021",
            serviceWorkerParam: { scope: "/sportschuetzen/" },
            serviceWorkerPath: "OneSignalSDKWorker.js",
            autoRegister: false,
            notifyButton: { enable: true }
        });

        logToUI("🛠️ OneSignal initialisiert.");

        // 2. PID prüfen
        const urlParams = new URLSearchParams(window.location.search);
        const pid = urlParams.get("pid");
        if (!pid) return logToUI("ℹ️ Keine PID in URL.");

        // 3. Daten laden (Cloudflare)
        const response = await fetch("https://termine.dan-hunziker73.workers.dev/?action=loadAdminData");
        const data = await response.json();
        const member = data.push_onesignal.find(m => String(m.personnumber) === String(pid));
        if (!member) return logToUI("❌ Mitglied nicht gefunden.");

        // 4. Diagnose-Infos auslesen
        const onesignalId = OneSignal.User.onesignalId;
        const currentExternalId = OneSignal.User.externalId;
        logToUI(`🆔 OS-ID: ${onesignalId || 'wird erstellt...'}`);
        logToUI(`👤 Aktuelle Ext-ID: ${currentExternalId || 'keine'}`);

    // 5. & 6. & 7. Neue Logik: Trennung von Login und Tags
        const targetPid = String(pid);
        const currentExternalId = OneSignal.User.externalId;

        if (currentExternalId !== targetPid) {
            logToUI(`🔑 Login-Phase: Verknüpfe Gerät mit PID ${targetPid}...`);
            await OneSignal.login(targetPid);
            
            // NACH dem Login brechen wir hier ab und warten auf den automatischen Reload
            // oder geben dem System massiv Zeit, ohne sofort Tags zu senden.
            logToUI("⏳ Identität wird registriert. Bitte Seite 1x neu laden oder 10s warten.");
            
            // Wir versuchen die Tags erst nach einer sehr langen Verzögerung
            setTimeout(async () => {
                logToUI("📤 Verspäteter Tag-Versand...");
                await OneSignal.User.addTags(tags);
                logToUI("✅ Tags synchronisiert.");
            }, 10000); // 10 Sekunden!
            
        } else {
            // Wenn wir schon korrekt eingeloggt sind, ist der Kanal frei für Tags!
            logToUI(`✅ Identität bestätigt (${currentExternalId}). Sende Tags...`);
            await OneSignal.User.addTags(tags);
            logToUI("🏷️ Tags erfolgreich gesetzt.");
        }
    } catch (err) {
        logToUI(`❌ Fehler: ${err.message}`);
        console.error(err);
    }
});

/************************************************
 * iOS & Standalone Checks
 ************************************************/
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches;

if (isIOS && !isStandalone) {
    console.log("📢 OneSignal Hinweis: iOS Push erfordert 'Zum Home-Bildschirm hinzufügen'.");
}

/************************************************
 * ZENTRALE APP-RESUME LOGIK
 ************************************************/
(function () {

    let lastResume = 0;
    const MIN_INTERVAL = 1500;

    function fireResume(source) {
        const now = Date.now();
        if (now - lastResume < MIN_INTERVAL) return;
        lastResume = now;

        console.log("📲 App Resume:", source);

        // Resume an alle iFrames senden
        document.querySelectorAll("iframe").forEach(iframe => {
            iframe.contentWindow?.postMessage(
                { type: "app:resume", source, ts: now },
                "*"
            );
        });
    }

    // App kommt in den Vordergrund
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
            fireResume("visibility");
        }
    });

    // Safari Back/Forward Cache
    window.addEventListener("pageshow", e => {
        if (e.persisted) {
            fireResume("pageshow");
        }
    });

    // Fallback (App-Switch, Desktop)
    window.addEventListener("focus", () => {
        fireResume("focus");
    });

})();
</script>
