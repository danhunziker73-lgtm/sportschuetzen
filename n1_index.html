    <link rel="icon" type="image/png" sizes="192x192" href="/sportschuetzen/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/sportschuetzen/icons/icon-512.png">

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>

/************************************************
 * OneSignal V16 – STABILE PRODUKTIONSVERSION
 ************************************************/

window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {

    const log = (...args) => console.log("[OneSignal]", ...args);

    try {

        log("Init gestartet");

        await OneSignal.init({
            appId: "975091f5-948b-48d4-9e61-b7f4d43a1021",
            serviceWorkerPath: "OneSignalSDKWorker.js",
            serviceWorkerParam: { scope: "/sportschuetzen/" },
            autoRegister: false
        });

        log("Init fertig");

        const urlParams = new URLSearchParams(window.location.search);
        const pid = urlParams.get("pid");

        if (!pid) {
            log("Kein PID vorhanden");
            return;
        }

        const targetPid = String(pid);

        /******************************************
         * 1️⃣ LOGIN
         ******************************************/

        const currentExtId = await OneSignal.User.getExternalId();
        log("Aktuelle External ID:", currentExtId);

        if (currentExtId !== targetPid) {
            log("Login notwendig →", targetPid);
            await OneSignal.login(targetPid);
            log("Login abgeschlossen");
        }

        /******************************************
         * 2️⃣ PERMISSION
         ******************************************/

        if (OneSignal.Notifications.permission !== "granted") {
            log("Permission anfordern...");
            await OneSignal.Notifications.requestPermission();
        }

        if (OneSignal.Notifications.permission !== "granted") {
            log("❌ Permission nicht erteilt");
            return;
        }

        /******************************************
         * 3️⃣ PUSH SUBSCRIPTION SICHERSTELLEN
         ******************************************/

        await OneSignal.User.PushSubscription.optIn();

        const waitForSubscription = async () => {
            for (let i = 0; i < 20; i++) {
                const subId = OneSignal.User.PushSubscription.id;
                if (subId) return subId;
                await new Promise(r => setTimeout(r, 500));
            }
            return null;
        };

        const subscriptionId = await waitForSubscription();

        if (!subscriptionId) {
            log("❌ Keine Push Subscription erhalten");
            return;
        }

        log("Push Subscription ID:", subscriptionId);

        /******************************************
         * 4️⃣ MEMBERDATEN LADEN
         ******************************************/

        log("Lade Memberdaten...");

        const response = await fetch("https://termine.dan-hunziker73.workers.dev/?action=loadAdminData");
        const data = await response.json();

        const member = data.push_onesignal.find(m => String(m.personnumber) === targetPid);

        if (!member) {
            log("❌ Kein Member gefunden");
            return;
        }

        /******************************************
         * 5️⃣ TAGS ERSTELLEN
         ******************************************/

        const tags = {
            vorname: member.firstname || "",
            nachname: member.lastname || "",
            verein: "sportschuetzen_muhen"
        };

        if (member.membershipcategory) {
            member.membershipcategory.split(",").forEach(cat => {
                const key = cat
                    .trim()
                    .replace(/\s+/g, "_")
                    .replace(/[^a-zA-Z0-9_]/g, "");

                if (key) tags[key] = "aktiv";
            });
        }

        log("Sende Tags:", tags);

        await OneSignal.User.addTags(tags);

        log("✅ TAGS ERFOLGREICH GESETZT");

    } catch (err) {
        console.error("❌ OneSignal Fehler:", err);
    }

});
</script>








    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

            <h2>Sportschützen Muhen</h2>
            <p>Willkommen</p>
        </div>
        <div class="card">
            <h3>Termine</h3>
            
            <div class="filter-container">
                <button class="filter-btn active" onclick="filterTermine('all', this)">Alle</button>
                <button class="filter-btn" onclick="filterTermine('verein', this)">🎯 Verein</button>
                <button class="filter-btn" onclick="filterTermine('extern', this)">🏠 Haus</button>
