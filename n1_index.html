<head>

    <link rel="manifest" href="/sportschuetzen/manifest.json">

    <link rel="icon" type="image/png" sizes="192x192" href="/sportschuetzen/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/sportschuetzen/icons/icon-512.png">

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>

/************************************************
 * OneSignal Init & Automation
 ************************************************/
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
    const logToUI = (msg) => {
        console.log(msg);
        const statusEl = document.getElementById("status-box");
        if (statusEl) statusEl.innerHTML += `<div>${msg}</div>`;
    };

    try {
        await OneSignal.init({
            appId: "975091f5-948b-48d4-9e61-b7f4d43a1021",
            serviceWorkerParam: { scope: "/sportschuetzen/" },
            serviceWorkerPath: "OneSignalSDKWorker.js",
            autoRegister: false
        });

        const urlParams = new URLSearchParams(window.location.search);
        const pid = urlParams.get("pid");
        if (!pid) return;

        const targetPid = String(pid);

        // Funktion zum Setzen der Tags
        const sendTags = async () => {
            logToUI("📤 Sende Tags...");
            const response = await fetch("https://termine.dan-hunziker73.workers.dev/?action=loadAdminData");
            const data = await response.json();
            const member = data.push_onesignal.find(m => String(m.personnumber) === targetPid);
            if (!member) return;

            const tags = {
                vorname: member.firstname,
                nachname: member.lastname,
                verein: "sportschuetzen_muhen"
            };
            if (member.membershipcategory) {
                member.membershipcategory.split(",").forEach(cat => {
                    const key = cat.trim().replace(/\s+/g, '_');
                    if (key) tags[key] = "aktiv"; 
                });
            }

            await OneSignal.User.addTags(tags);
            logToUI("🚀 Tags erfolgreich gesetzt!");
        };

        // 1️⃣ EventListener für User-Change
        OneSignal.User.addEventListener("change", event => {
            if (event.current.externalId === targetPid) {
                sendTags();
            }
        });

        // 2️⃣ Login oder direkt Tags, wenn ID schon korrekt
        if (OneSignal.User.externalId !== targetPid) {
            logToUI("🔑 Login läuft...");
            await OneSignal.login(targetPid);
        } else {
            logToUI("✅ Identität bereits stabil.");
            sendTags(); // <--- direkt aufrufen
        }

    } catch (err) {
        logToUI("❌ Fehler: " + err.message);
    }
});


/************************************************
 * iOS & Standalone Checks
 ************************************************/
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches;

if (isIOS && !isStandalone) {
    console.log("📢 OneSignal Hinweis: iOS Push erfordert 'Zum Home-Bildschirm hinzufügen'.");
}


/************************************************
 * ZENTRALE APP-RESUME LOGIK
 ************************************************/
(function () {

    let lastResume = 0;
    const MIN_INTERVAL = 1500;

    function fireResume(source) {
        const now = Date.now();
        if (now - lastResume < MIN_INTERVAL) return;
        lastResume = now;

        console.log("📲 App Resume:", source);

        // Resume an alle iFrames senden
        document.querySelectorAll("iframe").forEach(iframe => {
            iframe.contentWindow?.postMessage(
                { type: "app:resume", source, ts: now },
                "*"
            );
        });
    }

    // App kommt in den Vordergrund
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
            fireResume("visibility");
        }
    });

    // Safari Back/Forward Cache
    window.addEventListener("pageshow", e => {
        if (e.persisted) {
            fireResume("pageshow");
        }
    });

    // Fallback (App-Switch, Desktop)
    window.addEventListener("focus", () => {
        fireResume("focus");
    });

})();
</script>
