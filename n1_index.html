<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Sportschützen Muhen App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="manifest" href="/sportschuetzen/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/sportschuetzen/icons/apple-touch-icon.png">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Sportschützen Muhen">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="icon" type="image/png" sizes="192x192" href="/sportschuetzen/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/sportschuetzen/icons/icon-512.png">

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {

    const log = (...args) => console.log("[OneSignal]", ...args);

    try {
        // --- INIT ---
        await OneSignal.init({
            appId: "975091f5-948b-48d4-9e61-b7f4d43a1021",
            serviceWorkerPath: "OneSignalSDKWorker.js",
            serviceWorkerParam: { scope: "/sportschuetzen/" },
            autoRegister: false
        });

        log("Init fertig");

        // --- PID HANDLING ---
        // 1. PID aus URL holen
        const urlParams = new URLSearchParams(window.location.search);
        let pid = urlParams.get("pid");
        
        // 2. Falls keine PID in URL: aus localStorage laden
        if (!pid) {
            pid = localStorage.getItem("sportschuetzen_pid");
            if (pid) {
                log("PID aus localStorage geladen:", pid);
            } else {
                log("Keine PID gefunden (weder URL noch localStorage)");
                return;
            }
        } else {
            // 3. PID aus URL → in localStorage speichern für spätere Nutzung
            localStorage.setItem("sportschuetzen_pid", pid);
            log("PID aus URL gespeichert:", pid);
        }

        const targetPid = String(pid);

        // --- LOGIN (External ID setzen) ---
        const currentExtId = OneSignal.User.externalId;
        if (currentExtId !== targetPid) {
            log("Login mit External ID:", targetPid);
            await OneSignal.login(targetPid);
        } else {
            log("External ID bereits gesetzt:", targetPid);
        }

        // --- PERMISSION CHECK ---
        const currentPermission = OneSignal.Notifications.permission;
        log("Permission Status:", currentPermission);

        if (currentPermission === "granted") {
            log("✅ Push bereits aktiviert");
            return;
        }

        if (currentPermission === "denied") {
            log("⚠️ Push wurde blockiert (User muss Browser-Einstellungen ändern)");
            return;
        }

        // Permission = "default" → User noch nicht gefragt
        log("Frage User nach Push-Berechtigung...");
        const permissionGranted = await OneSignal.Notifications.requestPermission();
        
        if (permissionGranted) {
            log("✅ User hat Push-Berechtigung erteilt");
        } else {
            log("❌ User hat Push-Berechtigung abgelehnt (PID bleibt in localStorage für späteren Versuch)");
        }

    } catch (err) {
        console.error("❌ OneSignal Fehler:", err);
    }

});
</script>





    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
    
<body>

<main>
    <section id="page-home" class="page active-page">

            <h2>Sportschützen Muhen</h2>
            <p>Willkommen</p>
        </div>
        <div class="card">
            <h3>Termine</h3>
            
            <div class="filter-container">
                <button class="filter-btn active" onclick="filterTermine('all', this)">Alle</button>
                <button class="filter-btn" onclick="filterTermine('verein', this)">🎯 Verein</button>
                <button class="filter-btn" onclick="filterTermine('extern', this)">🏠 Haus</button>
            </div>

            <div id="termine" class="termine-list">Lade Termine...</div>
        </div>
    </section>

    <section id="page-jm" class="page"><iframe src="app/app_jm.html"></iframe></section>
    <section id="page-gruppe" class="page"><iframe src="app/app_gruppe.html"></iframe></section>
    <section id="page-mannschaft" class="page"><iframe src="app/app_mannschaft.html"></iframe></section>

    <!-- Upload in iframe auslagern -->
<section id="page-upload" class="page">
    <iframe src="upload.html"></iframe>
</section>
</main>

<nav class="bottom-nav">
    <button class="nav-item" onclick="nav('page-jm', 'Jahresmeisterschaft', this)"><span>🏆</span>JM</button>
    <button class="nav-item" onclick="nav('page-gruppe', 'Gruppe & Grenzland', this)"><span>👥</span>G&G</button>
    <button class="nav-item nav-home active" onclick="nav('page-home', 'Termine', this)"><span>🏠</span></button>
