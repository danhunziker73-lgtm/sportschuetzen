<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Sportschützen Muhen App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="manifest" href="/sportschuetzen/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/sportschuetzen/icons/apple-touch-icon.png">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Sportschützen Muhen">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="icon" type="image/png" sizes="192x192" href="/sportschuetzen/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/sportschuetzen/icons/icon-512.png">

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>
/************************************************
 * OneSignal Init & Automation mit Polling
 ************************************************/
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {

    const logToUI = (msg) => {
        console.log(msg);
        const statusEl = document.getElementById("status-box");
        if (statusEl) statusEl.innerHTML += `<div>${msg}</div>`;
    };

    try {
        await OneSignal.init({
            appId: "975091f5-948b-48d4-9e61-b7f4d43a1021",
            serviceWorkerParam: { scope: "/sportschuetzen/" },
            serviceWorkerPath: "OneSignalSDKWorker.js",
            autoRegister: false
        });

        const urlParams = new URLSearchParams(window.location.search);
        const pid = urlParams.get("pid");
        if (!pid) return;

        const targetPid = String(pid);
        const currentExtId = OneSignal.User.externalId;

        if (currentExtId !== targetPid) {
            logToUI("🔑 Login läuft... bitte warten.");
            await OneSignal.login(targetPid);
            // kurze Pause für Queue
            setTimeout(() => location.reload(), 2000);
            return;
        }

        logToUI("✅ Identität bereits stabil.");
        logToUI("✅ OneSignal-ID bereit: " + OneSignal.User.id);

        // Helper: Polling bis User ready ist
        const waitForUserReady = async (retries = 10, delay = 300) => {
            for (let i = 0; i < retries; i++) {
                const tags = await OneSignal.User.getTags();
                if (tags !== null) return true;
                await new Promise(r => setTimeout(r, delay));
            }
            return false;
        };

        if (!await waitForUserReady()) {
            logToUI("❌ User nicht ready – Tags konnten nicht gesetzt werden.");
            return;
        }

        // Lade Memberdaten
        const response = await fetch("https://termine.dan-hunziker73.workers.dev/?action=loadAdminData");
        const data = await response.json();
        const member = data.push_onesignal.find(m => String(m.personnumber) === targetPid);

        if (member) {
            const tags = {
                vorname: member.firstname,
                nachname: member.lastname,
                verein: "sportschuetzen_muhen"
            };

            if (member.membershipcategory) {
                member.membershipcategory.split(",").forEach(cat => {
                    const key = cat.trim().replace(/\s+/g, '_');
                    if (key) tags[key] = "aktiv";
                });
            }

            console.log("DEBUG: Tags die gesendet werden:", tags);
            logToUI("📤 Sende Tags final...");
            await OneSignal.User.addTags(tags);
            logToUI("🚀 Tags erfolgreich gesetzt!");
        }

    } catch (err) {
        logToUI("❌ Fehler: " + err.message);
    }
});

/************************************************
 * iOS & Standalone Checks
 ************************************************/
if (!window.hasIOSCheckRun) {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
    if (isIOS && !isStandalone) console.log("📢 Hinweis: iOS Push erfordert 'Zum Home-Bildschirm hinzufügen'.");
    window.hasIOSCheckRun = true;
}

/************************************************
 * App Resume Logic
 ************************************************/
(function () {
    let lastResume = 0;
    const MIN_INTERVAL = 1500;

    function fireResume(source) {
        const now = Date.now();
        if (now - lastResume < MIN_INTERVAL) return;
        lastResume = now;
        console.log("📲 App Resume:", source);

        document.querySelectorAll("iframe").forEach(iframe => {
            iframe.contentWindow?.postMessage({ type: "app:resume", source, ts: now }, "*");
        });
    }

    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") fireResume("visibility"); });
    window.addEventListener("pageshow", e => { if (e.persisted) fireResume("pageshow"); });
    window.addEventListener("focus", () => { fireResume("focus"); });

})();
</script>






    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
