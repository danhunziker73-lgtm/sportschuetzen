<html lang="de">
<head>

    <link rel="icon" type="image/png" sizes="192x192" href="/sportschuetzen/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/sportschuetzen/icons/icon-512.png">

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>
/************************************************
 * OneSignal Init & Automation
 ************************************************/
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function (OneSignal) {
    
    try {
        // 1. Initialisierung
        await OneSignal.init({
            appId: "975091f5-948b-48d4-9e61-b7f4d43a1021",
            serviceWorkerParam: { scope: "/sportschuetzen/" },
            serviceWorkerPath: "OneSignalSDKWorker.js",
            autoRegister: false,
            notifyButton: { enable: true }
        });

        // 2. PID aus URL holen
        const urlParams = new URLSearchParams(window.location.search);
        const personNumber = urlParams.get("pid");

        if (!personNumber) {
            console.log("ℹ️ Keine PersonNumber (pid) in der URL gefunden.");
            return;
        }

        // 3. Daten via Cloudflare Worker laden
        const CLOUDFLARE_URL = "https://termine.dan-hunziker73.workers.dev/"; 
        const response = await fetch(`${CLOUDFLARE_URL}?action=loadAdminData`);
        const data = await response.json();

        if (!data || !data.push_onesignal) {
            console.error("❌ Fehler: 'push_onesignal' Daten nicht gefunden.");
            return;
        }

        // 4. Mitglied finden
        const member = data.push_onesignal.find(m => String(m.personnumber) === String(personNumber));

        if (!member) {
            console.warn("⚠️ Mitglied mit PID " + personNumber + " nicht gefunden.");
            return;
        }

        console.log("✅ Mitglied gefunden:", member.firstname, member.lastname);

// 5. Login-Check mit Identitäts-Erzwingung
const targetPid = String(member.personnumber);
const currentExternalId = OneSignal.User.externalId;

if (currentExternalId !== targetPid) {
    console.log(`🔑 Login erforderlich: ${targetPid}`);
    
    // Wir loggen ein. In v16 ist login() die primäre Methode.
    await OneSignal.login(targetPid);
    
    // Wir geben dem Server massiv Zeit (4 Sek), um die alten Sessions 
    // im Dashboard (die du im Screenshot siehst) zu sortieren.
    console.log("⏳ Stabilisiere Identität auf OneSignal Servern...");
    await new Promise(resolve => setTimeout(resolve, 4000)); 
} else {
    console.log("✅ Identität bereits korrekt gesetzt: " + targetPid);
}

// 6. Tags vorbereiten
const tags = {
    "vorname": member.firstname,
    "nachname": member.lastname,
    "verein": "sportschuetzen_muhen"
};

if (member.membershipcategory) {
    const categories = member.membershipcategory.split(",");
    categories.forEach(cat => {
        const cleanTag = cat.trim().replace(/\s+/g, '_');
        if (cleanTag) tags[cleanTag] = "true";
    });
}

// 7. Tags senden mit "Safe-Retry"
async function sendTagsSafe(data, attempt = 1) {
    try {
        console.log(`📤 Sende Tags (Versuch ${attempt})...`);
        await OneSignal.User.addTags(data);
        console.log("🏷️ OneSignal Tags erfolgreich vom Server bestätigt.");
    } catch (err) {
        if (attempt < 3) {
            console.warn(`⚠️ Konflikt (409). Warte auf Server-Freigabe... (Versuch ${attempt})`);
            setTimeout(() => sendTagsSafe(data, attempt + 1), 5000);
        } else {
            console.error("❌ Tags konnten nach mehreren Versuchen nicht gesetzt werden. Dashboard prüfen.", err);
        }
    }
}

// Start der Tag-Sychronisierung
await sendTagsSafe(tags);

        
    } catch (err) {
        console.error("❌ Kritischer Fehler im Ablauf:", err);
    }
});


/************************************************
 * iOS & Standalone Checks
 ************************************************/
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches;

if (isIOS && !isStandalone) {
    console.log("📢 OneSignal Hinweis: iOS Push erfordert 'Zum Home-Bildschirm hinzufügen'.");
}

/************************************************
 * ZENTRALE APP-RESUME LOGIK
 ************************************************/
(function () {

    let lastResume = 0;
    const MIN_INTERVAL = 1500;

    function fireResume(source) {
        const now = Date.now();
        if (now - lastResume < MIN_INTERVAL) return;
        lastResume = now;

        console.log("📲 App Resume:", source);

        // Resume an alle iFrames senden
        document.querySelectorAll("iframe").forEach(iframe => {
            iframe.contentWindow?.postMessage(
                { type: "app:resume", source, ts: now },
                "*"
            );
        });
    }

    // App kommt in den Vordergrund
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
            fireResume("visibility");
        }
    });

    // Safari Back/Forward Cache
    window.addEventListener("pageshow", e => {
        if (e.persisted) {
            fireResume("pageshow");
        }
    });

    // Fallback (App-Switch, Desktop)
    window.addEventListener("focus", () => {
        fireResume("focus");
    });

})();
</script>
