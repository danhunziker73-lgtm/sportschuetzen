<html lang="de">
<head>

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="icon" type="image/png" sizes="192x192" href="/sportschuetzen/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/sportschuetzen/icons/icon-512.png">

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>
/************************************************
 * OneSignal Init & Automation
 ************************************************/
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function (OneSignal) {
    
    // 1. Initialisierung
    await OneSignal.init({
        appId: "975091f5-948b-48d4-9e61-b7f4d43a1021",
        serviceWorkerParam: { scope: "/sportschuetzen/" },
        serviceWorkerPath: "OneSignalSDKWorker.js",
        autoRegister: false,
        notifyButton: { enable: true }
    });

    // 2. PID aus URL holen
    const urlParams = new URLSearchParams(window.location.search);
    const personNumber = urlParams.get("pid");

    if (!personNumber) {
        console.log("ℹ️ Keine PersonNumber (pid) in der URL gefunden.");
        return;
    }

    try {
        // 3. Daten via Cloudflare Worker laden
        const CLOUDFLARE_URL = "https://termine.dan-hunziker73.workers.dev/"; 
        const response = await fetch(`${CLOUDFLARE_URL}?action=loadAdminData`);
        const data = await response.json();

        if (!data.push_onesignal) {
            console.error("❌ Fehler: 'push_onesignal' Daten nicht im JSON gefunden.");
            return;
        }

        // 4. Mitglied finden
        const member = data.push_onesignal.find(m => String(m.personnumber) === String(personNumber));

        if (!member) {
            console.warn("⚠️ Mitglied mit PID " + personNumber + " nicht im Sheet gefunden.");
            return;
        }

        console.log("✅ Mitglied gefunden:", member.firstname, member.lastname);

   // 1. Prüfen, ob wir bereits als diese PID eingeloggt sind
        const externalId = await OneSignal.User.getExternalId();
        
        if (externalId !== String(member.personnumber)) {
            console.log("🔑 Logge neu ein als PID:", member.personnumber);
            await OneSignal.login(String(member.personnumber));
            
            // WICHTIG: Nach dem Login brauchen wir eine längere Pause, 
            // damit OneSignal die interne 'onesignal_id' aktualisieren kann.
            await new Promise(resolve => setTimeout(resolve, 2000)); 
        } else {
            console.log("✅ Bereits korrekt eingeloggt.");
        }

        // 2. Tags vorbereiten
        const tags = {
            "vorname": member.firstname,
            "nachname": member.lastname,
            "verein": "sportschuetzen_muhen"
        };

        if (member.membershipcategory) {
            const categories = member.membershipcategory.split(",");
            categories.forEach(cat => {
                const cleanTag = cat.trim().replace(/\s+/g, '_');
                if (cleanTag) tags[cleanTag] = "true";
            });
        }

        // 3. Tags setzen mit Fehlerabfang
        try {
            await OneSignal.User.addTags(tags);
            console.log("🏷️ OneSignal Tags erfolgreich synchronisiert:", tags);
        } catch (tagError) {
            console.warn("⚠️ Tags konnten nicht sofort gesetzt werden, OneSignal versucht es im Hintergrund erneut.");
        }
});

/************************************************
 * iOS & Standalone Checks
 ************************************************/
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches;

if (isIOS && !isStandalone) {
    console.log("📢 OneSignal Hinweis: iOS Push erfordert 'Zum Home-Bildschirm hinzufügen'.");
}


/************************************************
 * ZENTRALE APP-RESUME LOGIK (NEU)
 ************************************************/
(function () {

    let lastResume = 0;
    const MIN_INTERVAL = 1500;

    function fireResume(source) {
        const now = Date.now();
        if (now - lastResume < MIN_INTERVAL) return;
        lastResume = now;

        console.log("📲 App Resume:", source);

        // Resume an alle iFrames senden
        document.querySelectorAll("iframe").forEach(iframe => {
            iframe.contentWindow?.postMessage(
                { type: "app:resume", source, ts: now },
                "*"
            );
        });
    }

    // App kommt in den Vordergrund
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
            fireResume("visibility");
        }
    });

    // Safari Back/Forward Cache
    window.addEventListener("pageshow", e => {
        if (e.persisted) {
            fireResume("pageshow");
        }
    });

    // Fallback (App-Switch, Desktop)
    window.addEventListener("focus", () => {
        fireResume("focus");
    });

})();
</script>
