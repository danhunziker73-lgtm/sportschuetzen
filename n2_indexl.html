    <link rel="icon" type="image/png" sizes="512x512" href="/sportschuetzen/icons/icon-512.png">

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
    const log = (...args) => console.log("[OneSignal]", ...args);

    try {
        await OneSignal.init({
            appId: "975091f5-948b-48d4-9e61-b7f4d43a1021",
            serviceWorkerPath: "OneSignalSDKWorker.js",
            serviceWorkerParam: { scope: "/sportschuetzen/" },
            autoRegister: false
        });

        log("Init fertig");

        // --- PID HANDLING (Sicherstellung für Android/iOS) ---
        const urlParams = new URLSearchParams(window.location.search);
        let pid = urlParams.get("pid");
        
        if (pid) {
            localStorage.setItem('onesignal_pid', pid); // Sichern
        } else {
            pid = localStorage.getItem('onesignal_pid'); // Wiederholen, falls URL leer
        }

        if (!pid) {
            log("Keine PID vorhanden (URL & Speicher leer).");
            return;
        }
        const targetPid = String(pid);

        /******** LOGIN ********/
        const currentExtId = OneSignal.User.externalId;
        log("Current External ID:", currentExtId);

        if (currentExtId !== targetPid) {
            log("Login...");
            await OneSignal.login(targetPid);
            log("Login done");
            // Kurze Pause für das Backend-Mapping
            await new Promise(r => setTimeout(r, 500));
        }

        /******** PERMISSION ********/
        let permission = OneSignal.Notifications.permission;
        log("Permission Status:", permission);

        if (permission === "default") {
            log("Permission anfordern...");
            await OneSignal.Notifications.requestPermission();
            permission = OneSignal.Notifications.permission;
        }
        log("Final Permission:", permission);

        /******** SUBSCRIPTION ********/
        if (permission === "granted") {
            await OneSignal.User.PushSubscription.optIn();
            
            // Warten auf Subscription ID (wichtig für Android/Chrome)
            const waitForSub = async () => {
                for (let i = 0; i < 20; i++) {
                    const id = OneSignal.User.PushSubscription.id;
                    if (id) return id;
                    await new Promise(r => setTimeout(r, 500));
                }
                return null;
            };
            const subId = await waitForSub();
            log(subId ? "Subscription ID: " + subId : "Keine Subscription ID erhalten");
        } else {
            log("Push nicht erlaubt (oder denied) – Tags werden trotzdem versucht");
        }

        /******** MEMBER DATEN & TAGS ********/
        // Hier laden wir die Daten erst, wenn der Login-Prozess oben durch ist
        const response = await fetch("https://termine.dan-hunziker73.workers.dev/?action=loadAdminData");
        const data = await response.json();
        
        // Suche im push_onesignal Array
        const member = data.push_onesignal.find(m => String(m.personnumber) === targetPid);

        if (!member) {
            log("Member nicht im System gefunden für PID:", targetPid);
            return;
        }

        const tags = {
            vorname: member.firstname || "",
            nachname: member.lastname || "",
            verein: "sportschuetzen_muhen"
        };

        if (member.membershipcategory) {
            member.membershipcategory.split(",").forEach(cat => {
                const key = cat.trim().replace(/\s+/g, "_").replace(/[^a-zA-Z0-9_]/g, "");
                if (key) tags[key] = "aktiv";
            });
        }

        log("Sende Tags:", tags);
        await OneSignal.User.addTags(tags);
        log("✅ TAGS ERFOLGREICH GESETZT");

    } catch (err) {
        console.error("❌ OneSignal Fehler:", err);
    }
});
</script>







    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
