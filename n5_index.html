    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];

OneSignalDeferred.push(async function(OneSignal) {
    const log = (...args) => console.log("[OneSignal]", ...args);

    try {
        /*************************************************************
         * INIT
         *************************************************************/
        await OneSignal.init({
            appId: "975091f5-948b-48d4-9e61-b7f4d43a1021",
            serviceWorkerPath: "OneSignalSDKWorker.js",
            serviceWorkerParam: { scope: "/sportschuetzen/" },
            autoRegister: false
        });

        log("Init fertig");

        /*************************************************************
         * PID HOLEN
         *************************************************************/
        const urlParams = new URLSearchParams(window.location.search);
        const pid = urlParams.get("pid");

        if (!pid) {
            log("Keine PID – Abbruch");
            return;
        }

        const targetPid = String(pid);

        /*************************************************************
         * LOGIN
         *************************************************************/
        if (OneSignal.User.externalId !== targetPid) {
            log("Login mit External ID:", targetPid);
            await OneSignal.login(targetPid);
        }

        await waitForUserReady(20000);
        log("User Identity stabil");

        /*************************************************************
         * PERMISSION CHECK
         *************************************************************/
        const permission = OneSignal.Notifications.permission;
        log("Permission Status:", permission);

        if (permission === true || permission === "granted") {
            log("Push bereits erlaubt – warte auf Subscription");
            await OneSignal.User.PushSubscription.optIn();
            const sub = await waitForSubscriptionReady(30000);
            log("Subscription bereit:", sub.id);
            await delay(3000); 
            await setMemberTags(targetPid);
        } else {
            log("Push noch nicht erlaubt – warte auf Subscription Event");
            await new Promise((resolve) => {
                OneSignal.User.PushSubscription.addEventListener("change", async (event) => {
                    if (event.current && event.current.id) {
                        log("Subscription Event erkannt:", event.current.id);
                        await delay(3000); 
                        await setMemberTags(targetPid);
                        resolve();
                    }
                });
                // Falls nach 15 Sek nichts passiert, trotzdem Tags versuchen
                setTimeout(async () => {
                    log("Event Timeout – versuche Tags trotzdem");
                    await setMemberTags(targetPid);
                    resolve();
                }, 15000);
            });
        }
    } catch (err) {
        console.error("❌ OneSignal Fehler:", err);
    }

    /*************************************************************
     * INTERNE FUNKTIONEN (Innerhalb Deferred Push)
     *************************************************************/
    async function setMemberTags(targetPid) {
        try {
            log("Warte auf finalen Server-Sync...");
            await waitForUserFullySynced(30000);

            const response = await fetch("https://termine.dan-hunziker73.workers.dev/?action=loadAdminData");
            const data = await response.json();
            const member = data.push_onesignal.find(m => String(m.personnumber) === targetPid);

            if (!member) {
                log("Member nicht gefunden");
                return;
            }

            const tags = {
                vorname: member.firstname || "",
                nachname: member.lastname || "",
                verein: "sportschuetzen_muhen"
            };

            if (member.membershipcategory) {
                member.membershipcategory.split(",").forEach(cat => {
                    const key = cat.trim().replace(/\s+/g, "_").replace(/[^a-zA-Z0-9_]/g, "");
                    if (key) tags[key] = "aktiv";
                });
            }

            log("Sende Tags:", tags);
            await safeAddTags(tags);
            log("✅ TAGS ERFOLGREICH GESETZT");
        } catch (e) {
            log("Fehler in setMemberTags:", e);
        }
    }

    function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    function waitForUserReady(timeout) {
        return new Promise((resolve, reject) => {
            const start = Date.now();
            const check = () => {
                if (OneSignal.User.onesignalId && OneSignal.User.externalId) return resolve(true);
                if (Date.now() - start > timeout) return reject(new Error("Identity Timeout"));
                setTimeout(check, 500);
            };
            check();
        });
    }

    function waitForUserFullySynced(timeout) {
        return new Promise((resolve, reject) => {
            const start = Date.now();
            let lastId = null; let stableCount = 0;
            const check = () => {
                const id = OneSignal.User.onesignalId;
                if (!id) {
                    if (Date.now() - start > timeout) return reject(new Error("No OneSignal ID"));
                    return setTimeout(check, 500);
                }
                if (id === lastId) stableCount++; else { stableCount = 0; lastId = id; }
                if (stableCount >= 3) return resolve(true);
                if (Date.now() - start > timeout) return reject(new Error("Sync Timeout"));
                setTimeout(check, 1000);
            };
            check();
        });
    }

    function waitForSubscriptionReady(timeout) {
        return new Promise((resolve, reject) => {
            const start = Date.now();
            const check = () => {
                const sub = OneSignal.User.PushSubscription;
                if (sub && sub.id && sub.token) return resolve(sub);
                if (Date.now() - start > timeout) return reject(new Error("Sub Timeout"));
                setTimeout(check, 500);
            };
            check();
        });
    }

    async function safeAddTags(tags, retries = 5) {
        for (let i = 0; i < retries; i++) {
            try {
                await OneSignal.User.addTags(tags);
                return;
            } catch (err) {
                log("Tag Retry:", i + 1);
                if (i === retries - 1) throw err;
                await delay(3000);
            }
        }
    }
});
</script>
