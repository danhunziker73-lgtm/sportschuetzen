<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sportschützen Muhen App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- Manifest / Icons -->
<link rel="manifest" href="/sportschuetzen/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/sportschuetzen/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/sportschuetzen/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/sportschuetzen/icons/icon-512.png">

<!-- OneSignal SDK -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {

    const log = (...args) => console.log("[OneSignal]", ...args);

    try {
        // --- INIT ---
        await OneSignal.init({
            appId: "975091f5-948b-48d4-9e61-b7f4d43a1021",
            serviceWorkerPath: "OneSignalSDKWorker.js",
            serviceWorkerParam: { scope: "/sportschuetzen/" },
            autoRegister: false
        });

        log("Init fertig");

        const urlParams = new URLSearchParams(window.location.search);
        const pid = urlParams.get("pid");
        if (!pid) {
            log("Kein pid gefunden");
            return;
        }
        const targetPid = String(pid);

        // --- LOGIN ---
        const currentExtId = OneSignal.User.externalId;
        if (currentExtId !== targetPid) {
            log("Login mit External ID:", targetPid);
            await OneSignal.login(targetPid);
        }
        log("User Identity stabil");

        // --- PERMISSION ---
        log("Permission Status:", OneSignal.Notifications.permission);
        if (OneSignal.Notifications.permission !== "granted") {
            log("Warte auf User Permission...");
            await OneSignal.Notifications.requestPermission();
        }
        log("Final Permission:", OneSignal.Notifications.permission);

        // --- SUBSCRIPTION HANDLER ---
        const waitForSubscription = () => new Promise(resolve => {
            const timeout = setTimeout(() => {
                log("Event Timeout – versuche Tags trotzdem");
                resolve(null);
            }, 30000); // max 30 Sekunden warten

            OneSignal.on("subscriptionChange", sub => {
                if (sub) {
                    log("Subscription Event erkannt:", sub.id);
                    clearTimeout(timeout);
                    resolve(sub);
                }
            });
        });

        const sub = await waitForSubscription();

        // 20 Sekunden warten, um finalen Sync sicherzustellen
        log("Warte 20 Sekunden auf finalen Server-Sync...");
        await new Promise(r => setTimeout(r, 20000));

        // --- MEMBER DATEN / TAGS ---
        const response = await fetch("https://termine.dan-hunziker73.workers.dev/?action=loadAdminData");
        const data = await response.json();
        const member = data.push_onesignal.find(m => String(m.personnumber) === targetPid);

        if (!member) {
            log("Member nicht gefunden");
            return;
        }

        const tags = {
            vorname: member.firstname || "",
            nachname: member.lastname || "",
            verein: "sportschuetzen_muhen"
        };

        if (member.membershipcategory) {
            member.membershipcategory.split(",").forEach(cat => {
                const key = cat.trim().replace(/\s+/g, "_").replace(/[^a-zA-Z0-9_]/g, "");
                if (key) tags[key] = "aktiv";
            });
        }

        log("Sende Tags:", tags);
        await OneSignal.User.addTags(tags);
        log("✅ TAGS ERFOLGREICH GESETZT");

    } catch (err) {
        console.error("❌ OneSignal Fehler:", err);
    }

});
</script>

</head>
<body>
<h1>Sportschützen Muhen App</h1>
<p>Warte auf Push-Subscription...</p>
</body>
</html>
