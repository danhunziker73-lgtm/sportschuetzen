<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>OneSignal Push Test</title>

    <link rel="manifest" href="/sportschuetzen/manifest.json">

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

    <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
        
        await OneSignal.init({
            appId: "4fd0fec9-a8dd-40d9-94e9-7ba330c07176",
            // Deine spezifischen Pfade
            serviceWorkerPath: "push/onesignal/OneSignalSDKWorker.js",
            serviceWorkerUpdaterPath: "push/onesignal/OneSignalSDKUpdaterWorker.js",
            serviceWorkerParam: {
                scope: "/sportschuetzen/push/onesignal/"
            }
        });

        console.log("Init OK");
        
        // Status Log beim Laden
        console.log("Permission:", OneSignal.Notifications.permission);
        console.log("Opted In:", OneSignal.User.PushSubscription.optedIn);
        console.log("ID:", OneSignal.User.PushSubscription.id);
    });

    async function askPush() {
        console.log("Starte Abfrage...");
        // Wir nutzen OneSignalDeferred auch hier, falls OneSignal noch nicht bereit ist
        OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.Notifications.requestPermission();
            
            console.log("Nach Abfrage - Permission:", OneSignal.Notifications.permission);
            console.log("ID:", OneSignal.User.PushSubscription.id);
        });
    }
    </script>
</head>
<body>

    <h1>OneSignal Push Test</h1>
    <button onclick="askPush()">🔔 Push erlauben</button>

    <p>Bitte öffne F12 (DevTools) -> Konsole, um die Logs zu sehen.</p>

</body>
</html>
