<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>OneSignal Push Test</title>

<link rel="manifest" href="/sportschuetzen/manifest.json">

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {

  console.log("=== OneSignal TEST START ===");

  await OneSignal.init({
    appId: "4fd0fec9-a8dd-40d9-94e9-7ba330c07176",
    serviceWorkerPath: "/OneSignalSDKWorker.js",
    serviceWorkerUpdaterPath: "/OneSignalSDKUpdaterWorker.js",
    });

  console.log("init OK");

  console.log("permission:", await OneSignal.Notifications.permission);
  console.log("optedIn:", await OneSignal.User.PushSubscription.optedIn);
  console.log("id:", await OneSignal.User.PushSubscription.id);
});

async function askPush() {
  console.log("requestPermission()");
  await OneSignal.Notifications.requestPermission();

  console.log("permission:", await OneSignal.Notifications.permission);
  console.log("optedIn:", await OneSignal.User.PushSubscription.optedIn);
  console.log("id:", await OneSignal.User.PushSubscription.id);
}
</script>
</head>
<body>

<h1>OneSignal Push Test</h1>
<button onclick="askPush()">🔔 Push erlauben</button>

<p>DevTools → Console offen lassen</p>

</body>
</html>
