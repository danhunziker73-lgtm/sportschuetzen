<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneSignal iOS Safari Test</title>
  <script src="https://cdn.onesignal.com/sdks/OneSignalSDK.js" async></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 2rem; }
    button { font-size: 1rem; padding: 0.5rem 1rem; margin-top: 1rem; cursor: pointer; }
    #status { margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>OneSignal iOS Safari Push Test</h1>
  <button id="pushButton">Push aktivieren</button>
  <div id="status"></div>

  <script>
    if (window === window.top) {
      window.OneSignalDeferred = window.OneSignalDeferred || [];

      OneSignalDeferred.push(async (OneSignal) => {
        await OneSignal.init({
          appId: "DEINE-ONESIGNAL-APP-ID",
          serviceWorkerPath: "OneSignalSDKWorker.js",
          serviceWorkerUpdaterWorkerPath: "OneSignalSDKUpdaterWorker.js"
        });

        const statusDiv = document.getElementById("status");
        const pushButton = document.getElementById("pushButton");

        // Funktion zum Prüfen des Push-Status
        async function checkStatus() {
          const permission = await OneSignal.Notifications.permission;
          const optedIn = OneSignal.User.PushSubscription.optedIn;
          console.log("Push Permission:", permission);
          console.log("User opted in:", optedIn);
          statusDiv.innerText = `Permission: ${permission} | Opted In: ${optedIn}`;
        }

        await checkStatus();

        // Button für Nutzerinteraktion, um Push zu aktivieren
        pushButton.addEventListener("click", async () => {
          await OneSignal.showSlidedownPrompt();
          await checkStatus(); // Status direkt danach aktualisieren
        });
      });
    }
  </script>
</body>
</html>
