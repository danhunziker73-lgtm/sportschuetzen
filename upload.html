<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standblatt Upload</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>

    html, body {
    margin: 0;
    padding: 0;
    overflow: hidden; /* Verhindert den Scrollbalken im Iframe-Inhalt */
    height: 100%;
}

.card {
    margin: 0 !important;
    padding: 15px !important;
    box-shadow: none !important;
    border: none !important; /* Entfernt Ränder, die Platz fressen könnten */
}
    
    
    
    /* Spezielle Anpassung für die Anzeige im Iframe */
    body { 
        padding: 5px; /* Minimaler Außenabstand */
        background: transparent; /* Verhindert hässliche weiße Ränder */
        overflow: hidden; /* Verhindert Scrollen innerhalb des Bodys */
    }
    h2 { font-size: 1.2rem; margin-bottom: 15px; }
    .upload-area { padding: 1rem !important; }
    #preview { max-height: 120px; } /* Begrenzt die Vorschau, damit der Button sichtbar bleibt */
</style>


    
</head>
<body>

<div class="card">
    <h2 style="margin-top:0;">Standblatt Upload</h2>
    <form id="uploadForm">
        <div class="form-group">
            <select id="name" required><option value="" disabled selected>Namen wählen...</option></select>
        </div>
        <div class="form-group">
            <div class="upload-area" onclick="document.getElementById('foto').click()">
                <span id="upload-hint">📸 Foto Standblatt aufnehmen</span>
                <input type="file" id="foto" accept="image/*" required style="display:none">
                <img id="preview">
            </div>
        </div>
         <div style="display:flex; gap:10px; margin-bottom:20px;">
            <div style="flex:1;"><label>Erzielt</label><input type="number" id="erzielt" placeholder="Pkt" required></div>
            <div style="flex:1;"><label>Maximum</label><input type="number" id="maximal" placeholder="100" required></div>
        </div>
        <button type="submit" id="submitBtn" class="btn-main">Jetzt senden</button>
    </form>
</div>

<script src="upload.js" defer></script>
</body>
</html>
