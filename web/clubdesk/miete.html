<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Sport Kalender</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<style>
:root {
  --primary: #1e40af;
  --primary-light: #3b82f6;
  --weekend-bg: #f1f5f9;
  --danger: #dc2626;
  --warning: #f59e0b;
  --success: #16a34a;
}

body {
  font-family: 'Inter', sans-serif;
  background: #f8fafc;
  display: flex;
  justify-content: center;
  padding: 40px 16px;
}

.card {
  background: white;
  width: 100%;
  max-width: 950px;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.08);
}

h1 {
  margin-bottom: 10px;
}

.subtitle {
  color: #64748b;
  margin-bottom: 30px;
}

.flatpickr-calendar {
  box-shadow: none !important;
}

.flatpickr-day {
  border-radius: 12px;
  transition: all 0.2s ease;
  font-weight: 500;
}

.flatpickr-day:hover {
  transform: translateY(-3px);
  background: var(--primary-light);
  color: white;
}

.flatpickr-day.selected {
  background: var(--primary);
  color: white;
  box-shadow: 0 0 0 4px rgba(59,130,246,0.3);
}

.flatpickr-day.weekend {
  background: var(--weekend-bg);
  font-weight: 600;
}

.flatpickr-day.fix-day {
  background: #fee2e2 !important;
  color: var(--danger) !important;
  position: relative;
}

.flatpickr-day.fix-day::after {
  content: "✕";
  position: absolute;
  top: 4px;
  right: 6px;
  font-size: 10px;
  font-weight: bold;
}

.flatpickr-day.provisional-day {
  position: relative;
}

.flatpickr-day.provisional-day::after {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 10px;
  border: 2px solid var(--warning);
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.4; }
  100% { opacity: 1; }
}

.status-box {
  margin-top: 25px;
  padding: 16px;
  border-radius: 14px;
  font-weight: 600;
  display: none;
  animation: fadeUp 0.3s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.status-success { background: #ecfdf5; color: var(--success); }
.status-warning { background: #fff7ed; color: var(--warning); }
.status-danger { background: #fef2f2; color: var(--danger); }

button {
  margin-top: 25px;
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  border: none;
  font-weight: 700;
  background: var(--primary);
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-2px);
  background: var(--primary-light);
}
</style>
</head>
<body>

<div class="card">
  <h1>Termin wählen</h1>
  <div class="subtitle">Reservierung nur für einzelne Tage</div>

  <div id="calendar"></div>

  <div id="statusBox" class="status-box"></div>
  <button id="submitBtn" disabled>Reservieren</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
const WORKER_TERMINE_URL = "https://termine.dan-hunziker73.workers.dev?action=getTermine";

let fixDates = {};
let provisionalDates = {};

function convertToISO(dateStr) {
  const [d,m,y] = dateStr.split(".");
  return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
}

async function loadData() {
  const res = await fetch(WORKER_TERMINE_URL);
  const data = await res.json();

  data.forEach(entry => {
    const iso = convertToISO(entry.datum);
    if (entry.status === "fix") fixDates[iso] = entry.titel;
    if (entry.status === "provisorisch") provisionalDates[iso] = entry.titel;
  });

  initCalendar();
}

function showStatus(type, message) {
  const box = document.getElementById("statusBox");
  box.className = "status-box " + type;
  box.innerHTML = message;
  box.style.display = "block";
}

function initCalendar() {
  const fp = flatpickr("#calendar", {
    inline: true,
    showMonths: window.innerWidth > 768 ? 2 : 1,
    locale: { firstDayOfWeek: 1 },
    minDate: "today",
    disable: [],

    onDayCreate: function(_,__,___,dayElem) {
      const iso = dayElem.dateObj.toISOString().split("T")[0];
      const day = dayElem.dateObj.getDay();

      if (day === 0 || day === 6) {
        dayElem.classList.add("weekend");
      }

      if (fixDates[iso]) {
        dayElem.classList.add("fix-day");
      }

      if (provisionalDates[iso]) {
        dayElem.classList.add("provisional-day");
      }

      dayElem.addEventListener("click", () => {
        if (fixDates[iso]) {
          showStatus("status-danger", "❌ Bereits reserviert: " + fixDates[iso]);
          document.getElementById("submitBtn").disabled = true;
        }
        else if (provisionalDates[iso]) {
          showStatus("status-warning", "⚠ Provisorische Belegung: " + provisionalDates[iso]);
          document.getElementById("submitBtn").disabled = false;
        }
      });
    },

    onChange: function(selectedDates) {
      if (!selectedDates.length) return;

      const iso = selectedDates[0].toISOString().split("T")[0];

      if (!fixDates[iso] && !provisionalDates[iso]) {
        showStatus("status-success", "✓ Termin verfügbar.");
        document.getElementById("submitBtn").disabled = false;
      }
    }
  });

  // Swipe Support (Mobile)
  let startX = 0;

  fp.calendarContainer.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
  });

  fp.calendarContainer.addEventListener("touchend", e => {
    const endX = e.changedTouches[0].clientX;
    const diff = startX - endX;

    if (Math.abs(diff) > 50) {
      if (diff > 0) fp.nextMonth();
      else fp.prevMonth();
    }
  });
}

loadData();
</script>

</body>
</html>
