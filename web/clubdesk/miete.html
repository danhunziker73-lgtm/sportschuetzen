<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Mietkalender</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<style>
body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #f8fafc, #eef2f7);
  display: flex;
  justify-content: center;
  padding: 60px 16px;
}

.form-card {
  background: white;
  width: 100%;
  max-width: 650px;
  padding: 50px;
  border-radius: 24px;
  box-shadow: 0 25px 70px rgba(0,0,0,0.08);
}

h1 {
  margin-bottom: 12px;
  font-weight: 600;
}

.subtitle {
  color: #6b7280;
  margin-bottom: 35px;
}

.status-box {
  margin-top: 20px;
  padding: 16px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 500;
  display: none;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.3s ease;
}

.status-box.show {
  display: block;
  opacity: 1;
  transform: translateY(0);
}

.status-available {
  background: #ecfdf5;
  color: #16a34a;
}

.status-booked {
  background: #fef2f2;
  color: #dc2626;
}

.status-warning {
  background: #fff7ed;
  color: #d97706;
}

.flatpickr-day.weekend {
  background: #f1f5f9;
  font-weight: 600;
}

.flatpickr-day.today {
  border: 2px solid #6366f1;
}

.flatpickr-day.provisional {
  background: #fff7ed !important;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(217,119,6,0.4); }
  70% { box-shadow: 0 0 0 6px rgba(217,119,6,0); }
  100% { box-shadow: 0 0 0 0 rgba(217,119,6,0); }
}

.flatpickr-day:hover {
  transform: scale(1.15);
  transition: 0.2s ease;
  z-index: 2;
}

button {
  margin-top: 30px;
  width: 100%;
  padding: 18px;
  border-radius: 16px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  background: #6366f1;
  color: white;
  cursor: pointer;
  transition: 0.3s ease;
}

button:hover {
  background: #4f46e5;
}
</style>
</head>
<body>

<div class="form-card">
  <h1>Wunschtermin wählen</h1>
  <div class="subtitle">Reservierung nur für einzelne Tage möglich</div>

  <input type="text" id="calendar" readonly>

  <div id="statusBox" class="status-box"></div>

  <button id="submitBtn" disabled>Reservieren</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
const WORKER_TERMINE_URL = "https://termine.dan-hunziker73.workers.dev?action=getTermine";

let fixDates = {};
let provisionalDates = {};

function convertToISO(dateStr) {
  const [day, month, year] = dateStr.split(".");
  return `${year}-${month.padStart(2,'0')}-${day.padStart(2,'0')}`;
}

async function loadData() {
  const response = await fetch(WORKER_TERMINE_URL);
  const data = await response.json();

  data.forEach(entry => {
    const iso = convertToISO(entry.datum);

    if (entry.status === "fix") {
      fixDates[iso] = entry.titel;
    }

    if (entry.status === "provisorisch") {
      provisionalDates[iso] = entry.titel;
    }
  });

  initCalendar();
}

function initCalendar() {
  flatpickr("#calendar", {
    minDate: "today",
    dateFormat: "Y-m-d",
    disable: Object.keys(fixDates),
    onDayCreate: function(dObj, dStr, fp, dayElem) {
      const dateStr = dayElem.dateObj.toISOString().split("T")[0];
      const day = dayElem.dateObj.getDay();

      // Wochenende hervorheben
      if (day === 0 || day === 6) {
        dayElem.classList.add("weekend");
      }

      // Provisorische Tage
      if (provisionalDates[dateStr]) {
        dayElem.classList.add("provisional");
        dayElem.title = provisionalDates[dateStr];
      }

      // Fix-Tage Tooltip
      if (fixDates[dateStr]) {
        dayElem.title = "Belegt: " + fixDates[dateStr];
      }
    },
    onChange: function(selectedDates) {
      const statusBox = document.getElementById("statusBox");
      const submitBtn = document.getElementById("submitBtn");

      if (!selectedDates.length) return;

      const iso = selectedDates[0].toISOString().split("T")[0];

      statusBox.className = "status-box show";

      if (fixDates[iso]) {
        statusBox.classList.add("status-booked");
        statusBox.innerHTML = "❌ Bereits fix reserviert: " + fixDates[iso];
        submitBtn.disabled = true;
      }
      else if (provisionalDates[iso]) {
        statusBox.classList.add("status-warning");
        statusBox.innerHTML = "⚠ Provisorisch reserviert (" + provisionalDates[iso] + ") – manuelle Abklärung nötig.";
        submitBtn.disabled = false;
      }
      else {
        statusBox.classList.add("status-available");
        statusBox.innerHTML = "✓ Termin verfügbar.";
        submitBtn.disabled = false;
      }
    }
  });
}

loadData();
</script>

</body>
</html>
