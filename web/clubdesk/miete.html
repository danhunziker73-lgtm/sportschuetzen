<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sportlicher Mietkalender</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<style>
:root {
  --primary: #0f172a;
  --accent: #2563eb;
  --accent-glow: #3b82f6;
  --weekend: #e2e8f0;
  --warning: #f59e0b;
  --danger: #ef4444;
  --success: #22c55e;
}

body {
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at top left, #1e293b, #0f172a);
  display: flex;
  justify-content: center;
  padding: 60px 16px;
  color: white;
}

.form-card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(14px);
  width: 100%;
  max-width: 900px;
  padding: 50px;
  border-radius: 24px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
}

h1 {
  font-weight: 700;
  margin-bottom: 10px;
  letter-spacing: 0.5px;
}

.subtitle {
  color: #94a3b8;
  margin-bottom: 40px;
}

.flatpickr-calendar {
  background: transparent !important;
  box-shadow: none !important;
}

.flatpickr-months {
  color: white;
}

.flatpickr-day {
  border-radius: 12px;
  transition: all 0.2s ease;
}

.flatpickr-day:hover {
  transform: translateY(-3px);
  background: var(--accent);
  color: white;
  box-shadow: 0 6px 18px rgba(37,99,235,0.4);
}

.flatpickr-day.selected {
  background: var(--accent);
  box-shadow: 0 0 0 4px rgba(59,130,246,0.4);
}

.flatpickr-day.weekend {
  background: var(--weekend);
  color: #0f172a;
  font-weight: 600;
}

.flatpickr-day.today {
  border: 2px solid var(--accent);
}

.flatpickr-day.provisional {
  position: relative;
}

.flatpickr-day.provisional::after {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 10px;
  border: 2px solid var(--warning);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.3; }
  100% { opacity: 1; }
}

.status-box {
  margin-top: 30px;
  padding: 18px;
  border-radius: 16px;
  font-weight: 600;
  display: none;
  transform: translateY(10px);
  opacity: 0;
  transition: all 0.3s ease;
}

.status-box.show {
  display: block;
  transform: translateY(0);
  opacity: 1;
}

.status-success {
  background: rgba(34,197,94,0.15);
  color: var(--success);
}

.status-warning {
  background: rgba(245,158,11,0.15);
  color: var(--warning);
}

.status-danger {
  background: rgba(239,68,68,0.15);
  color: var(--danger);
}

button {
  margin-top: 30px;
  width: 100%;
  padding: 18px;
  border-radius: 18px;
  border: none;
  font-size: 16px;
  font-weight: 700;
  background: linear-gradient(90deg, var(--accent), var(--accent-glow));
  color: white;
  cursor: pointer;
  transition: 0.3s ease;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(59,130,246,0.4);
}
</style>
</head>
<body>

<div class="form-card">
  <h1>Wunschtermin wählen</h1>
  <div class="subtitle">Reservierung nur für einzelne Tage</div>

  <input type="text" id="calendar" readonly>

  <div id="statusBox" class="status-box"></div>

  <button id="submitBtn" disabled>Reservieren</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
const WORKER_TERMINE_URL = "https://termine.dan-hunziker73.workers.dev?action=getTermine";

let fixDates = {};
let provisionalDates = {};

function convertToISO(dateStr) {
  const [day, month, year] = dateStr.split(".");
  return `${year}-${month.padStart(2,'0')}-${day.padStart(2,'0')}`;
}

async function loadData() {
  const response = await fetch(WORKER_TERMINE_URL);
  const data = await response.json();

  data.forEach(entry => {
    const iso = convertToISO(entry.datum);
    if (entry.status === "fix") fixDates[iso] = entry.titel;
    if (entry.status === "provisorisch") provisionalDates[iso] = entry.titel;
  });

  initCalendar();
}

function initCalendar() {
  flatpickr("#calendar", {
    inline: true,
    showMonths: window.innerWidth > 768 ? 2 : 1,
    locale: {
      firstDayOfWeek: 1
    },
    minDate: "today",
    dateFormat: "Y-m-d",
    disable: Object.keys(fixDates),

    onDayCreate: function(dObj, dStr, fp, dayElem) {
      const dateStr = dayElem.dateObj.toISOString().split("T")[0];
      const day = dayElem.dateObj.getDay();

      if (day === 0 || day === 6) {
        dayElem.classList.add("weekend");
      }

      if (provisionalDates[dateStr]) {
        dayElem.classList.add("provisional");
        dayElem.title = provisionalDates[dateStr];
      }

      if (fixDates[dateStr]) {
        dayElem.title = "Belegt: " + fixDates[dateStr];
      }
    },

    onChange: function(selectedDates) {
      const statusBox = document.getElementById("statusBox");
      const submitBtn = document.getElementById("submitBtn");

      if (!selectedDates.length) return;

      const iso = selectedDates[0].toISOString().split("T")[0];

      statusBox.className = "status-box show";

      if (fixDates[iso]) {
        statusBox.classList.add("status-danger");
        statusBox.innerHTML = "❌ Bereits reserviert: " + fixDates[iso];
        submitBtn.disabled = true;
      }
      else if (provisionalDates[iso]) {
        statusBox.classList.add("status-warning");
        statusBox.innerHTML = "⚠ Provisorische Belegung – manuelle Abklärung nötig.";
        submitBtn.disabled = false;
      }
      else {
        statusBox.classList.add("status-success");
        statusBox.innerHTML = "✓ Termin verfügbar.";
        submitBtn.disabled = false;
      }
    }
  });
}

loadData();
</script>

</body>
</html>
