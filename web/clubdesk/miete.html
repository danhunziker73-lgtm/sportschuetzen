<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mietanfrage Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<style>
body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #f8fafc, #eef2f7);
  display: flex;
  justify-content: center;
  padding: 60px 16px;
}

.form-card {
  background: white;
  width: 100%;
  max-width: 650px;
  padding: 50px;
  border-radius: 24px;
  box-shadow: 0 25px 70px rgba(0,0,0,0.08);
}

h1 {
  margin-bottom: 8px;
  font-weight: 600;
}

.subtitle {
  color: #6b7280;
  margin-bottom: 40px;
}

.input-group {
  margin-bottom: 30px;
}

label {
  font-weight: 600;
  display: block;
  margin-bottom: 10px;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  border: 1px solid #d1d5db;
  font-size: 16px;
  transition: 0.25s ease;
}

input:focus {
  border-color: #6366f1;
  outline: none;
  box-shadow: 0 0 0 4px rgba(99,102,241,0.15);
}

.status-box {
  margin-top: 15px;
  padding: 14px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  display: none;
}

.status-available {
  background: #ecfdf5;
  color: #16a34a;
}

.status-booked {
  background: #fef2f2;
  color: #dc2626;
}

.status-warning {
  background: #fff7ed;
  color: #d97706;
}

button {
  margin-top: 30px;
  width: 100%;
  padding: 18px;
  border-radius: 16px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  background: #6366f1;
  color: white;
  cursor: pointer;
  transition: 0.3s ease;
}

button:hover {
  background: #4f46e5;
}
</style>
</head>
<body>

<div class="form-card">
  <h1>Mietanfrage</h1>
  <div class="subtitle">Wunschtermin auswählen</div>

  <div class="input-group">
    <label for="dateRange">Mietzeitraum</label>
    <input type="text" id="dateRange" placeholder="Zeitraum wählen" readonly>
    <div id="statusBox" class="status-box"></div>
  </div>

  <button id="submitBtn" disabled>Anfrage senden</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
const WORKER_TERMINE_URL = "https://termine.dan-hunziker73.workers.dev?action=getTermine";

let fixDates = [];
let provisionalDates = [];

function convertToISO(dateStr) {
  const [day, month, year] = dateStr.split(".");
  return `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
}

async function loadBookings() {
  const response = await fetch(WORKER_TERMINE_URL);
  const data = await response.json();

  data.forEach(entry => {
    const isoDate = convertToISO(entry.datum);

    if (entry.status === "fix") {
      fixDates.push(isoDate);
    }

    if (entry.status === "provisorisch") {
      provisionalDates.push(isoDate);
    }
  });

  initCalendar();
}

function initCalendar() {
  flatpickr("#dateRange", {
    mode: "range",
    minDate: "today",
    dateFormat: "Y-m-d",
    disable: fixDates,
    onDayCreate: function(dObj, dStr, fp, dayElem) {
      const dateStr = dayElem.dateObj.toISOString().split("T")[0];

      if (provisionalDates.includes(dateStr)) {
        dayElem.style.background = "#fff7ed";
        dayElem.style.color = "#d97706";
      }
    },
    onChange: function(selectedDates) {
      const statusBox = document.getElementById("statusBox");
      const submitBtn = document.getElementById("submitBtn");

      if (selectedDates.length < 2) {
        statusBox.style.display = "none";
        submitBtn.disabled = true;
        return;
      }

      let hasProvisional = false;

      let current = new Date(selectedDates[0]);
      const end = selectedDates[1];

      while (current <= end) {
        const iso = current.toISOString().split("T")[0];

        if (provisionalDates.includes(iso)) {
          hasProvisional = true;
          break;
        }

        current.setDate(current.getDate() + 1);
      }

      statusBox.style.display = "block";

      if (hasProvisional) {
        statusBox.className = "status-box status-warning";
        statusBox.innerHTML = "⚠ Zeitraum enthält provisorische Vereinsbelegung – manuelle Prüfung erforderlich.";
      } else {
        statusBox.className = "status-box status-available";
        statusBox.innerHTML = "✓ Zeitraum verfügbar.";
      }

      submitBtn.disabled = false;
    }
  });
}

loadBookings();
</script>

</body>
</html>
