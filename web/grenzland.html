<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grenzlandmeisterschaft</title>

    <script src="https://www.gstatic.com/charts/loader.js"></script>

    <style>
        :root {
            --primary: #0f3c5c;
            --bg: #f4f6f8;
            --white: #ffffff;
            --border: #e0e0e0;
        }

        body { font-family: Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        h1 { margin-bottom: 5px; color: var(--primary); }
        .subtitle { color: #666; margin-bottom: 15px; font-size: 0.9rem; }
        
        /* Tabellen Styling */
        .table-wrapper { overflow-x: auto; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        table { width: 100%; min-width: 400px; border-collapse: collapse; background: var(--white); }
        th, td { padding: 12px 10px; text-align: center; border-bottom: 1px solid var(--border); }
        th { background: var(--primary); color: white; font-weight: 600; }
        
        td.team { 
            font-weight: bold; 
            text-align: left; 
            cursor: pointer; 
            color: var(--primary);
            white-space: normal;
            word-wrap: break-word;
            max-width: 180px;
        }
        
        td.cell { background: #fafafa; cursor: pointer; font-weight: 600; }
        td.cell:hover { background: #e6eef5; }

        /* Detailansicht Styling */
        .detail-row { background: #fdfdfd; }
        .detail { 
            display: none; 
            padding: 15px; 
            background: #f9f9f9; 
            border-top: 2px solid var(--primary);
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .player { 
            display: grid; 
            grid-template-columns: 1fr auto; /* Name links, Punkte rechts */
            gap: 12px; 
            padding: 10px 0; 
            border-bottom: 1px solid #eee; 
            align-items: center; 
        }
        
        .name { font-size: 1rem; color: #2d3748; }
        .score { font-weight: 800; color: #000; font-size: 1.1rem; }

        /* Gesamtzeile Alignment */
        .total-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            margin-top: 5px;
            font-size: 1.1rem;
        }
        .total-label { font-weight: bold; color: var(--primary); }
        .total-val { font-weight: 900; color: var(--primary); }

        h3 { margin-top: 0; font-size: 1.1rem; color: var(--primary); border-bottom: 1px solid #ddd; padding-bottom: 8px; }

        @media (max-width: 768px) { 
            th, td { padding: 10px 6px; font-size: 14px; } 
            h1 { font-size: 1.4rem; } 
        }
    </style>

    <script>
        google.charts.load('current');
        google.charts.setOnLoadCallback(loadData);

        const SHEET_ID = "1VuOv6b8r5m1g_9ZidPR3OPZ7YIwLUm6dYLC9nKmC2mE";

        const urlParams = new URLSearchParams(window.location.search);
        const selectedYear = urlParams.get('jahr') || 'aktuell'; 
        const SHEET_NAME = (selectedYear === 'aktuell') ? "Aktuell_Grenzland" : `${selectedYear}_Grenzland`;
        const YEAR_LABEL = (selectedYear === 'aktuell') ? "Aktuell" : selectedYear;

        let raw = [];
        let teams = [];

        function loadData() {
            document.querySelector('h1').textContent = `Grenzlandmeisterschaft ${YEAR_LABEL}`;
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${SHEET_NAME}`;
            const query = new google.visualization.Query(url);
            
            query.send(res => {
                if(res.isError()){
                    document.getElementById("overview").innerHTML = `<p style='color:red'>Fehler beim Laden: ${res.getMessage()}</p>`;
                    return;
                }

                const data = res.getDataTable();
                raw = [];
                for(let r=0; r<data.getNumberOfRows(); r++){
                    let row = { name: data.getValue(r,0)||"" };
                    for(let i=1;i<=3;i++){
                        row[`r${i}Team`] = data.getValue(r,(i-1)*2+1)||"";
                        row[`r${i}Pkt1`] = Number(data.getValue(r,(i-1)*2+2))||0;
                    }
                    raw.push(row);
                }

                teams = [...new Set(raw.flatMap(r=>Object.keys(r).filter(k=>k.includes("Team")).map(k=>r[k]).filter(Boolean)))].sort();
                buildTable();
            });
        }

        function buildTable(){
            let html = `<div class="table-wrapper"><table><tr><th>Team</th><th>R1</th><th>R2</th><th>R3</th></tr>`;

            teams.forEach((team, index) => {
                html += `<tr><td class="team" onclick="expandFirstRow(${index})">${team}</td>`;
                for(let r=1; r<=3; r++){
                    const sum = raw.filter(p=>p[`r${r}Team`]===team).reduce((a,b)=>a+b[`r${r}Pkt1`],0);
                    html += `<td class="cell" onclick="toggleDetail('${team.replace(/'/g,"\\'")}',${r},${index})">${sum||"–"}</td>`;
                }
                html += `</tr>
                  <tr id="detail-row-${index}" class="detail-row">
                    <td colspan="4"><div id="detail-div-${index}" class="detail"></div></td>
                  </tr>`;
            });

            html += `</table></div>`;
            document.getElementById("overview").innerHTML = html;
        }

        // Hilfsfunktion: Klick auf Teamnamen öffnet Details für Runde 1
        function expandFirstRow(index) {
            const firstCell = document.querySelector(`tr:nth-child(${(index*2)+2}) td.cell`);
            if(firstCell) firstCell.click();
        }

        function toggleDetail(team, round, index){
            const div = document.getElementById(`detail-div-${index}`);
            
            // Wenn gleicher Inhalt bereits offen ist -> Schließen
            const currentContentId = `${team}-${round}`;
            if(div.style.display === "block" && div.getAttribute('data-active') === currentContentId){
                div.style.display = "none";
                return;
            }

            const list = raw.filter(p=>p[`r${round}Team`]===team);
            if(list.length === 0) return;

            let total = 0;
            // Titel ohne das Wort "Team"
            let html = `<h3>${team} – Runde ${round}</h3>`;
            
            list.forEach(p => {
                const p1 = p[`r${round}Pkt1`] || 0;
                total += p1;
                html += `
                  <div class="player">
                    <div class="name">${p.name}</div>
                    <div class="score">${p1}</div>
                  </div>`;
            });

            // Gesamtzeile: Label linksbündig (fluchtet mit Name), Wert rechtsbündig (fluchtet mit Score)
            html += `
                <div class="total-container">
                    <div class="total-label">Gesamt</div>
                    <div class="total-val">${total}</div>
                </div>`;

            div.innerHTML = html;
            div.style.display = "block";
            div.setAttribute('data-active', currentContentId);
        }
    </script>
</head>

<body>
    <h1>Grenzlandmeisterschaft</h1>
    <div class="subtitle">Übersicht – auf Resultat klicken für Details</div>
    <div id="overview">Lade Daten...</div>
</body>
</html>
